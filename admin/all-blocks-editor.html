<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏｜全站所有板块编辑发布</title><style>
:root{--r:#6b1414;--g:#c9a35a;--bg:#f7f2e7;--card:#fffdf8;--line:#e5d8bf;--ink:#3a2f22;--ok:#2f6b3b;--danger:#a62a20}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{background:linear-gradient(135deg,#5a0f0f,#861b12);color:#f5d887;padding:18px 4vw}.top h1{margin:0}.top p{margin:6px 0;color:#f1dcc0}.wrap{width:min(1500px,96vw);margin:16px auto}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-weight:700;margin:5px 0}input,select,textarea{width:100%;padding:10px;border:1px solid #d8c8b5;border-radius:8px;background:#fff;font:inherit}textarea{min-height:220px;line-height:1.6}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;margin:4px}.primary{background:var(--r);color:#fff}.gold{background:var(--g);color:#35160e}.ok{background:var(--ok);color:#fff}.danger{background:var(--danger);color:#fff}.light{background:#eee7dc;color:#4a4038}.status{padding:10px;border-radius:8px;background:#fff5dd;border:1px solid #dfc18a;white-space:pre-wrap}.success{background:#e9f5eb;color:#276035}.error{background:#fff0ed;color:#9b231a}.layout{display:grid;grid-template-columns:330px 1fr;gap:14px}.groups{display:grid;gap:8px;max-height:calc(100vh - 260px);overflow:auto}.group{padding:11px;border:1px solid var(--line);border-radius:9px;background:#fffaf3}.group h3{margin:0 0 7px;color:var(--r);font-size:15px}.section{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:8px;margin:4px 0;cursor:pointer}.section:hover,.section.on{border-color:var(--g);background:#fff5dc}.section small{display:block;color:#8a7a5f;margin-top:2px}.posts{max-height:240px;overflow:auto;display:grid;gap:6px;margin-bottom:12px}.post{padding:8px;border:1px solid var(--line);border-radius:7px;cursor:pointer;background:#fff}.post.on{border-color:var(--g);background:#fff5dc}.muted{font-size:12px;color:#8a7a5f}@media(max-width:900px){.layout,.grid{grid-template-columns:1fr}.groups{max-height:none}}
</style></head><body><header class="top"><div class="wrap"><h1>🏮 洪盛集藏｜全站所有板块编辑发布</h1><p>网站首页已经存在的各类图标、卡片、研究、交流、评级、保管、福建专题，全部建立独立内容数据入口。可新增、修改、删除并发布。</p></div></header><main class="wrap">
<section class="card"><div class="grid"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="需要 Contents 读写权限"></div></div><button class="btn primary" id="connect">🔄 连接并读取全部板块</button><a class="btn gold" href="management-center.html">↩️ 返回管理中心</a><a class="btn light" href="../" target="_blank">🌐 查看网站</a><div id="status" class="status" style="margin-top:8px">请连接 GitHub。</div></section>
<div class="layout"><aside class="card"><h2>📚 网站全部内容板块</h2><div class="muted">点击任何一个板块即可查看、编辑、发布内容。</div><div id="groups" class="groups" style="margin-top:10px"></div></aside>
<section class="card"><h2 id="sectionTitle">请选择一个板块</h2><div id="sectionPath" class="muted"></div><div class="posts" id="posts"></div><div class="grid"><div><label>标题</label><input id="title"></div><div><label>日期</label><input id="date" type="date"></div><div><label>类型</label><input id="kind" placeholder="文章 / 鉴赏 / 研究 / 交流"></div><div><label>状态</label><select id="itemStatus"><option value="published">已发布</option><option value="draft">草稿</option><option value="hidden">隐藏</option></select></div><div class="wide"><label>摘要 / 导语</label><textarea id="note" style="min-height:100px"></textarea></div><div class="wide"><label>正文内容</label><textarea id="body"></textarea></div><div class="wide"><label>图片路径（一行一个）</label><textarea id="images" style="min-height:90px" placeholder="/assets/content/图片.png"></textarea></div></div><div><button class="btn ok" id="save">💾 保存 / 发布</button><button class="btn primary" id="new">➕ 新发布内容</button><button class="btn danger" id="del">🗑 删除已发布内容</button><button class="btn light" id="clear">↩️ 清空</button></div><div id="editorStatus" class="status" style="margin-top:8px">请选择板块。</div></section></div></main>
<script>
'use strict';const $=id=>document.getElementById(id);let token='',owner='yang79403-wq',repo='yang79403-wq.github.io',branch='main',catalog=[],selectedSection=null,selectedPost=null,sectionData=[];
const groups={
'福建钱币专题':[['fujian_silver','福建银元 铜币','版式、历史与图片资料'],['fujian_ancient','福建古钱 花钱','铸造背景与版别交流'],['fujian_banknote','福建纸币','年份、版式与特征研究'],['fujian_culture','福建货币文化','地方历史与钱币文化资料']],
'钱币研究中心':[['research_silver','老银元收藏研究','袁大头｜船洋｜龙洋'],['research_ancient','古钱币版别研究','清钱｜古泉｜花钱'],['research_banknote','纸币收藏研究','第一至第四套人民币'],['research_commemorative','纪念币研究','流通纪念币｜金银币'],['research_machine','机制币版别研究','年份｜版式｜特征']],
'藏友交流':[['exchange_silver','银元交流','收藏交流与经验分享'],['exchange_ancient','古钱币交流','古钱、花钱交流'],['exchange_banknote','纸币交流','纸币收藏交流'],['exchange_commemorative','纪念币交流','纪念币交流'],['exchange_badge','徽章交流','徽章与像章交流'],['exchange_experience','经验分享','收藏经验分享']],
'藏品保管':[['storage_moisture','防潮','收藏品防潮知识'],['storage_oxidation','防氧化','金属钱币防氧化'],['storage_environment','存放环境','收藏品存放环境'],['storage_box','保护盒','保护盒使用与选择'],['storage_paper','纸币保护','纸币保存方法'],['storage_longterm','长期保存','长期保存与整理']],
'评级知识':[['rating_pcgs','PCGS评级知识','评级知识与标准'],['rating_ngc','NGC评级知识','评级知识与标准'],['rating_pmg','PMG纸币评级知识','纸币评级知识'],['rating_huaxia','华夏评级知识','送评知识与流程']],
'历史与文化研究':[['history_background','历史背景','钱币历史背景资料'],['craft_minting','铸造工艺','铸造工艺研究'],['coin_culture','钱币文化','钱币文化传播'],['classic_literature','经典文献','经典文献与研究资料']],
'首页服务图标':[['service_collection_exchange','收藏交流','藏品展示、经验分享'],['service_appreciation','鉴赏参考','图片资料、交流分析'],['service_condition','品相研究','磨损包浆、状态学习'],['service_knowledge','收藏知识','方向规划、知识学习'],['service_market','市场资讯','热点行情、趋势观察'],['service_authenticity','真伪知识','辨识思路、经验学习'],['service_popularization','收藏普及','版别历史、文化知识'],['service_display','藏品展示','图片资料、展示空间']]
};
const existing=[['appreciation','收藏学院'],['fujian','福建钱币'],['history','钱币历史'],['knowledge','评级知识'],['tongqian','古钱币'],['tongyuan','铜元'],['yinyuan_jizhibi','银元 / 机制币'],['zhibi','纸币']];
function api(p){return `https://api.github.com/repos/${owner}/${repo}/contents/${p}?ref=${encodeURIComponent(branch)}`}function hdr(){return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'}}function setMsg(el,t,ok=false){el.textContent=t;el.className='status '+(ok?'success':'error')}
async function getFile(p){const r=await fetch(api(p),{headers:hdr()});if(!r.ok)throw Error(p+' '+r.status);const j=await r.json();const b=Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0));return {sha:j.sha,json:JSON.parse(new TextDecoder().decode(b))}}
async function putFile(p,obj,sha,message){const b=new TextEncoder().encode(JSON.stringify(obj,null,2));let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode(...b.subarray(i,i+32768));const body={message,content:btoa(s),branch};if(sha)body.sha=sha;const r=await fetch(api(p),{method:'PUT',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text())}
async function delFile(p,sha){const r=await fetch(api(p),{method:'DELETE',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify({message:'后台删除板块内容',sha,branch})});if(!r.ok)throw Error(await r.text())}
function buildCatalog(){catalog=[];Object.entries(groups).forEach(([g,arr])=>arr.forEach(x=>catalog.push({group:g,id:x[0],name:x[1],desc:x[2]})));existing.forEach(x=>catalog.push({group:'原有内容板块',id:x[0],name:x[1],desc:'原有正式网站内容数据'}));renderGroups()}
function renderGroups(){const root=$('groups');const all={};catalog.forEach(x=>(all[x.group]??=[]).push(x));root.innerHTML=Object.entries(all).map(([g,arr])=>`<div class="group"><h3>${g}</h3>${arr.map(x=>`<button class="section" data-id="${x.id}"><b>${x.name}</b><small>${x.desc}</small></button>`).join('')}</div>`).join('');document.querySelectorAll('.section').forEach(b=>b.onclick=()=>selectSection(b.dataset.id))}
function clearEditor(){selectedPost=null;$('title').value='';$('date').value=new Date().toISOString().slice(0,10);$('kind').value='';$('note').value='';$('body').value='';$('images').value='';$('itemStatus').value='published';$('sectionPath').textContent=selectedSection?'data/content/'+selectedSection+'.json':'';document.querySelectorAll('.post').forEach(x=>x.classList.remove('on'))}
async function selectSection(id){selectedSection=id;selectedPost=null;const meta=catalog.find(x=>x.id===id);$('sectionTitle').textContent='📝 '+(meta?.name||id);$('sectionPath').textContent='data/content/'+id+'.json';clearEditor();try{const d=await getFile('data/content/'+id+'.json');sectionData=Array.isArray(d.json)?d.json:[];renderPosts();setMsg($('editorStatus'),`已打开「${meta?.name||id}」：${sectionData.length} 条内容。可以新增、修改、删除。`,true)}catch(e){sectionData=[];$('posts').innerHTML='';setMsg($('editorStatus'),'该板块数据文件尚未创建：'+e.message)}}
function renderPosts(){const root=$('posts');root.innerHTML=sectionData.map((x,i)=>`<div class="post ${selectedPost===i?'on':''}" data-i="${i}"><b>${String(x.title||x.name||'无标题')}</b><div class="muted">${x.date||''}｜${x.status||'published'}</div></div>`).join('')||'<div class="muted">暂无内容，点击“新发布内容”开始。</div>';root.querySelectorAll('.post').forEach(p=>p.onclick=()=>editPost(+p.dataset.i))}
function editPost(i){selectedPost=i;const x=sectionData[i];$('title').value=x.title||x.name||'';$('date').value=x.date||'';$('kind').value=x.kind||'';$('note').value=x.note||'';$('body').value=x.content||x.body||'';$('images').value=Array.isArray(x.images)?x.images.join('\n'):'';$('itemStatus').value=x.status||'published';renderPosts();setMsg($('editorStatus'),'已载入内容，可修改后保存。',true)}
async function save(){try{if(!selectedSection)throw Error('请先选择网站板块');const path='data/content/'+selectedSection+'.json';const d=await getFile(path);let arr=Array.isArray(d.json)?d.json:[];const obj=selectedPost===null?{id:'article_'+Date.now()}:Object.assign({},arr[selectedPost]);obj.title=$('title').value.trim();if(!obj.title)throw Error('标题不能为空');obj.date=$('date').value;obj.kind=$('kind').value.trim();obj.note=$('note').value;obj.content=$('body').value;obj.images=$('images').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);obj.status=$('itemStatus').value;if(selectedPost===null)arr.unshift(obj);else arr[selectedPost]=obj;await putFile(path,arr,d.sha,'后台发布或修改板块内容');sectionData=arr;renderPosts();setMsg($('editorStatus'),'保存成功，已写入该板块数据源。等待网站发布。',true)}catch(e){setMsg($('editorStatus'),e.message)}}
async function remove(){try{if(selectedSection===null||selectedPost===null)throw Error('请先选择已发布内容');if(!confirm('确定删除这条已发布内容吗？'))return;const path='data/content/'+selectedSection+'.json';const d=await getFile(path);const arr=Array.isArray(d.json)?d.json:[];arr.splice(selectedPost,1);await putFile(path,arr,d.sha,'后台删除板块内容');sectionData=arr;clearEditor();renderPosts();setMsg($('editorStatus'),'删除成功。',true)}catch(e){setMsg($('editorStatus'),e.message)}}
$('connect').onclick=async()=>{try{token=$('token').value.trim();owner=$('owner').value.trim();repo=$('repo').value.trim();branch=$('branch').value.trim();if(!token)throw Error('请填写 GitHub Token');buildCatalog();setMsg($('status'),`已载入 ${catalog.length} 个可编辑内容板块。`,true)}catch(e){setMsg($('status'),e.message)}};$('save').onclick=save;$('del').onclick=remove;$('new').onclick=()=>{selectedPost=null;clearEditor();setMsg($('editorStatus'),'新发布模式：填写内容后点击保存 / 发布。',true)};$('clear').onclick=clearEditor;buildCatalog();
</script></body></html>
