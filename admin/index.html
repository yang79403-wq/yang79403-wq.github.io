<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6b1414">
<title>洪盛集藏资讯网 · 管理后台</title>
<style>
:root{--red:#8f1d1d;--gold:#c9a35a;--cream:#f7f2e7;--ink:#3a2f22}
*{box-sizing:border-box}body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(720px,100%);background:#fffdf8;border:1px solid #e8ddc4;border-radius:16px;box-shadow:0 10px 32px rgba(58,47,34,.08);padding:28px}
.brand{display:flex;align-items:center;gap:14px}.emblem{width:54px;height:54px;border-radius:50%;background:var(--red);color:#e8cf9a;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700;border:2px solid var(--gold)}
h1{margin:0;color:#6b1414;font-size:26px}.sub{margin-top:4px;color:#8a7a5f;font-size:13px}p{line-height:1.8;color:#6f634f}.actions{display:grid;gap:12px;margin-top:20px}.btn{display:block;text-align:center;padding:14px 16px;border-radius:8px;text-decoration:none;font-weight:700;font-size:16px;border:0;cursor:pointer}.primary{background:var(--red);color:#fff}.secondary{background:var(--gold);color:#5a3d0a}.status{margin-top:16px;padding:12px 14px;border-radius:8px;background:#eef7ef;border:1px solid #cfe4d1;color:#365d3a;font-size:13px;line-height:1.7}.tip{margin-top:16px;background:#f3ead8;border:1px solid #e4d6b7;border-radius:8px;padding:12px 14px;font-size:12.5px;line-height:1.8}code{background:#efe6d3;padding:2px 6px;border-radius:4px}@media(max-width:600px){body{padding:12px}.card{padding:22px}.actions{gap:10px}h1{font-size:22px}}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="emblem">洪</div><div><h1>洪盛集藏资讯网</h1><div class="sub">可视化内容管理后台</div></div></div>
  <p>登录后进入真正的内容管理界面，可发布、修改和删除收藏资讯、每日行情、福建钱币、收藏学院内容，并管理图片与网站设置。</p>
  <div class="actions">
    <a class="btn primary" href="./cms.html">进入内容管理</a>
    <a class="btn secondary" href="../">返回网站首页</a>
  </div>
  <div class="status">后台服务：Netlify Identity + Git Gateway + Decap CMS</div>
  <div class="tip"><strong>管理入口：</strong><code>/admin/</code>　<strong>内容配置：</strong><code>/admin/config.yml</code></div>
</main>
</body>
</html>
