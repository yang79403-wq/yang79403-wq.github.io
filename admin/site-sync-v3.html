<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏｜网站同步管理 V3</title><style>body{margin:0;background:#f7f2e7;color:#3a2f22;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.top{background:#6b1414;color:#f7d98d;padding:22px 0}.top h1{margin:0;font-size:28px}.card{background:#fffdf8;border:1px solid #e8ddc4;border-radius:12px;padding:18px;margin:16px 0}.btn{display:inline-block;padding:11px 16px;border:0;border-radius:8px;background:#7f1a1a;color:#fff;font-weight:700;cursor:pointer;text-decoration:none}.gold{background:#c9a35a;color:#35140f}.status{margin-top:12px;padding:11px;border-radius:8px;background:#fff5dd;border:1px solid #dfc18a}.ok{background:#e9f5eb;color:#276035;border-color:#b8d9bd}.err{background:#fff1ee;color:#9b231a;border-color:#e0aaa2}.item{border:1px solid #e8ddc4;padding:13px;border-radius:9px;margin:8px 0;background:#fffaf3;line-height:1.7}.muted{color:#8a7a5f;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.count{font-size:28px;font-weight:800;color:#7f1a1a}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.top h1{font-size:21px}}</style></head><body><header class="top"><div class="wrap"><h1>🏮 洪盛集藏｜网站同步管理 V3</h1><div>唯一基准：当前前台 index.html + GitHub 数据文件</div></div></header><main class="wrap"><section class="card"><button class="btn" id="load">🔄 重新读取当前网站</button> <a class="btn gold" href="../" target="_blank">🌐 打开当前网站</a><div id="status" class="status">准备读取……</div></section><section class="card"><h2>📌 当前网站真实内容</h2><div id="site">读取中……</div></section><section class="card"><h2>📰 当前内容数据</h2><div id="content">读取中……</div></section><section class="card"><h2>📊 当前行情数据</h2><div id="market">读取中……</div></section></main><script>
const owner='yang79403-wq',repo='yang79403-wq.github.io',branch='main',raw='https://raw.githubusercontent.com/'+owner+'/'+repo+'/'+branch+'/';
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
async function rawText(path){const r=await fetch(raw+path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(path+' 读取失败 HTTP '+r.status);return await r.text()}
async function json(path){return JSON.parse(await rawText(path))}
function strip(v){return String(v??'').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim()}
function renderList(arr,type){if(!Array.isArray(arr))arr=[arr];if(!arr.length)return '<div class="item">当前没有数据</div>';return arr.slice(0,50).map((x,i)=>{const title=strip(x.title||x.name||x.id||('第 '+(i+1)+' 条'));const date=strip(x.date||x.updatedAt||'');const note=strip(x.summary||x.note||x.description||'');const price=strip(x.price||x.priceRange||'');const trend=strip(x.trend||'');return '<div class="item"><b>'+esc(title)+'</b>'+(date?' <span class="muted">'+esc(date)+'</span>':'')+(type==='market'&&price?' <strong> '+esc(price)+'</strong>':'')+(type==='market'&&trend?' '+esc(trend):'')+(note?'<div class="muted">'+esc(note)+'</div>':'')+'</div>'}).join('')}
async function load(){
 $('status').className='status';$('status').textContent='正在读取当前前台 index.html 与 GitHub 数据文件……';$('site').textContent='读取中……';$('content').textContent='读取中……';$('market').textContent='读取中……';
 try{
  const html=await rawText('index.html');
  const title=strip((html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1]||'');
  const h1=strip((html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i)||[])[1]||'');
  const h2=[...html.matchAll(/<h2[^>]*>([\s\S]*?)<\/h2>/gi)].map(m=>strip(m[1])).filter(Boolean).slice(0,20);
  let cfg={};try{const outer=await json('data/site-config.json');cfg=typeof outer.content==='string'?JSON.parse(outer.content):outer}catch(e){cfg={}}
  $('site').innerHTML='<div class="grid"><div class="item"><b>网页标题</b><br>'+esc(title)+'</div><div class="item"><b>主标题</b><br>'+esc(h1)+'</div><div class="item wide"><b>当前栏目</b><br>'+esc(h2.join(' · '))+'</div><div class="item"><b>配置网站名</b><br>'+esc(cfg.siteName||'')+'</div><div class="item"><b>配置首页标题</b><br>'+esc(cfg.heroTitle||'')+'</div></div>';
  let contentFiles=[];try{const d=await (await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/contents/data/content?ref='+branch+'&t='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github+json'}})).json();if(Array.isArray(d))contentFiles=d.filter(x=>x.type==='file'&&x.name.endsWith('.json')).map(x=>x.name)}catch(e){}
  let marketFiles=[];try{const d=await (await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/contents/data/market?ref='+branch+'&t='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github+json'}})).json();if(Array.isArray(d))marketFiles=d.filter(x=>x.type==='file'&&x.name.endsWith('.json')).map(x=>x.name)}catch(e){}
  const contentData=[];for(const f of contentFiles){try{const v=await json('data/content/'+f);if(Array.isArray(v))contentData.push(...v);else if(v&&typeof v==='object')contentData.push(v)}catch(e){}}
  const marketData=[];for(const f of marketFiles){try{const v=await json('data/market/'+f);if(Array.isArray(v))marketData.push(...v);else if(v&&typeof v==='object')marketData.push(v)}catch(e){}}
  $('content').innerHTML='<div class="item"><span class="count">'+contentData.length+'</span> 条内容，来自 '+contentFiles.length+' 个数据文件</div>'+renderList(contentData,'content');
  $('market').innerHTML='<div class="item"><span class="count">'+marketData.length+'</span> 条行情，来自 '+marketFiles.length+' 个数据文件</div>'+renderList(marketData,'market');
  $('status').className='status ok';$('status').textContent='✅ 读取成功：以上内容来自当前 main 分支的真实前台与数据文件，不再依赖旧版 CMS。';
 }catch(e){$('status').className='status err';$('status').textContent='❌ 读取失败：'+e.message+'。请点击“重新读取当前网站”重试。';$('site').textContent='读取失败';$('content').textContent='读取失败';$('market').textContent='读取失败'}
}
$('load').onclick=load;load();
</script></body></html>
