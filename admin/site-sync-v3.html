<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏｜网站同步管理 V3</title><style>body{margin:0;background:#f7f2e7;color:#3a2f22;font-family:"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.top{background:#6b1414;color:#f7d98d;padding:18px}.card{background:#fffdf8;border:1px solid #e8ddc4;border-radius:10px;padding:16px;margin:14px 0}button{padding:10px 15px;border:0;border-radius:7px;background:#7f1a1a;color:#fff;font-weight:700;cursor:pointer}.ok{background:#e9f5eb;color:#276035;padding:10px;border-radius:7px}.err{background:#fff1ee;color:#9b231a;padding:10px;border-radius:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #e8ddc4;padding:12px;border-radius:8px;margin:8px 0;background:#fffaf3}.muted{color:#8a7a5f;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><h1>🏮 洪盛集藏｜网站同步管理 V3</h1><div>唯一基准：当前前台 index.html + GitHub 数据文件</div></div></header><main class="wrap"><div class="card"><button id="load">重新读取当前网站</button><div id="status" class="muted" style="margin-top:10px">正在读取……</div></div><div class="card"><h2>当前网站真实内容</h2><div id="site"></div></div><div class="card"><h2>当前内容数据</h2><div id="content"></div></div><div class="card"><h2>当前行情数据</h2><div id="market"></div></div></main><script>const owner='yang79403-wq',repo='yang79403-wq.github.io',branch='main',API='https://api.github.com';const $=s=>document.querySelector(s);function dec(b){return decodeURIComponent(escape(atob(String(b).replace(/\s/g,''))))}async function get(p){const r=await fetch(`${API}/repos/${owner}/${repo}/contents/${p}?ref=${branch}`,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error((await r.json()).message||('HTTP '+r.status));return r.json()}function text(s){return String(s).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').trim()}async function load(){try{$('#status').textContent='正在读取 index.html 与实际数据……';const [index,content,market,cfg]=await Promise.all([get('index.html'),get('data/content/fujian.json'),get('data/market/fujian_yinyuan.json'),get('data/site-config.json')]);const html=dec(index.content),c=JSON.parse(dec(content.content)),m=JSON.parse(dec(market.content));const configOuter=JSON.parse(dec(cfg.content));const cfg=typeof configOuter.content==='string'?JSON.parse(configOuter.content):configOuter;const title=text((html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1]||'');const h1=text((html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i)||[])[1]||'');const h2=[...html.matchAll(/<h2[^>]*>([\s\S]*?)<\/h2>/gi)].map(x=>text(x[1])).filter(Boolean).slice(0,12);$('#site').innerHTML='<div class=item><b>网页标题：</b>'+title+'</div><div class=item><b>主标题：</b>'+h1+'</div><div class=item><b>栏目：</b>'+h2.join(' · ')+'</div><div class=item><b>配置网站名：</b>'+text(cfg.siteName||'')+'</div>';const cArr=Array.isArray(c)?c:[c];$('#content').innerHTML=cArr.slice(0,20).map(x=>'<div class=item><b>'+text(x.title||x.name||x.id||'未命名')+'</b><div class=muted>'+text(x.date||'')+'</div></div>').join('')||'<div class=item>当前内容文件为空</div>';const mArr=Array.isArray(m)?m:[m];$('#market').innerHTML=mArr.slice(0,20).map(x=>'<div class=item><b>'+text(x.title||x.name||'未命名')+'</b>　'+text(x.price||x.priceRange||'')+'　'+text(x.trend||'')+'<div class=muted>'+text(x.date||'')+'</div></div>').join('')||'<div class=item>当前行情文件为空</div>';$('#status').className='ok';$('#status').textContent='✅ 已按当前前台与实际数据文件读取，没有使用旧版 CMS 数据。'}catch(e){$('#status').className='err';$('#status').textContent='❌ '+e.message}}$('#load').onclick=load;load()</script></body></html>
