<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏｜板块内容管理</title><style>:root{--r:#6b1414;--g:#c9a35a;--bg:#f7f2e7;--card:#fffdf8;--line:#e5d8bf;--ink:#3a2f22;--ok:#2f6b3b;--bad:#a62a20}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{background:linear-gradient(135deg,#5a0f0f,#861b12);color:#f5d887;padding:18px 4vw}.top h1{margin:0;font-size:25px}.top p{margin:6px 0;color:#f1dcc0}.wrap{width:min(1500px,96vw);margin:16px auto}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-weight:700;margin:5px 0}input,select,textarea{width:100%;padding:10px;border:1px solid #d8c8b5;border-radius:8px;background:#fff;font:inherit}textarea{min-height:220px;line-height:1.6}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;margin:4px}.primary{background:var(--r);color:#fff}.gold{background:var(--g);color:#35160e}.ok{background:var(--ok);color:#fff}.danger{background:var(--bad);color:#fff}.light{background:#eee7dc;color:#4a4038}.status{padding:10px;border-radius:8px;background:#fff5dd;border:1px solid #dfc18a;white-space:pre-wrap}.success{background:#e9f5eb;color:#276035}.error{background:#fff0ed;color:#9b231a}.layout{display:grid;grid-template-columns:350px 1fr;gap:14px}.groups{display:grid;gap:8px;max-height:calc(100vh - 280px);overflow:auto}.group{padding:11px;border:1px solid var(--line);border-radius:9px;background:#fffaf3}.group h3{margin:0 0 7px;color:var(--r);font-size:15px}.section{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:8px;margin:4px 0;cursor:pointer}.section:hover,.section.on{border-color:var(--g);background:#fff5dc}.section small{display:block;color:#8a7a5f;margin-top:2px}.posts{max-height:240px;overflow:auto;display:grid;gap:6px;margin-bottom:12px}.post{padding:8px;border:1px solid var(--line);border-radius:7px;cursor:pointer;background:#fff}.post.on{border-color:var(--g);background:#fff5dc}.muted{font-size:12px;color:#8a7a5f}@media(max-width:900px){.layout,.grid{grid-template-columns:1fr}.groups{max-height:none}}</style></head><body><header class="top"><div class="wrap"><h1>🏮 洪盛集藏｜板块内容管理中心</h1><p>全中文菜单｜所有网站板块均可独立发布、修改、删除内容</p></div></header><main class="wrap"><section class="card"><div class="grid"><div><label>数据账户</label><input id="owner" value="yang79403-wq"></div><div><label>网站仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>数据分支</label><input id="branch" value="main"></div><div><label>授权密钥</label><input id="token" type="password" placeholder="请输入具有网站内容读写权限的授权密钥"></div></div><button class="btn primary" id="connect">🔄 连接并读取全部板块</button><a class="btn gold" href="management-center.html">↩️ 返回管理中心</a><a class="btn light" href="../" target="_blank">🌐 查看网站</a><div id="status" class="status" style="margin-top:8px">请先连接数据仓库。</div></section><div class="layout"><aside class="card"><h2>📚 网站全部板块</h2><div class="muted">选择板块后，在右侧管理该板块的全部内容。</div><div id="groups" class="groups" style="margin-top:10px"></div></aside><section class="card"><h2 id="sectionTitle">请选择一个板块</h2><div id="sectionPath" class="muted"></div><div class="posts" id="posts"></div><div class="grid"><div><label>标题</label><input id="title"></div><div><label>日期</label><input id="date" type="date"></div><div><label>内容类型</label><select id="kind"><option>文章</option><option>鉴赏</option><option>研究</option><option>交流</option><option>历史</option><option>知识</option><option>行情资料</option><option>公告</option></select></div><div><label>发布状态</label><select id="state"><option value="published">已发布</option><option value="draft">草稿</option><option value="hidden">隐藏</option></select></div><div class="wide"><label>摘要 / 导语</label><textarea id="note" style="min-height:100px"></textarea></div><div class="wide"><label>正文内容</label><textarea id="body"></textarea></div><div class="wide"><label>图片地址（一行一个）</label><textarea id="images" style="min-height:90px" placeholder="例如：/assets/content/图片.png"></textarea></div></div><button class="btn ok" id="save">💾 保存并发布</button><button class="btn primary" id="new">➕ 新建内容</button><button class="btn danger" id="del">🗑 删除内容</button><button class="btn light" id="clear">↩️ 清空编辑区</button><div id="editorStatus" class="status" style="margin-top:8px">请选择板块。</div></section></div></main><script>'use strict';const $=id=>document.getElementById(id);let token='',owner='yang79403-wq',repo='yang79403-wq.github.io',branch='main',catalog=[],selectedSection=null,selectedPost=null,sectionData=[];const groups={'福建钱币专题':[['fujian_silver','福建银元 铜币','版式、历史与图片资料'],['fujian_ancient','福建古钱 花钱','铸造背景与版别交流'],['fujian_banknote','福建纸币','年份、版式与特征研究'],['fujian_culture','福建货币文化','地方历史与钱币文化资料']],'钱币研究中心':[['research_silver','老银元收藏研究','袁大头｜船洋｜龙洋'],['research_ancient','古钱币版别研究','清钱｜古泉｜花钱'],['research_banknote','纸币收藏研究','第一至第四套人民币'],['research_commemorative','纪念币研究','流通纪念币｜金银币'],['research_machine','机制币版别研究','年份｜版式｜特征']],'藏友交流':[['exchange_silver','银元交流','收藏交流与经验分享'],['exchange_ancient','古钱币交流','古钱、花钱交流'],['exchange_banknote','纸币交流','纸币收藏交流'],['exchange_commemorative','纪念币交流','纪念币交流'],['exchange_badge','徽章交流','徽章与像章交流'],['exchange_experience','经验分享','收藏经验分享']],'藏品保管':[['storage_moisture','防潮','收藏品防潮知识'],['storage_oxidation','防氧化','金属钱币防氧化'],['storage_environment','存放环境','收藏品存放环境'],['storage_box','保护盒','保护盒使用与选择'],['storage_paper','纸币保护','纸币保存方法'],['storage_longterm','长期保存','长期保存与整理']],'评级知识':[['rating_pcgs','PCGS评级知识','评级知识与标准'],['rating_ngc','NGC评级知识','评级知识与标准'],['rating_pmg','PMG纸币评级知识','纸币评级知识'],['rating_huaxia','华夏评级知识','送评知识与流程']],'历史与文化研究':[['history_background','历史背景','钱币历史背景资料'],['craft_minting','铸造工艺','铸造工艺研究'],['coin_culture','钱币文化','钱币文化传播'],['classic_literature','经典文献','经典文献与研究资料']],'首页服务图标':[['service_collection_exchange','收藏交流','藏品展示、经验分享'],['service_appreciation','鉴赏参考','图片资料、交流分析'],['service_condition','品相研究','磨损包浆、状态学习'],['service_knowledge','收藏知识','方向规划、知识学习'],['service_market','市场资讯','热点行情、趋势观察'],['service_authenticity','真伪知识','辨识思路、经验学习'],['service_popularization','收藏普及','版别历史、文化知识'],['service_display','藏品展示','图片资料、展示空间']],'原有内容板块':[['appreciation','收藏学院','原有正式网站内容数据'],['fujian','福建钱币','原有正式网站内容数据'],['history','钱币历史','原有正式网站内容数据'],['knowledge','评级知识','原有正式网站内容数据'],['tongqian','古钱币','原有正式网站内容数据'],['tongyuan','铜元','原有正式网站内容数据'],['yinyuan_jizhibi','银元 / 机制币','原有正式网站内容数据'],['zhibi','纸币','原有正式网站内容数据']]};function api(p){return `https://api.github.com/repos/${owner}/${repo}/contents/${p}?ref=${encodeURIComponent(branch)}`}function hdr(){return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'}}function message(el,t,ok=false){el.textContent=t;el.className='status '+(ok?'success':'error')}async function getFile(p){const r=await fetch(api(p),{headers:hdr()});if(!r.ok)throw Error('读取失败：'+r.status);const j=await r.json();const b=Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0));return{sha:j.sha,json:JSON.parse(new TextDecoder().decode(b))}}async function putFile(p,obj,sha,msg){const b=new TextEncoder().encode(JSON.stringify(obj,null,2));let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode(...b.subarray(i,i+32768));const body={message:msg,content:btoa(s),branch};if(sha)body.sha=sha;const r=await fetch(api(p),{method:'PUT',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('保存失败：'+await r.text())}async function delFile(p,sha){const r=await fetch(api(p),{method:'DELETE',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify({message:'删除网站板块内容',sha,branch})});if(!r.ok)throw Error('删除失败：'+await r.text())}function build(){catalog=[];Object.entries(groups).forEach(([g,a])=>a.forEach(x=>catalog.push({group:g,id:x[0],name:x[1],desc:x[2]})));const root=$('groups');root.innerHTML=Object.entries(groups).map(([g,a])=>`<div class="group"><h3>${g}</h3>${a.map(x=>`<button class="section" data-id="${x[0]}"><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div>`).join('');document.querySelectorAll('.section').forEach(b=>b.onclick=()=>openSection(b.dataset.id))}function clearEditor(){selectedPost=null;$('title').value='';$('date').value=new Date().toISOString().slice(0,10);$('kind').value='文章';$('note').value='';$('body').value='';$('images').value='';$('state').value='published';document.querySelectorAll('.post').forEach(x=>x.classList.remove('on'))}async function openSection(id){selectedSection=id;const m=catalog.find(x=>x.id===id);$('sectionTitle').textContent='📝 '+m.name;$('sectionPath').textContent='内容数据：data/content/'+id+'.json';clearEditor();try{const d=await getFile('data/content/'+id+'.json');sectionData=Array.isArray(d.json)?d.json:[];render();message($('editorStatus'),`已打开「${m.name}」，共有 ${sectionData.length} 条内容。`,true)}catch(e){sectionData=[];render();message($('editorStatus'),'该板块暂时没有数据文件，可以直接点击“新建内容”。',true)}}function render(){const root=$('posts');root.innerHTML=sectionData.map((x,i)=>`<div class="post ${selectedPost===i?'on':''}" data-i="${i}"><b>${String(x.title||x.name||'无标题')}</b><div class="muted">${x.date||''}｜${x.status||'已发布'}</div></div>`).join('')||'<div class="muted">暂无内容。</div>';root.querySelectorAll('.post').forEach(p=>p.onclick=()=>edit(+p.dataset.i))}function edit(i){selectedPost=i;const x=sectionData[i];$('title').value=x.title||x.name||'';$('date').value=x.date||'';$('kind').value=x.kind||'文章';$('note').value=x.note||'';$('body').value=x.content||x.body||'';$('images').value=Array.isArray(x.images)?x.images.join('\n'):'';$('state').value=x.status||'published';render();message($('editorStatus'),'已载入内容，可以修改后保存。',true)}async function save(){try{if(!selectedSection)throw Error('请先选择板块');const p='data/content/'+selectedSection+'.json',d=await getFile(p);let a=Array.isArray(d.json)?d.json:[];let x=selectedPost===null?{id:'article_'+Date.now()}:Object.assign({},a[selectedPost]);x.title=$('title').value.trim();if(!x.title)throw Error('标题不能为空');x.date=$('date').value;x.kind=$('kind').value;x.note=$('note').value;x.content=$('body').value;x.images=$('images').value.split(/\n+/).map(v=>v.trim()).filter(Boolean);x.status=$('state').value;if(selectedPost===null)a.unshift(x);else a[selectedPost]=x;await putFile(p,a,d.sha,selectedPost===null?'新增网站板块内容':'修改网站板块内容');sectionData=a;render();message($('editorStatus'),'保存成功，网站前台会读取最新内容。',true)}catch(e){message($('editorStatus'),e.message)}}async function remove(){try{if(!selectedSection||selectedPost===null)throw Error('请先选择要删除的内容');if(!confirm('确定删除这条内容吗？'))return;const p='data/content/'+selectedSection+'.json',d=await getFile(p);let a=Array.isArray(d.json)?d.json:[];a.splice(selectedPost,1);await putFile(p,a,d.sha,'删除网站板块内容');sectionData=a;clearEditor();render();message($('editorStatus'),'删除成功。',true)}catch(e){message($('editorStatus'),e.message)}}$('connect').onclick=async()=>{token=$('token').value.trim();owner=$('owner').value.trim();repo=$('repo').value.trim();branch=$('branch').value.trim()||'main';if(!token)return message($('status'),'请输入授权密钥。');try{await getFile('data/site-config.json');build();message($('status'),'连接成功，全部中文板块已经载入。',true)}catch(e){message($('status'),'连接失败，请检查授权密钥、账户或网站仓库。')}};$('new').onclick=()=>{if(!selectedSection)return message($('editorStatus'),'请先选择板块。');clearEditor();message($('editorStatus'),'已进入新建模式。',true)};$('clear').onclick=clearEditor;$('save').onclick=save;$('del').onclick=remove;build();</script></body></html>
