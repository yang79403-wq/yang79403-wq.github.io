<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>洪盛集藏｜内容管理 V2</title>
<style>
:root{--r:#6b1414;--g:#c9a35a;--bg:#f7f2e7;--card:#fffdf8;--text:#3a2f22;--muted:#8a7a5f;--line:#e8ddc4;--ok:#2f6b3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}.wrap{width:min(1180px,94vw);margin:auto}.top{background:linear-gradient(135deg,#6b1414,#861b12);color:#f7d98d;padding:20px 0}.top h1{margin:0;font-size:24px}.top p{margin:7px 0 0;color:#f1dcc0;font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:16px 0;box-shadow:0 3px 12px rgba(80,40,10,.04)}h2{margin:0 0 14px;color:var(--r);font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-weight:700;margin:3px 0 6px}input,textarea,select{width:100%;border:1px solid #d8c8b5;border-radius:8px;padding:11px;background:#fff;color:var(--text);font:inherit}textarea{min-height:130px;resize:vertical}.btn{display:inline-block;border:0;border-radius:8px;padding:10px 15px;margin:4px 4px 0 0;font-weight:700;cursor:pointer;text-decoration:none}.red{background:var(--r);color:#fff}.gold{background:var(--g);color:#32130d}.green{background:var(--ok);color:#fff}.gray{background:#766c65;color:#fff}.danger{background:#a52b20;color:#fff}.status{margin-top:10px;padding:11px;border-radius:8px;background:#fff5dd;border:1px solid #dfc18a;white-space:pre-wrap}.status.ok{background:#e9f5eb;border-color:#b8d9bd}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff8ea;border:1px solid var(--line);border-radius:9px;padding:12px;text-align:center}.stat b{display:block;font-size:22px;color:var(--r)}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;color:var(--r);font-weight:700;cursor:pointer;white-space:nowrap}.tab.on{background:var(--r);color:#fff}.hide{display:none}.row{border:1px solid var(--line);background:#fffaf3;border-radius:9px;padding:12px;margin:8px 0}.muted{font-size:12px;color:var(--muted);margin-top:5px}.tag{display:inline-block;padding:3px 7px;border-radius:20px;background:#eadbc3;font-size:11px;margin-left:6px}.pub{background:#e5f3e8;color:#276035}.snapshot{background:#2b1712;color:#f5dfae;border-radius:10px;padding:16px;line-height:1.8}.snapshot strong{color:#f0c96f}.filelist{max-height:300px;overflow:auto}.empty{padding:14px;color:var(--muted)}@media(max-width:700px){.grid,.stats{grid-template-columns:1fr}.wide{grid-column:auto}.top h1{font-size:20px}}
</style></head>
<body>
<header class="top"><div class="wrap"><h1>🏮 洪盛集藏｜网站内容管理 V2</h1><p>读取当前 GitHub 网站真实文件。读取无需 Token，只有保存/发布时才需要 Token。</p></div></header>
<main class="wrap">
<section class="card"><h2>🔎 当前网站实时读取</h2><div class="grid"><div><label>用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token（仅发布时需要）</label><input id="token" type="password" placeholder="读取网站无需填写"></div></div><button class="btn red" id="load">🔄 重新读取当前网站</button><a class="btn gold" href="../" target="_blank">🌐 打开网站</a><div id="status" class="status">正在自动读取……</div></section>
<section id="stats" class="stats"></section>
<section class="card"><h2>🖥️ 当前前台网站快照</h2><div id="snapshot" class="snapshot">读取中……</div></section>
<nav class="tabs"><button class="tab on" data-tab="content">📰 网站内容</button><button class="tab" data-tab="market">📊 行情</button><button class="tab" data-tab="config">🏠 配置</button></nav>
<section id="content">
<section class="card"><h2>当前内容文件</h2><div class="grid"><div><label>内容文件</label><select id="contentFile"></select></div><div><label>搜索</label><input id="search" placeholder="标题 / ID / 福建 / 银元 / 纸币……"></div></div><div id="contentList"></div></section>
<section class="card"><h2>✏️ 编辑当前内容</h2><div class="grid"><div><label>ID</label><input id="id"></div><div><label>标题</label><input id="title"></div><div><label>日期</label><input id="date" type="date"></div><div><label>分类</label><input id="category"></div><div><label>状态</label><select id="state"><option value="published">已发布</option><option value="draft">草稿</option><option value="hidden">隐藏</option></select></div><div><label>栏目</label><input id="group"></div><div class="wide"><label>摘要/说明</label><textarea id="summary"></textarea></div><div class="wide"><label>正文</label><textarea id="body" style="min-height:300px"></textarea></div><div class="wide"><label>图片路径（一行一张）</label><textarea id="images"></textarea></div></div><button class="btn green" id="save">💾 保存并发布</button><button class="btn gold" id="saveDraft">📝 保存草稿</button><button class="btn danger" id="remove">🗑 删除</button><button class="btn gray" id="new">＋ 新建</button></section>
</section>
<section id="market" class="hide"><section class="card"><h2>📊 当前行情库</h2><div id="marketList"></div></section><section class="card"><h2>➕ 新增行情</h2><div class="grid"><div><label>行情文件</label><select id="marketFile"></select></div><div><label>品种</label><input id="mTitle"></div><div><label>价格</label><input id="mPrice"></div><div><label>趋势</label><select id="mTrend"><option>↑</option><option>→</option><option>↓</option></select></div><div class="wide"><label>说明</label><textarea id="mNote"></textarea></div></div><button class="btn green" id="addMarket">💾 保存行情</button></section></section>
<section id="config" class="hide"><section class="card"><h2>🏠 网站配置</h2><div class="grid"><div><label>网站名称</label><input id="siteName"></div><div><label>首页标题</label><input id="heroTitle"></div><div class="wide"><label>首页介绍</label><textarea id="heroText"></textarea></div><div class="wide"><label>顶部公告</label><textarea id="topNotice"></textarea></div></div><button class="btn gold" id="saveConfig">💾 保存配置</button></section></section>
</main>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], API='https://api.github.com';
let files=[],markets=[],data=[],path='',sha='',sel=-1;
const base=()=>`/repos/${$('#owner').value.trim()}/${$('#repo').value.trim()}`;
const ref=()=>encodeURIComponent($('#branch').value.trim()||'main');
const token=()=>$('#token').value.trim();
function status(t,ok=false){$('#status').textContent=t;$('#status').className='status'+(ok?' ok':'')}
async function api(path,opt={}){const headers={Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(token())headers.Authorization='Bearer '+token();const r=await fetch(API+path,{...opt,cache:'no-store',headers:{...headers,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error((d.message||'GitHub 请求失败')+' ('+r.status+')');return d}
function decode(b){try{return decodeURIComponent(escape(atob(String(b).replace(/\s/g,''))))}catch(e){return atob(b)}}
function encode(s){return btoa(unescape(encodeURIComponent(s)))}
async function getFile(p){return api(base()+'/contents/'+p.split('/').map(encodeURIComponent).join('/')+'?ref='+ref())}
async function putFile(p,text,oldSha,message){if(!token())throw Error('读取无需 Token；保存/发布前请填写 GitHub Token。');const body={message:'洪盛集藏：'+message,content:encode(text),branch:$('#branch').value.trim()||'main'};if(oldSha)body.sha=oldSha;const r=await api(base()+'/contents/'+p.split('/').map(encodeURIComponent).join('/'),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.content?.sha||oldSha}
async function load(){try{status('正在读取当前网站 index.html、内容库、行情库……');const [index,c,m,cfg]=await Promise.all([getFile('index.html'),api(base()+'/contents/data/content?ref='+ref()),api(base()+'/contents/data/market?ref='+ref()),getFile('data/site-config.json')]);const html=decode(index.content);const config=JSON.parse(decode(cfg.content));files=(c||[]).filter(x=>x.type==='file'&&x.name.endsWith('.json'));markets=(m||[]).filter(x=>x.type==='file'&&x.name.endsWith('.json'));$('#contentFile').innerHTML=files.map((x,i)=>`<option value="${i}">${x.name}</option>`).join('');$('#marketFile').innerHTML=markets.map((x,i)=>`<option value="${i}">${x.name}</option>`).join('');$('#siteName').value=config.siteName||'洪盛集藏资讯网';$('#heroTitle').value=config.heroTitle||'';$('#heroText').value=config.heroText||'';$('#topNotice').value=config.topNotice||'';const title=(html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1]||'';const h1=(html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i)||[])[1]||'';const h2s=[...html.matchAll(/<h2[^>]*>([\s\S]*?)<\/h2>/gi)].slice(0,6).map(x=>x[1].replace(/<[^>]+>/g,'').trim()).filter(Boolean);$('#snapshot').innerHTML='<strong>网页标题：</strong>'+clean(title)+'<br><strong>主标题：</strong>'+clean(h1)+'<br><strong>当前栏目：</strong>'+h2s.map(clean).join(' · ');$('#stats').innerHTML=`<div class="stat"><b>${files.length}</b>内容文件</div><div class="stat"><b>${markets.length}</b>行情文件</div><div class="stat"><b>${files.reduce((n,x)=>n+(Number(x.size)||0),0)}</b>字节索引</div><div class="stat"><b>已连接</b>当前 main</div>`;if(files.length)await loadContent();await loadMarket();status('✅ 已成功读取当前网站与 GitHub 数据。',true)}catch(e){status('❌ 读取失败：'+e.message+'。如果网页能打开，先不用填写 Token。')}}
function clean(s){return String(s).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').trim()}
async function loadContent(){const f=files[Number($('#contentFile').value)];if(!f)return;const r=await getFile(f.path);path=f.path;sha=r.sha;try{data=JSON.parse(decode(r.content));if(!Array.isArray(data))data=[]}catch(e){data=[]}render()}
function render(){const q=$('#search').value.trim().toLowerCase();const arr=data.map((x,i)=>({x,i})).filter(o=>!q||JSON.stringify(o.x).toLowerCase().includes(q));$('#contentList').innerHTML=arr.length?arr.map(o=>`<div class="row"><b>${clean(o.x.title||o.x.name||o.x.id||'未命名')}</b><span class="tag ${o.x.status==='published'?'pub':''}">${o.x.status||'published'}</span><div class="muted">${path} · ${o.x.date||''} · ${o.x.groupName||o.x.groupId||''}</div><button class="btn gold" onclick="editItem(${o.i})">编辑</button></div>`).join(''):'<div class="empty">当前文件没有符合条件的内容。</div>'}
window.editItem=i=>{const x=data[i]||{};sel=i;$('#id').value=x.id||'';$('#title').value=x.title||x.name||'';$('#date').value=x.date||'';$('#category').value=x.category||x.kind||'';$('#state').value=x.status||'published';$('#group').value=x.group||x.groupId||x.groupName||'';$('#summary').value=x.summary||x.note||'';$('#body').value=x.body||x.content||'';$('#images').value=Array.isArray(x.images)?x.images.join('\n'):'';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function edited(st){return {id:$('#id').value.trim()||('article_'+Date.now()),title:$('#title').value.trim(),date:$('#date').value,kind:$('#category').value.trim(),status:st,groupId:$('#group').value.trim(),note:$('#summary').value.trim(),content:$('#body').value,images:$('#images').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}}
async function save(st){try{if(!$('#title').value.trim())return alert('请填写标题');const x=edited(st);if(sel<0)data.unshift(x);else data[sel]={...data[sel],...x};sha=await putFile(path,JSON.stringify(data,null,2),sha,st==='published'?'发布内容':'保存草稿');await loadContent();sel=-1;status('✅ 内容已保存到当前 GitHub 内容库。',true)}catch(e){status('❌ '+e.message)}}
$('#save').onclick=()=>save('published');$('#saveDraft').onclick=()=>save('draft');$('#contentFile').onchange=loadContent;$('#search').oninput=render;$('#new').onclick=()=>{sel=-1;$$('#id,#title,#date,#category,#group,#summary,#body,#images').forEach(e=>e.value='');$('#date').value=new Date().toISOString().slice(0,10)};
$('#remove').onclick=async()=>{try{if(sel<0)return alert('请先点击一条内容的“编辑”');if(!confirm('确定删除这条内容？'))return;data.splice(sel,1);sha=await putFile(path,JSON.stringify(data,null,2),sha,'删除内容');sel=-1;await loadContent();status('✅ 已删除并同步。',true)}catch(e){status('❌ '+e.message)}};
async function loadMarket(){let html='';for(const f of markets){const r=await getFile(f.path);let a=[];try{a=JSON.parse(decode(r.content))}catch(e){}if(!Array.isArray(a))a=[];html+=`<div class="row"><b>${f.name}</b><div class="muted">${a.length} 条</div>${a.slice(0,20).map(x=>`<div style="padding:7px 0;border-top:1px dashed #e8ddc4"><b>${clean(x.title||x.name||x.id||'未命名')}</b>　${x.price||x.priceRange||''}　${x.trend||''}<div class="muted">${x.date||''} ${clean(x.note||'')}</div></div>`).join('')}</div>`}$('#marketList').innerHTML=html||'<div class="empty">暂无行情数据。</div>'}
$('#addMarket').onclick=async()=>{try{const f=markets[Number($('#marketFile').value)];if(!f)return;const r=await getFile(f.path);let a=[];try{a=JSON.parse(decode(r.content))}catch(e){}if(!Array.isArray(a))a=[];a.unshift({id:'market_'+Date.now(),title:$('#mTitle').value.trim(),date:new Date().toISOString().slice(0,10),price:$('#mPrice').value.trim(),trend:$('#mTrend').value,note:$('#mNote').value.trim(),status:'published'});await putFile(f.path,JSON.stringify(a,null,2),r.sha,'新增行情');await loadMarket();status('✅ 行情已保存。',true)}catch(e){status('❌ '+e.message)}};
$('#saveConfig').onclick=async()=>{try{const r=await getFile('data/site-config.json');const c=JSON.parse(decode(r.content));c.siteName=$('#siteName').value.trim();c.heroTitle=$('#heroTitle').value.trim();c.heroText=$('#heroText').value.trim();c.topNotice=$('#topNotice').value.trim();await putFile('data/site-config.json',JSON.stringify(c,null,2),r.sha,'更新网站配置');status('✅ 网站配置已保存。',true)}catch(e){status('❌ '+e.message)}};
$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');['content','market','config'].forEach(id=>$('#'+id).classList.add('hide'));$('#'+t.dataset.tab).classList.remove('hide')});
$('#load').onclick=load;load();
</script></body></html>
