<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏｜全站发布</title><style>
:root{--r:#6b1414;--g:#c9a35a;--bg:#f7f2e7;--card:#fffdf8;--ink:#3a2f22;--muted:#8a7a5f;--line:#e5d8bf;--ok:#2f6b3b;--danger:#a62a20}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{background:linear-gradient(135deg,#5a0f0f,#861b12);color:#f5d887;padding:20px 4vw}.top h1{margin:0}.top p{margin:6px 0;color:#f1dcc0;font-size:13px}.wrap{width:min(1300px,94vw);margin:16px auto}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-weight:700;margin:4px 0 6px}input,select,textarea{width:100%;padding:10px;border:1px solid #d8c8b5;border-radius:8px;background:#fff;font:inherit;color:var(--ink)}textarea{min-height:180px;line-height:1.6}.btn{border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer;margin:4px 6px 0 0}.primary{background:var(--r);color:#fff}.gold{background:var(--g);color:#35160e}.ok{background:var(--ok);color:#fff}.light{background:#eee7dc;color:#4a4038}.status{padding:10px;border-radius:8px;background:#fff5dd;border:1px solid #dfc18a;white-space:pre-wrap}.success{background:#e9f5eb;color:#276035;border-color:#b8d7bf}.error{background:#fff0ed;color:#9b231a;border-color:#e2b6ad}.hint{font-size:12px;color:var(--muted);line-height:1.6}.target{font-size:13px;color:var(--r);font-weight:700}.preview{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;max-height:240px;overflow:auto;white-space:pre-wrap}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><h1>🏮 洪盛集藏｜全站板块发布中心</h1><p>读取网站现有数据板块，选择任意具体板块发布内容。前台稳定版布局保持不变。</p></header><main class="wrap">
<section class="card"><div class="grid"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="Contents 读写权限"></div></div><button class="btn primary" id="connect">🔄 读取网站全部可发布板块</button><a class="btn light" href="./management-center.html">↩️ 返回管理中心</a><a class="btn gold" href="../" target="_blank">🌐 查看网站</a><div id="status" class="status">请连接 GitHub。</div></section>
<section class="card"><div class="grid"><div class="wide"><label>📌 发布到具体网站板块</label><select id="target"><option value="">请先读取板块</option></select><div id="targetInfo" class="hint"></div></div><div><label>标题</label><input id="title" placeholder="输入文章/行情标题"></div><div><label>日期</label><input id="date" type="date"></div><div><label>类型</label><input id="kind" placeholder="文章 / 鉴赏 / 研究 / 公告 / 行情"></div><div><label>价格 / 报价（行情可填）</label><input id="price"></div><div class="wide"><label>摘要 / 导语</label><textarea id="note" style="min-height:100px"></textarea></div><div class="wide"><label>正文内容</label><textarea id="body" style="min-height:320px"></textarea></div><div class="wide"><label>图片路径（一行一个）</label><textarea id="images" style="min-height:90px" placeholder="/static/xxx.jpg"></textarea></div></div><button class="btn ok" id="publish">🚀 发布到所选板块</button><button class="btn light" id="clear">清空</button><div id="publishStatus" class="status">等待发布</div></section>
<section class="card"><b>📋 当前板块数据预览</b><div id="preview" class="preview">请选择板块。</div></section></main>
<script>
'use strict';const $=id=>document.getElementById(id);let token='',owner='yang79403-wq',repo='yang79403-wq.github.io',branch='main',targets=[],cache=new Map();const today=new Date().toISOString().slice(0,10);$('date').value=today;
const api=p=>`https://api.github.com/repos/${owner}/${repo}/contents/${p}?ref=${encodeURIComponent(branch)}`;const headers=()=>({'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'});function msg(el,t,ok=false){el.textContent=t;el.className='status '+(ok?'success':'error')}
async function list(p){const r=await fetch(api(p),{headers:headers()});if(!r.ok)throw Error(p+' '+r.status);return r.json()}async function read(p){const r=await fetch(api(p),{headers:headers()});if(!r.ok)throw Error(p+' '+r.status);const j=await r.json();const b=Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0));return {sha:j.sha,json:JSON.parse(new TextDecoder().decode(b))}}
async function save(p,text,sha){const b=new TextEncoder().encode(text);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode(...b.subarray(i,i+0x8000));const body={message:'后台发布网站板块内容',content:btoa(s),branch};if(sha)body.sha=sha;const r=await fetch(api(p),{method:'PUT',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return r.json()}
function label(path){const n=path.split('/').pop().replace('.json','');const map={appreciation:'收藏学院',fujian:'福建钱币',history:'钱币历史',knowledge:'评级知识',tongqian:'古钱币',tongyuan:'铜元',yinyuan_jizhibi:'银元 / 机制币',zhibi:'纸币',fujian_tongqian:'福建铜钱行情',fujian_tongyuan:'福建铜元行情',fujian_yinyuan:'福建银元行情',yinyuan:'银元行情',market:'全站行情',news:'最新收藏内容'};return map[n]||n}
async function loadTargets(){const [c,m]=await Promise.all([list('data/content'),list('data/market')]);targets=[...c.filter(x=>x.type==='file'&&x.name.endsWith('.json')).map(x=>({path:x.path,name:label(x.path),group:'收藏内容'})),...m.filter(x=>x.type==='file'&&x.name.endsWith('.json')).map(x=>({path:x.path,name:label(x.path),group:'行情内容'}))];try{const n=await list('data/news.json');if(n&&n.type==='file')targets.push({path:n.path,name:'最新收藏内容',group:'网站内容'})}catch(e){}$('target').innerHTML='<option value="">请选择网站板块</option>'+targets.map((x,i)=>`<option value="${i}">【${x.group}】${x.name}</option>`).join('');msg($('status'),`已读取 ${targets.length} 个网站可发布板块。`,true)}
async function choose(){const i=$('target').value;if(i===''){ $('targetInfo').textContent='';$('preview').textContent='请选择板块。';return}const t=targets[+i];const r=await read(t.path);cache.set(t.path,r);$('targetInfo').textContent=`目标：${t.name}｜文件：${t.path}`;const j=r.json;let arr=Array.isArray(j)?j:(j.items||j.data||j.articles||j.list||[]);$('preview').textContent=`当前已有 ${Array.isArray(arr)?arr.length:0} 条内容\n\n`+JSON.stringify(Array.isArray(arr)?arr.slice(-5):j,null,2)}
function makeItem(){return {id:'post_'+Date.now(),title:$('title').value.trim(),date:$('date').value||today,kind:$('kind').value.trim(),price:$('price').value.trim(),note:$('note').value,content:$('body').value,images:$('images').value.split(/\n+/).map(x=>x.trim()).filter(Boolean),status:'published'}}
async function publish(){const i=$('target').value;if(i==='')throw Error('请先选择具体网站板块');const t=targets[+i];const r=cache.get(t.path)||await read(t.path);let j=r.json;if(!Array.isArray(j)){const key=['items','data','articles','list'].find(k=>Array.isArray(j[k]));if(!key)throw Error('该板块不是可追加内容的数据结构，请使用“数据文件”高级编辑。');j[key].push(makeItem())}else j.push(makeItem());await save(t.path,JSON.stringify(j,null,2)+'\n',r.sha);cache.delete(t.path);await choose();msg($('publishStatus'),`发布成功：已写入「${t.name}」\n文件：${t.path}`,true)}
$('connect').onclick=async()=>{try{token=$('token').value.trim();owner=$('owner').value.trim();repo=$('repo').value.trim();branch=$('branch').value.trim()||'main';if(!token)throw Error('请输入 GitHub Token');await loadTargets()}catch(e){msg($('status'),e.message)}};$('target').onchange=()=>choose().catch(e=>msg($('publishStatus'),e.message));$('publish').onclick=()=>publish().catch(e=>msg($('publishStatus'),e.message));$('clear').onclick=()=>['title','kind','price','note','body','images'].forEach(id=>$(id).value='');
</script></body></html>
