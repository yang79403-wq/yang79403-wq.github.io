<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏｜智能内容管理</title><style>:root{--r:#6b1414;--g:#c9a35a;--bg:#f7f2e7;--card:#fffdf8;--ink:#3a2f22;--line:#e5d8bf;--ok:#2f6b3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{background:linear-gradient(135deg,#5a0f0f,#861b12);color:#f5d887;padding:20px 4vw}.top h1{margin:0}.top p{margin:7px 0;color:#f1dcc0}.wrap{width:min(1450px,96vw);margin:18px auto}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wide{grid-column:1/-1}label{display:block;font-weight:700;margin:6px 0}input,textarea,select{width:100%;padding:10px;border:1px solid #d8c8b5;border-radius:8px;font:inherit;background:#fff;color:var(--ink)}textarea{min-height:170px;line-height:1.6}.btn{border:0;border-radius:8px;padding:10px 15px;margin:4px;cursor:pointer;font-weight:700}.primary{background:var(--r);color:white}.gold{background:var(--g);color:#35160e}.ok{background:var(--ok);color:white}.light{background:#eee7dc}.status{padding:10px;border-radius:8px;background:#fff5dd;border:1px solid #dfc18a;white-space:pre-wrap}.list{display:grid;gap:9px;max-height:560px;overflow:auto}.item{padding:12px;border:1px solid var(--line);border-radius:9px;background:#fffaf3;cursor:pointer}.item:hover{border-color:var(--g);background:#fff8e8}.item b{color:var(--r)}.suggest{padding:14px;border:2px solid var(--g);border-radius:10px;background:#fff8e8}.tag{display:inline-block;padding:4px 9px;margin:3px;border-radius:999px;background:#eee1c5}.muted{color:#8a7a5f;font-size:13px;line-height:1.6}@media(max-width:850px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header class="top"><div class="wrap"><h1>🏮 洪盛集藏｜智能内容管理</h1><p>自动读取网站全部内容板块 → 分析标题、摘要、正文 → 推荐最合适板块 → 一键发布或调整板块。全中文菜单。</p></div></header><main class="wrap"><section class="card"><div class="grid"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>网站仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token（仅发布、移动、修改、删除需要）</label><input id="token" type="password" placeholder="读取内容无需 Token"></div></div><div style="margin-top:10px"><button class="btn primary" id="load">🔄 读取全部内容与板块</button><a class="btn gold" href="management-center.html">⚙️ 返回管理中心</a><a class="btn light" href="../" target="_blank">🌐 查看网站</a></div><div id="status" class="status">等待读取……</div></section><section class="card"><h2>🧠 智能归类与发布</h2><div class="grid"><div><label>标题</label><input id="title" placeholder="输入要发布的标题"></div><div><label>内容类型</label><input id="kind" placeholder="文章、鉴赏、历史研究、行情等"></div><div class="wide"><label>摘要 / 导语</label><textarea id="note" style="min-height:90px"></textarea></div><div class="wide"><label>正文</label><textarea id="body"></textarea></div></div><div class="suggest" id="suggest">请输入标题或正文后点击“智能分析”。</div><div><button class="btn primary" id="analyze">🧠 智能分析板块</button><button class="btn ok" id="publish">🚀 按推荐板块发布</button><button class="btn light" id="clear">🧹 清空</button></div></section><section class="card"><h2>📚 已发布内容智能整理</h2><p class="muted">这里读取网站实际数据文件中的已发布内容。点击任意内容后，系统会重新分析，并显示“当前板块 → 推荐板块”。确认后才执行移动，不会自动误改网站。</p><div id="items" class="list"></div></section></main><script>const $=id=>document.getElementById(id);let boards=[],records=[],recommend=null;const CN={appreciation:'收藏学院',fujian:'福建钱币',history:'钱币历史',knowledge:'评级知识',tongqian:'古钱币',tongyuan:'古钱币 / 铜元',yinyuan:'银元',yinyuan_jizhibi:'银元 / 机制币',zhibi:'纸币',culture:'钱币文化',craft_minting:'工艺与铸造',exchange_ancient:'古代钱币交流',exchange_badge:'徽章交流',exchange_banknote:'纸币交流',exchange_commemorative:'纪念币交流',exchange_experience:'经验交流',exchange_silver:'银元交流',experience:'收藏经验',fujian_ancient:'福建古钱',fujian_banknote:'福建纸币',fujian_culture:'福建钱币文化',fujian_silver:'福建银元',history_background:'钱币历史背景',research_ancient:'古钱研究',research_banknote:'纸币研究',research_commemorative:'纪念币研究',research_machine:'机制币研究',research_silver:'银元研究',rating_huaxia:'华夏评级',rating_ngc:'NGC评级',rating_pcgs:'PCGS评级',rating_png:'评级知识',classic_literature:'经典文献',coin_culture:'钱币文化'};const WORD={coin:'钱币',culture:'文化',craft:'工艺',minting:'铸造',exchange:'交流',ancient:'古钱',badge:'徽章',banknote:'纸币',commemorative:'纪念币',experience:'经验',silver:'银元',fujian:'福建',history:'历史',background:'背景',research:'研究',machine:'机制币',rating:'评级',huaxia:'华夏',pcgs:'PCGS',ngc:'NGC',service:'服务',appreciation:'鉴赏',authenticity:'真伪鉴定',collection:'收藏',condition:'品相',knowledge:'知识',market:'市场',popularization:'普及'};function bname(f){let k=f.replace('.json','');return CN[k]||k.split('_').map(x=>WORD[x]||x).join(' · ')}function api(p){return `https://api.github.com/repos/${$('owner').value.trim()}/${$('repo').value.trim()}/contents/${p}?ref=${encodeURIComponent($('branch').value.trim())}`}function headers(write=false){let h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(write&&$('token').value.trim())h.Authorization='Bearer '+$('token').value.trim();return h}async function fetchJson(p){let r=await fetch(api(p),{headers:headers()});if(!r.ok)throw Error(p+'：HTTP '+r.status);let j=await r.json();let raw=atob(j.content.replace(/\n/g,''));let bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));return{sha:j.sha,data:JSON.parse(new TextDecoder().decode(bytes)),path:p}}async function loadBoards(){let r=await fetch(api('data/content'),{headers:headers()});if(!r.ok)throw Error('无法读取内容板块：HTTP '+r.status);let a=await r.json();boards=a.filter(x=>x.type==='file'&&x.name.endsWith('.json')).map(x=>({name:x.name,path:x.path,title:bname(x.name)}));records=[];for(const b of boards){try{let x=await fetchJson(b.path);let arr=Array.isArray(x.data)?x.data:(Array.isArray(x.data.items)?x.data.items:[]);arr.forEach((v,i)=>{if(v&&typeof v==='object')records.push({...v,__file:b.path,__sha:x.sha,__index:i,__board:b.title})})}catch(e){}}renderRecords();$('status').textContent=`已读取 ${boards.length} 个内容板块、${records.length} 条内容。`;recommend=null}function score(text,file){let s=0,k=file.replace('.json','');const rules={yinyuan:['银元','袁大头','大头','龙洋','银币','船洋'],zhibi:['纸币','人民币','冠号','钞','一版','二版','三版','四版'],tongqian:['古钱','铜钱','方孔','清钱','咸丰','康熙','乾隆','花钱'],tongyuan:['铜元','铜板','机制铜'],fujian:['福建','闽','福州','泉州','厦门'],rating:['评级','PCGS','NGC','PMG','GBCA','公博','华夏'],appreciation:['鉴赏','品相','真伪','鉴定'],culture:['文化','历史','文献','传承'],craft_minting:['铸造','铸币','工艺','机制币'],exchange_silver:['交流','银元交流'],exchange_ancient:['古钱交流','古钱币交流'],exchange_banknote:['纸币交流'],exchange_badge:['徽章','纪念章']};for(const [key,ks] of Object.entries(rules))if(k===key||k.includes(key))for(const w of ks)if(text.includes(w))s+=3;for(const w of k.split('_'))if(text.includes(w))s+=1;return s}function analyze(text){let ranked=boards.map(b=>({b,s:score(text,b.name)})).sort((a,b)=>b.s-a.s);return ranked[0]||null}function showSuggestion(r,current=''){if(!r){$('suggest').innerHTML='⚠️ 暂时没有可用板块，请先读取全部板块。';return}recommend=r.b;$('suggest').innerHTML=`<b>推荐板块：${r.b.title}</b>　<span class="tag">匹配分 ${r.s}</span><div class="muted">${current?`当前板块：${current}　→　`:''}系统根据标题、摘要、正文中的钱币类别、地区、评级机构、研究主题等关键词综合判断。你可以先确认，再发布或移动。</div>`}function renderRecords(){let q=records.map((r,i)=>`<div class=item onclick="pick(${i})"><b>${esc(r.title||'无标题')}</b><div>${r.__board}　｜　${r.date||''}</div><div class=muted>${esc((r.note||r.content||'').slice(0,100))}</div></div>`).join('');$('items').innerHTML=q||'<div class=muted>暂无可读取的已发布内容。</div>'}function pick(i){let r=records[i];$('title').value=r.title||'';$('kind').value=r.kind||'';$('note').value=r.note||'';$('body').value=r.content||'';let x=analyze([r.title,r.kind,r.note,r.content].join('\n'));showSuggestion(x,r.__board);window.current=r}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function writeFile(path,data,sha,msg){if(!$('token').value.trim())throw Error('请先填写 GitHub Token');let bytes=new TextEncoder().encode(JSON.stringify(data,null,2));let bin='';for(let i=0;i<bytes.length;i+=32768)bin+=String.fromCharCode(...bytes.subarray(i,i+32768));let r=await fetch(api(path),{method:'PUT',headers:{...headers(true),'Content-Type':'application/json'},body:JSON.stringify({message:msg,content:btoa(bin),branch:$('branch').value.trim(),sha})});if(!r.ok)throw Error(await r.text())}async function publish(){let text=[$('title').value,$('kind').value,$('note').value,$('body').value].join('\n').trim();let r=analyze(text);if(!r)throw Error('没有可用板块');showSuggestion(r);if(!confirm(`确认发布到“${r.b.title}”？`))return;let target=await fetchJson(r.b.path);let arr=Array.isArray(target.data)?target.data:(Array.isArray(target.data.items)?target.data.items:null);if(!arr)throw Error('目标板块数据结构不是内容列表，已停止写入，避免破坏原数据');let item={id:'hs'+Date.now().toString(36),title:$('title').value.trim(),date:new Date().toISOString().slice(0,10),kind:$('kind').value.trim()||'文章 / 资料',note:$('note').value.trim(),content:$('body').value.trim(),images:[],status:'published'};arr.push(item);if(Array.isArray(target.data))target.data=arr;else target.data.items=arr;await writeFile(target.path,target.data,target.sha,'智能归类：发布内容到'+r.b.title);alert('已按智能推荐发布到：'+r.b.title);await loadBoards()}async function moveCurrent(){let r=window.current;if(!r||!recommend)throw Error('请先选择一条已发布内容并进行智能分析');if(r.__file===recommend.path){alert('内容已经在推荐板块，无需移动');return}if(!confirm(`确认把“${r.title||'无标题'}”从“${r.__board}”移动到“${recommend.title}”？`))return;let src=await fetchJson(r.__file),dst=await fetchJson(recommend.path);let sa=Array.isArray(src.data)?src.data:(src.data.items||[]),da=Array.isArray(dst.data)?dst.data:(dst.data.items||[]);let item=sa[r.__index];if(!item)throw Error('源内容已变化，请重新读取');da.push(item);sa.splice(r.__index,1);if(Array.isArray(src.data))src.data=sa;else src.data.items=sa;if(Array.isArray(dst.data))dst.data=da;else dst.data.items=da;await writeFile(src.path,src.data,src.sha,'智能整理：从'+r.__board+'移出内容');await writeFile(dst.path,dst.data,dst.sha,'智能整理：移动内容到'+recommend.title);alert('已完成板块整理');await loadBoards()}$('load').onclick=()=>loadBoards().catch(e=>$('status').textContent='读取失败：'+e.message);$('analyze').onclick=()=>{let r=analyze([$('title').value,$('kind').value,$('note').value,$('body').value].join('\n'));showSuggestion(r)};$('publish').onclick=()=>publish().catch(e=>alert(e.message));$('clear').onclick=()=>{['title','kind','note','body'].forEach(id=>$(id).value='');$('suggest').textContent='请输入标题或正文后点击“智能分析”。';window.current=null};window.pick=pick;window.addEventListener('load',()=>loadBoards().catch(e=>$('status').textContent='读取失败：'+e.message));</script></body></html>
