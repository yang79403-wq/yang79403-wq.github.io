<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>洪盛集藏 · 网站内容管理</title><style>:root{--red:#6b1414;--red2:#8f1d1d;--gold:#c9a35a;--gold2:#e8cf9a;--cream:#f7f2e7;--card:#fffdf8;--border:#e8ddc4;--text:#3a2f22;--muted:#8a7a5f}*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif}body{min-height:100vh}.top{background:var(--red);color:#f4e6cf;padding:12px 18px}.wrap{max-width:1200px;width:94%;margin:auto}.top h1{margin:0;font-size:22px}.top p{margin:4px 0 0;font-size:12px;color:var(--gold2)}.nav{background:#fffdf8;border-bottom:1px solid var(--border);padding:8px 18px;position:sticky;top:0;z-index:5}.navin{max-width:1200px;width:94%;margin:auto;display:flex;gap:8px;overflow:auto}.nav a{white-space:nowrap;padding:9px 13px;border-radius:6px;color:var(--red);border:1px solid transparent;font-size:12px;text-decoration:none}.nav a.active,.nav a:hover{background:#f3ead8;border-color:#dfc58f}.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin:14px 0;box-shadow:0 5px 20px rgba(58,47,34,.04)}.card h2{margin:0 0 12px;color:var(--red);font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted)}input,textarea,select{width:100%;padding:10px;border:1px solid #d9c9b6;border-radius:7px;background:#fff;font:inherit;color:var(--text)}textarea{resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:7px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--red2);color:#fff}.gold{background:var(--gold);color:#5a3d0a}.green{background:#397348;color:#fff}.gray{background:#756c65;color:#fff}.danger{background:#a42f24;color:#fff}.status{margin-top:10px;padding:11px;border-radius:7px;background:#fff5dc;border:1px solid #dfc18a;color:#6f634f;white-space:pre-wrap;font-size:12px;line-height:1.6}.hide{display:none!important}.list{display:grid;gap:8px}.row{padding:10px;border:1px solid var(--border);border-radius:8px;background:#fff}.row strong{color:var(--red)}.small{font-size:11px;color:var(--muted)}.danger-zone{border-color:#e2b0a8;background:#fff7f5}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap,.navin{width:96%}.top h1{font-size:19px}.actions .btn{flex:1;min-width:120px}.card{padding:14px}.nav{padding:8px 6px}}</style></head><body><header class="top"><div class="wrap"><h1>🏮 洪盛集藏 · 网站内容管理</h1><p>保持前台网站红金收藏风格 · 内容发布 · 编辑 · 删除 · 图片 · 版块同步</p></div></header><nav class="nav"><div class="navin"><a class="active" href="#connect">连接</a><a href="#content">内容管理</a><a href="#image">图片管理</a><a href="#groups">版块管理</a><a href="#site">网站设置</a><a href="../">返回网站</a></div></nav><main class="wrap"><section class="card" id="connect"><h2>🔐 GitHub 连接</h2><div class="grid"><div class="field"><label>仓库</label><input id="repo" value="yang79403-wq/yang79403-wq.github.io"></div><div class="field"><label>分支</label><input id="branch" value="main"></div><div class="field"><label>GitHub Token</label><input id="token" type="password" placeholder="只保存在当前浏览器，不保存到网站"></div></div><div class="actions"><button class="btn primary" onclick="connect()">连接并读取网站</button><button class="btn gray" onclick="checkPages()">检查 Pages</button><button class="btn gold" onclick="buildPages()">请求重新构建</button></div><div id="status" class="status">未连接</div></section><section class="card hide" id="site"><h2>🏠 网站设置</h2><div class="grid"><div class="field"><label>网站名称</label><input id="siteName"></div><div class="field"><label>首页标题</label><input id="heroTitle"></div><div class="field"><label>客服二维码路径</label><input id="qrPath" value="/static/qr-service.png"></div></div><div class="field" style="margin-top:10px"><label>首页说明</label><textarea id="heroText" rows="4"></textarea></div><div class="actions"><button class="btn green" onclick="saveConfig()">保存网站设置</button><button class="btn gray" onclick="reloadConfig()">重新读取</button></div></section><section class="card hide" id="content"><h2>📝 内容管理</h2><div class="grid"><div class="field"><label>内容文件</label><select id="contentFile"></select></div><div class="field"><label>版块</label><select id="group"></select></div><div class="field"><label>状态</label><select id="contentStatus"><option value="published">已发布</option><option value="draft">草稿</option><option value="hidden">隐藏</option></select></div></div><div class="field" style="margin-top:10px"><label>标题</label><input id="contentTitle"></div><div class="field" style="margin-top:10px"><label>摘要</label><input id="contentNote"></div><div class="field" style="margin-top:10px"><label>正文</label><textarea id="contentBody" rows="12"></textarea></div><div class="field" style="margin-top:10px"><label>图片 URL（每行一张）</label><textarea id="contentImages" rows="4" placeholder="/static/example.jpg"></textarea></div><div class="actions"><button class="btn gold" onclick="newContent()">新内容</button><button class="btn green" onclick="saveContent()">保存 / 发布</button><button class="btn danger" onclick="deleteContent()">删除内容</button><button class="btn gray" onclick="reloadContentList()">刷新列表</button></div><div class="small">发布后会写入 GitHub main 分支，由 GitHub Pages 自动更新前台。</div></section><section class="card hide" id="image"><h2>🖼️ 图片管理</h2><div class="grid"><div class="field"><label>图片文件</label><input id="imageFile" type="file" accept="image/*"></div><div class="field"><label>保存路径</label><input id="imagePath" placeholder="static/uploads/coin-01.jpg"></div><div class="field"><label>说明</label><input value="请勿使用此处覆盖系统二维码" disabled></div></div><div class="actions"><button class="btn green" onclick="uploadImage()">上传图片到网站</button></div><div class="status">建议图片统一保存到 <b>static/uploads/</b>。系统二维码单独维护，不通过普通图片上传覆盖。</div></section><section class="card hide" id="groups"><h2>🗂️ 版块管理</h2><div id="groupsBox" class="list"></div><div class="actions"><button class="btn gold" onclick="addGroup()">新增版块</button><button class="btn green" onclick="saveGroups()">保存版块结构</button></div></section><section class="card hide" id="scan"><h2>🔎 同步检查</h2><div class="actions"><button class="btn gray" onclick="scanSite()">读取真实网站配置</button></div><pre id="scanText" class="status"></pre></section></main><script>const $=id=>document.getElementById(id);let cfg={},files=[],token='';function headers(){return{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2026-03-10','Content-Type':'application/json'}}function repo(){return $('repo').value.trim()}function branch(){return $('branch').value.trim()||'main'}async function gh(path,opt={}){let url='https://api.github.com/repos/'+repo()+'/contents/'+path; if(!opt.method)url+='?ref='+encodeURIComponent(branch());let r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});return r}function decodeB64(s){return new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)))}function encodeB64(s){let bytes=new TextEncoder().encode(s),bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin)}async function getFile(path){let r=await gh(path);if(!r.ok)throw new Error(path+' 读取失败：'+r.status);let j=await r.json();return{text:decodeB64(j.content),sha:j.sha}}async function putFile(path,text,sha,message){let body={message:message||'洪盛集藏CMS更新',content:encodeB64(text),branch:branch()};if(sha)body.sha=sha;let r=await gh(path,{method:'PUT',body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}async function connect(){token=$('token').value.trim();if(!token)return alert('请先输入 GitHub Token');try{let r=await fetch('https://api.github.com/repos/'+repo(),{headers:headers()});if(!r.ok)throw new Error('GitHub连接失败：'+r.status);await reloadConfig();document.querySelectorAll('.hide').forEach(x=>x.classList.remove('hide'));$('status').textContent='✅ GitHub连接成功，网站配置和内容入口已同步。';await scanSite()}catch(e){$('status').textContent='❌ '+e.message}}async function reloadConfig(){let f=await getFile('data/site-config.json');let raw=JSON.parse(f.text);cfg=typeof raw.content==='string'?JSON.parse(raw.content):raw;$('siteName').value=cfg.siteName||'';$('heroTitle').value=cfg.heroTitle||'';$('heroText').value=cfg.heroText||'';$('qrPath').value=(cfg.consult&&cfg.consult.qr)||'/static/qr-service.png';renderGroups();groupOptions();await reloadContentList()}async function saveConfig(){cfg.siteName=$('siteName').value;cfg.heroTitle=$('heroTitle').value;cfg.heroText=$('heroText').value;cfg.consult=cfg.consult||{};cfg.consult.qr=$('qrPath').value||'/static/qr-service.png';let f=await getFile('data/site-config.json');await putFile('data/site-config.json',JSON.stringify({content:JSON.stringify(cfg,null,2)},null,2),f.sha,'洪盛集藏CMS：更新网站设置');alert('网站设置已保存并同步到GitHub。')}function renderGroups(){let box=$('groupsBox');box.innerHTML='';(cfg.nav||[]).forEach(g=>{let d=document.createElement('div');d.className='row';d.innerHTML='<div class="grid"><input value="'+esc(g.id)+'" data-id><input value="'+esc(g.name)+'" data-name><button class="btn gray" type="button">删除</button></div>';d.querySelector('button').onclick=()=>d.remove();box.appendChild(d)})}function groupOptions(){let opts=(cfg.nav||[]).map(g=>'<option value="'+esc(g.id)+'">'+esc(g.name)+'</option>').join('');$('group').innerHTML=opts||'<option value="content">内容</option>'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m))}async function saveGroups(){cfg.nav=[...$('groupsBox').children].map(r=>({id:r.querySelector('[data-id]').value.trim(),name:r.querySelector('[data-name]').value.trim(),enabled:true})).filter(x=>x.id&&x.name);groupOptions();await saveConfig()}function addGroup(){let id=prompt('版块ID，例如 market_new');if(!id)return;let name=prompt('版块名称');if(!name)return;cfg.nav=cfg.nav||[];cfg.nav.push({id,name,enabled:true});renderGroups();groupOptions()}async function reloadContentList(){let r=await gh('data/content');if(!r.ok){$('contentFile').innerHTML='<option value="">新建内容</option>';return}let arr=await r.json();files=arr.filter(x=>x.type==='file'&&x.name.endsWith('.json'));$('contentFile').innerHTML='<option value="">新建内容</option>'+files.map(x=>'<option value="'+esc(x.path)+'">'+esc(x.name)+'</option>').join('')}$('contentFile').onchange=async()=>{let p=$('contentFile').value;if(!p){newContent();return}let f=await getFile(p);let a=JSON.parse(f.text);let x=Array.isArray(a)?a[0]:a;$('contentTitle').value=x.title||'';$('contentNote').value=x.note||'';$('contentBody').value=x.content||'';$('contentImages').value=(x.images||[]).join('\n');$('contentStatus').value=x.status||'published';$('contentFile').dataset.sha=f.sha;$('contentFile').dataset.path=p};function newContent(){$('contentFile').value='';delete $('contentFile').dataset.sha;delete $('contentFile').dataset.path;$('contentTitle').value='';$('contentNote').value='';$('contentBody').value='';$('contentImages').value='';$('contentStatus').value='draft'}async function saveContent(){let title=$('contentTitle').value.trim();if(!title)return alert('请输入标题');let gid=$('group').value||'content';let path=$('contentFile').dataset.path||('data/content/'+gid+'.json');let sha=$('contentFile').dataset.sha;let arr=[];if(sha){let old=JSON.parse((await getFile(path)).text);arr=Array.isArray(old)?old:[old]}else{try{let f=await getFile(path);sha=f.sha;let old=JSON.parse(f.text);arr=Array.isArray(old)?old:[old]}catch{}}let item=arr.find(x=>x.id===$('contentFile').dataset.id);if(!item)item={id:'cms_'+Date.now(),date:new Date().toISOString().slice(0,10),source:'cms'};Object.assign(item,{title,note:$('contentNote').value,content:$('contentBody').value,images:$('contentImages').value.split(/\n+/).map(x=>x.trim()).filter(Boolean),status:$('contentStatus').value,groupId:gid,updatedAt:new Date().toISOString()});arr=arr.filter(x=>x.id!==item.id);arr.push(item);await putFile(path,JSON.stringify(arr,null,2),sha,'洪盛集藏CMS：保存/发布内容');$('contentFile').dataset.path=path;$('contentFile').dataset.id=item.id;alert('✅ 内容已经写入GitHub并发布。');await reloadContentList()}async function deleteContent(){let p=$('contentFile').dataset.path,sha=$('contentFile').dataset.sha;if(!p)return alert('请先选择内容');if(!confirm('确定删除当前内容？'))return;let f=await getFile(p);let arr=JSON.parse(f.text);if(!Array.isArray(arr))arr=[arr];let id=$('contentFile').dataset.id;arr=arr.filter(x=>x.id!==id);await putFile(p,JSON.stringify(arr,null,2),f.sha,'洪盛集藏CMS：删除内容');alert('✅ 已删除并同步GitHub。');await reloadContentList();newContent()}async function uploadImage(){let f=$('imageFile').files[0],p=$('imagePath').value.trim();if(!f||!p)return alert('请选择图片并填写保存路径');if(!p.startsWith('static/uploads/'))return alert('图片请保存到 static/uploads/ 目录');let b64=await new Promise((res,rej)=>{let fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(f)});let exists;try{exists=await getFile(p)}catch{}let body={message:'洪盛集藏CMS：上传图片',content:b64,branch:branch()};if(exists)body.sha=exists.sha;let r=await gh(p,{method:'PUT',body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());alert('✅ 图片已经上传并同步。')}async function checkPages(){if(!token)return alert('请先连接GitHub');let r=await fetch('https://api.github.com/repos/'+repo()+'/pages',{headers:headers()});$('status').textContent=r.ok?'Pages状态：\n'+JSON.stringify(await r.json(),null,2):'Pages读取失败：'+r.status+' '+await r.text()}async function buildPages(){if(!token)return alert('请先连接GitHub');let r=await fetch('https://api.github.com/repos/'+repo()+'/pages/builds',{method:'POST',headers:headers()});$('status').textContent=r.ok?'✅ 已请求GitHub Pages重新构建：\n'+JSON.stringify(await r.json(),null,2):'构建请求失败：'+r.status+' '+await r.text()}async function scanSite(){try{let f=await getFile('data/site-config.json');let raw=JSON.parse(f.text);let obj=typeof raw.content==='string'?JSON.parse(raw.content):raw;$('scanText').textContent='✅ site-config.json 读取正常\n版块：'+(obj.nav||[]).map(x=>x.name).join('、')+'\n二维码：'+((obj.consult||{}).qr||'未设置')+'\n内容目录：data/content/';}catch(e){$('scanText').textContent='❌ '+e.message}}</script></body></html>
