<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6b1414">
<title>洪盛集藏资讯网 · 内容管理</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="https://unpkg.com/decap-cms@3.8.2/dist/decap-cms.js"></script>
<style>
html,body{margin:0;min-height:100%;background:#f7f2e7;color:#3a2f22;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
#loading{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.box{max-width:560px;background:#fffdf8;border:1px solid #e8ddc4;border-radius:14px;padding:28px;box-shadow:0 10px 35px rgba(58,47,34,.08)}
.title{font-size:24px;font-weight:700;color:#6b1414;margin-bottom:8px}.sub{color:#8a7a5f;font-size:13px;line-height:1.8}.btn{margin-top:18px;border:0;border-radius:7px;padding:12px 18px;background:#8f1d1d;color:#fff;font-weight:700;cursor:pointer}
#error{display:none;margin-top:12px;color:#8f1d1d;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div id="loading"><div class="box"><div class="title">洪盛集藏资讯网</div><div class="sub" id="status">正在加载内容管理系统……</div><button id="login" class="btn" type="button">登录 / 授权</button><div id="error"></div></div></div>
<script>
(function(){
  var status=document.getElementById('status');
  var error=document.getElementById('error');
  var login=document.getElementById('login');
  var cmsStarted=false;
  var waitStart=Date.now();

  function showError(message){
    status.textContent='CMS 暂时无法启动。';
    error.style.display='block';
    error.textContent=message;
  }

  function openLogin(){
    if(window.netlifyIdentity){window.netlifyIdentity.open('login');}
    else{showError('Netlify Identity 未加载，请刷新页面后重试。');}
  }

  function initIdentity(){
    if(!window.netlifyIdentity) return;
    window.netlifyIdentity.on('login',function(){
      status.textContent='登录成功，正在加载内容管理……';
      setTimeout(function(){window.location.reload();},300);
    });
    window.netlifyIdentity.on('logout',function(){window.location.reload();});
    window.netlifyIdentity.on('error',function(err){
      showError('认证错误：'+(err&&err.message?err.message:'请稍后重试。'));
    });
    window.netlifyIdentity.init({autologin:false});
  }

  function boot(){
    if(window.netlifyIdentity) initIdentity();
    if(!window.CMS){
      if(Date.now()-waitStart>10000){
        showError('Decap CMS 脚本加载超时。请检查网络连接或稍后刷新。');
        return;
      }
      setTimeout(boot,100);
      return;
    }
    if(cmsStarted) return;
    cmsStarted=true;
    try{
      window.CMS.init({config:'./config.yml'});
      setTimeout(function(){
        var loading=document.getElementById('loading');
        if(loading) loading.style.display='none';
      },600);
    }catch(e){
      console.error(e);
      showError('CMS 初始化失败：'+(e&&e.message?e.message:'未知错误'));
    }
  }

  login.addEventListener('click',openLogin);
  boot();
})();
</script>
</body>
</html>
