<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1414"><title>洪盛集藏｜网站内容管理</title><style>:root{--r:#6b1414;--g:#c9a35a;--c:#f7f2e7;--card:#fffdf8;--t:#3a2f22;--m:#8a7a5f;--l:#e8ddc4}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--t);font-family:"PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(1180px,94vw);margin:auto}.top{background:linear-gradient(135deg,#6b1414,#861b12);color:#f7d98d;padding:18px 0}.top h1{margin:0;font-size:24px}.top p{margin:6px 0 0;color:#f1dcc0;font-size:13px}.card{background:var(--card);border:1px solid var(--l);border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{display:block;font-weight:700;margin:4px 0}input,textarea,select{width:100%;padding:11px;border:1px solid #d8c8b5;border-radius:8px;background:#fff;color:var(--t);font:inherit}textarea{min-height:120px;resize:vertical}.btn{display:inline-block;border:0;border-radius:8px;padding:10px 15px;margin:3px;font-weight:700;cursor:pointer;text-decoration:none}.r{background:var(--r);color:#fff}.g{background:var(--g);color:#32130d}.x{background:#756a63;color:#fff}.ok{background:#2f6b3b;color:#fff}.danger{background:#a62a20;color:#fff}.status{padding:11px;border-radius:8px;background:#fff5dd;border:1px solid #dfc18a;white-space:pre-wrap}.okbox{background:#e8f5e9!important;color:#276035}.errbox{background:#fff1ee!important;color:#9b231a}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tab{padding:9px 15px;border:1px solid var(--l);border-radius:999px;background:#fff;color:var(--r);font-weight:700;white-space:nowrap;cursor:pointer}.tab.on{background:var(--r);color:#fff}.hide{display:none}.list{display:grid;gap:8px}.row{border:1px solid var(--l);background:#fffaf3;border-radius:9px;padding:12px}.muted{font-size:12px;color:var(--m)}.tag{display:inline-block;padding:3px 7px;border-radius:20px;background:#eadbc3;font-size:11px}.pub{background:#e5f3e8;color:#276035}.draft{background:#eee9e3;color:#6d6259}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff8ea;border:1px solid var(--l);border-radius:9px;padding:11px;text-align:center}.stat b{display:block;font-size:20px;color:var(--r)}.sitebox{background:#fffaf3;border:1px solid var(--l);border-radius:9px;padding:12px;margin-top:10px}.sitebox strong{color:var(--r)}@media(max-width:700px){.grid,.statgrid{grid-template-columns:1fr}.wide{grid-column:auto}.top h1{font-size:20px}.card{padding:13px}}</style></head><body><header class="top"><div class="wrap"><h1>🏮 洪盛集藏｜网站内容管理</h1><p>唯一基准：当前前台 index.html + 当前 GitHub 数据文件。读取通过 Raw 文件，不调用 GitHub API；只有保存/发布时需要 Token。</p></div></header><main class="wrap"><section class="card"><h2>🔗 GitHub</h2><div class="grid"><div><label>用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token（仅发布/修改时需要）</label><input id="token" type="password" autocomplete="off" placeholder="读取网站时可以留空"></div></div><button class="btn r" id="load">🔄 读取当前网站</button><a class="btn g" href="../" target="_blank">🌐 打开网站</a><div id="status" class="status">正在准备读取……</div></section><section id="stats" class="statgrid"></section><section class="card"><h2>🏠 当前前台真实内容</h2><div id="siteSnapshot"><div class="muted">正在读取 index.html……</div></div></section><nav class="tabs"><button class="tab on" data-tab="content">📰 内容</button><button class="tab" data-tab="market">📊 行情</button><button class="tab" data-tab="config">🏠 配置</button></nav><section id="content"><section class="card"><h2>当前网站内容库</h2><div class="grid"><div><label>内容文件</label><select id="contentFile"></select></div><div><label>搜索</label><input id="search" placeholder="标题 / ID / 分类"></div></div><div id="contentList" class="list"></div></section><section class="card"><h2>编辑内容</h2><div class="grid"><div><label>ID</label><input id="id"></div><div><label>标题</label><input id="title"></div><div><label>日期</label><input id="date" type="date"></div><div><label>分类/类型</label><input id="category"></div><div><label>状态</label><select id="state"><option value="published">已发布</option><option value="draft">草稿/下架</option><option value="hidden">隐藏</option></select></div><div><label>所属栏目</label><input id="group"></div><div class="wide"><label>摘要 / note</label><textarea id="summary"></textarea></div><div class="wide"><label>正文 / content</label><textarea id="body" style="min-height:280px"></textarea></div><div class="wide"><label>图片路径（一行一张）</label><textarea id="images"></textarea></div></div><button class="btn ok" id="publish">🚀 保存并发布</button><button class="btn g" id="draft">💾 保存草稿</button><button class="btn danger" id="remove">🗑 删除</button><button class="btn x" id="new">➕ 新建</button></section></section><section id="market" class="hide"><section class="card"><h2>当前行情数据</h2><div id="marketList" class="list"></div></section><section class="card"><h2>新增行情</h2><div class="grid"><div><label>行情文件</label><select id="marketFile"></select></div><div><label>品种</label><input id="mTitle"></div><div><label>价格</label><input id="mPrice"></div><div><label>趋势</label><select id="mTrend"><option>↑</option><option>→</option><option>↓</option></select></div><div class="wide"><label>说明</label><textarea id="mNote"></textarea></div></div><button class="btn ok" id="addMarket">💾 保存行情</button></section></section><section id="config" class="hide"><section class="card"><h2>网站配置</h2><div class="grid"><div><label>网站名称</label><input id="siteName"></div><div><label>首页标题</label><input id="heroTitle"></div><div class="wide"><label>首页介绍</label><textarea id="heroText"></textarea></div><div class="wide"><label>顶部公告</label><textarea id="topNotice"></textarea></div></div><button class="btn g" id="saveConfig">💾 保存配置</button></section></section></main><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let contentFiles=[],marketFiles=[],contentData=[],contentPath='',contentSha='';const token=()=>$('#token').value.trim(),owner=()=>$('#owner').value.trim(),repo=()=>$('#repo').value.trim(),branch=()=>$('#branch').value.trim()||'main',rawBase=()=>`https://raw.githubusercontent.com/${owner()}/${repo()}/${branch()}`,apiBase=()=>`/repos/${owner()}/${repo()}`;const msg=(s,ok=false)=>{const e=$('#status');e.textContent=s;e.className='status '+(ok?'okbox':'')};const dec=b=>decodeURIComponent(escape(atob(String(b).replace(/\s/g,''))));const b64=s=>btoa(unescape(encodeURIComponent(s)));async function apiWrite(path,opt={}){const t=token();if(!t)throw Error('保存、发布、删除需要填写 GitHub Token');const r=await fetch('https://api.github.com'+path,{...opt,cache:'no-store',headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',Authorization:`Bearer ${t}`,'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(`${d.message||'GitHub 请求失败'} (${r.status})`);return d}async function rawText(path){const r=await fetch(`${rawBase()}/${path}?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`${path} 读取失败 (${r.status})`);return r.text()}async function rawJson(path,fallback=[]){try{const t=await rawText(path);const d=JSON.parse(t);return d}catch{return fallback}}async function listJsonFiles(dir){const entries=await rawJson('index.json',null).catch(()=>null);const seed=['appreciation.json','fujian.json','history.json','knowledge.json','tongqian.json','tongyuan.json','yinyuan_jizhibi.json','zhibi.json'];if(dir==='data/content')contentFiles=seed.map(name=>({name,path:`${dir}/${name}`}));else{const market=['fujian_tongqian.json','fujian_tongyuan.json','fujian_yinyuan.json','tongqian.json','tongyuan.json','yinyuan.json','yinyuan_jizhibi.json','zhibi.json'];marketFiles=market.map(name=>({name,path:`${dir}/${name}`}));}}function clean(s){const d=document.createElement('div');d.innerHTML=String(s||'');return d.textContent.trim()}function fillStats(){const s=$('#stats');s.innerHTML=`<div class="stat"><b>${contentFiles.length}</b>内容文件</div><div class="stat"><b>${marketFiles.length}</b>行情文件</div><div class="stat"><b>${contentData.length}</b>当前内容</div><div class="stat"><b>Raw</b>读取模式</div>`}async function loadSiteSnapshot(){const html=await rawText('index.html');const doc=new DOMParser().parseFromString(html,'text/html');const title=doc.title||'';const h1=doc.querySelector('h1')?.textContent?.trim()||'';const hs=[...doc.querySelectorAll('h2')].map(x=>x.textContent.trim()).filter(Boolean).slice(0,12);$('#siteSnapshot').innerHTML=`<div class="sitebox"><strong>网页标题：</strong>${clean(title)}</div><div class="sitebox"><strong>主标题：</strong>${clean(h1)}</div><div class="sitebox"><strong>当前栏目：</strong>${hs.length?hs.map(clean).join(' · '):'当前首页未使用 H2 栏目'}</div><div class="muted" style="margin-top:8px">以上内容直接来自当前 main 分支的 index.html。</div>`}async function load(){try{msg('正在通过 Raw 读取当前前台与数据文件……');await loadSiteSnapshot();await listJsonFiles('data/content');await listJsonFiles('data/market');$('#contentFile').innerHTML=contentFiles.map((x,i)=>`<option value="${i}">${x.path}</option>`).join('');$('#marketFile').innerHTML=marketFiles.map((x,i)=>`<option value="${i}">${x.path}</option>`).join('');const cfg=await rawJson('data/site-config.json',{});const real=typeof cfg.content==='string'?(JSON.parse(cfg.content)):cfg;$('#siteName').value=real.siteName||'';$('#heroTitle').value=real.heroTitle||'';$('#heroText').value=real.heroText||'';$('#topNotice').value=real.topNotice||'';await loadContent();await loadMarket();fillStats();msg('✅ 已正常读取当前网站。读取阶段不调用 GitHub API，不受 API 限流影响。',true)}catch(e){$('#status').className='status errbox';$('#status').textContent='❌ '+e.message}}async function loadContent(){const f=contentFiles[Number($('#contentFile').value)];if(!f)return;const a=await rawJson(f.path,[]);contentPath=f.path;contentData=Array.isArray(a)?a:[];renderContent()}function renderContent(){const q=$('#search').value.trim().toLowerCase();const a=contentData.map((x,i)=>({x,i})).filter(o=>!q||JSON.stringify(o.x).toLowerCase().includes(q));$('#contentList').innerHTML=a.map(o=>`<div class="row"><b>${clean(o.x.title||o.x.name||o.x.id||'未命名')}</b> <span class="tag ${o.x.status==='published'?'pub':'draft'}">${clean(o.x.status||'published')}</span><div class="muted">${clean(contentPath)} · ${clean(o.x.date||'')}</div><button class="btn g" onclick="edit(${o.i})">编辑</button></div>`).join('')||'<div class="status">当前文件没有符合条件的内容。</div>'}window.sel=-1;window.edit=i=>{const x=contentData[i]||{};$('#id').value=x.id||'';$('#title').value=x.title||x.name||'';$('#date').value=x.date||'';$('#category').value=x.kind||x.category||'';$('#state').value=x.status||'published';$('#group').value=x.groupId||x.group||'';$('#summary').value=x.note||x.summary||'';$('#body').value=x.content||x.body||'';$('#images').value=Array.isArray(x.images)?x.images.join('\n'):'';window.sel=i;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};function edited(status){return {id:$('#id').value.trim()||('content_'+Date.now()),title:$('#title').value.trim(),date:$('#date').value,kind:$('#category').value.trim(),note:$('#summary').value.trim(),content:$('#body').value,status,groupId:$('#group').value.trim(),images:$('#images').value.split(/\n|\r/).map(x=>x.trim()).filter(Boolean)}}async function getWriteFile(path){return apiWrite(apiBase()+'/contents/'+path.split('/').map(encodeURIComponent).join('/')+'?ref='+encodeURIComponent(branch()),{method:'GET'})}async function putFile(path,text,sha,action){const body={message:'洪盛集藏：'+action,content:b64(text),branch:branch(),sha};const r=await apiWrite(apiBase()+'/contents/'+path.split('/').map(encodeURIComponent).join('/'),{method:'PUT',body:JSON.stringify(body)});return r.content?.sha||''}async function save(status){if(!$('#title').value.trim())return alert('请填写标题');const x=edited(status);if(window.sel===-1)contentData.push(x);else contentData[window.sel]={...contentData[window.sel],...x};const f=await getWriteFile(contentPath);contentSha=f.sha;contentSha=await putFile(contentPath,JSON.stringify(contentData,null,2),contentSha,status==='published'?'发布内容':'保存草稿');window.sel=-1;await loadContent();msg('✅ 内容已写入当前 GitHub 数据库。',true)}async function remove(){if(window.sel===-1)return alert('请先选择一条内容');if(!confirm('确定删除这条内容？'))return;const next=contentData.slice();next.splice(window.sel,1);const f=await getWriteFile(contentPath);await putFile(contentPath,JSON.stringify(next,null,2),f.sha,'删除内容');contentData=next;window.sel=-1;renderContent();msg('✅ 内容已删除并同步。',true)}$('#publish').onclick=()=>save('published').catch(e=>msg('❌ '+e.message));$('#draft').onclick=()=>save('draft').catch(e=>msg('❌ '+e.message));$('#remove').onclick=()=>remove().catch(e=>msg('❌ '+e.message));$('#new').onclick=()=>{window.sel=-1;['id','title','date','category','group','summary','body','images'].forEach(id=>$('#'+id).value='');$('#date').value=new Date().toISOString().slice(0,10)};$('#search').oninput=renderContent;$('#contentFile').onchange=loadContent;async function loadMarket(){let html='';for(const f of marketFiles){const a=await rawJson(f.path,[]);html+=`<div class="card"><b>${f.name}</b>${Array.isArray(a)?a.map(x=>`<div class="row"><b>${clean(x.title||x.name||'-')}</b>　${clean(x.price||x.priceRange||'-')}　${clean(x.trend||'')}<div class="muted">${clean(x.date||'')} ${clean(x.note||x.content||'')}</div></div>`).join(''):''}</div>`}$('#marketList').innerHTML=html||'<div class="status">暂无行情。</div>'}$('#addMarket').onclick=async()=>{try{const f=marketFiles[Number($('#marketFile').value)];if(!f)return;const existing=await getWriteFile(f.path);let a=JSON.parse(dec(existing.content));if(!Array.isArray(a))a=[];a.unshift({id:'market_'+Date.now(),title:$('#mTitle').value.trim(),date:new Date().toISOString().slice(0,10),price:$('#mPrice').value.trim(),trend:$('#mTrend').value,note:$('#mNote').value.trim(),status:'published'});await putFile(f.path,JSON.stringify(a,null,2),existing.sha,'新增行情');await loadMarket();msg('✅ 行情已写入当前行情库。',true)}catch(e){msg('❌ '+e.message)}};$('#saveConfig').onclick=async()=>{try{const current=await getWriteFile('data/site-config.json');let cfg=JSON.parse(dec(current.content));if(typeof cfg.content==='string')cfg=JSON.parse(cfg.content);cfg.siteName=$('#siteName').value.trim();cfg.heroTitle=$('#heroTitle').value.trim();cfg.heroText=$('#heroText').value.trim();cfg.topNotice=$('#topNotice').value.trim();await putFile('data/site-config.json',JSON.stringify(cfg,null,2),current.sha,'更新网站配置');msg('✅ 网站配置已同步。',true)}catch(e){msg('❌ '+e.message)}};$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');['content','market','config'].forEach(id=>$('#'+id).classList.add('hide'));$('#'+t.dataset.tab).classList.remove('hide')});$('#load').onclick=load;load();</script></body></html>
