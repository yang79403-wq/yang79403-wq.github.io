<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1414"><title>洪盛集藏｜网站内容管理</title><style>:root{--r:#6b1414;--g:#c9a35a;--c:#f7f2e7;--card:#fffdf8;--t:#3a2f22;--m:#8a7a5f;--l:#e8ddc4}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--t);font-family:"PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(1180px,94vw);margin:auto}.top{background:linear-gradient(135deg,#6b1414,#861b12);color:#f7d98d;padding:18px 0}.top h1{margin:0;font-size:23px}.top p{margin:6px 0 0;color:#f1dcc0;font-size:12px}.card{background:var(--card);border:1px solid var(--l);border-radius:10px;padding:15px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{display:block;font-weight:700;margin:4px 0}input,textarea,select{width:100%;padding:10px;border:1px solid #d8c8b5;border-radius:7px;background:#fff;color:var(--t);font:inherit}textarea{min-height:120px;resize:vertical}.btn{border:0;border-radius:7px;padding:10px 14px;margin:3px;font-weight:700;cursor:pointer}.r{background:var(--r);color:#fff}.g{background:var(--g);color:#32130d}.x{background:#756a63;color:#fff}.ok{background:#2f6b3b;color:#fff}.danger{background:#a62a20;color:#fff}.status{padding:10px;border-radius:7px;background:#fff5dd;border:1px solid #dfc18a;white-space:pre-wrap}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tab{padding:9px 14px;border:1px solid var(--l);border-radius:999px;background:#fff;color:var(--r);font-weight:700;white-space:nowrap;cursor:pointer}.tab.on{background:var(--r);color:#fff}.hide{display:none}.list{display:grid;gap:8px}.row{border:1px solid var(--l);background:#fffaf3;border-radius:8px;padding:11px}.muted{font-size:12px;color:var(--m)}.tag{display:inline-block;padding:3px 7px;border-radius:20px;background:#eadbc3;font-size:11px}.pub{background:#e5f3e8;color:#276035}.draft{background:#eee9e3;color:#6d6259}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff8ea;border:1px solid var(--l);border-radius:8px;padding:11px;text-align:center}.stat b{display:block;font-size:22px;color:var(--r)}@media(max-width:700px){.grid,.statgrid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header class="top"><div class="wrap"><h1>🏮 洪盛集藏｜网站内容管理</h1><p>管理当前网站真实内容，不改首页结构，不创建旧版内容库。</p></div></header><main class="wrap"><section class="card"><h2>🔐 GitHub</h2><div class="grid"><div><label>用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>Token</label><input id="token" type="password"></div></div><button class="btn r" id="load">读取当前网站</button><a class="btn g" href="../" target="_blank">打开网站</a><div id="status" class="status">等待连接。</div></section><section id="stats" class="statgrid"></section><nav class="tabs"><button class="tab on" data-tab="content">📰 内容</button><button class="tab" data-tab="market">📊 行情</button><button class="tab" data-tab="config">🏠 配置</button></nav><section id="content"><section class="card"><h2>当前网站内容库</h2><div class="grid"><div><label>内容文件</label><select id="contentFile"></select></div><div><label>搜索</label><input id="search" placeholder="标题 / ID / 分类"></div></div><div id="contentList" class="list"></div></section><section class="card"><h2>编辑内容</h2><div class="grid"><div><label>ID</label><input id="id"></div><div><label>标题</label><input id="title"></div><div><label>日期</label><input id="date" type="date"></div><div><label>分类</label><input id="category"></div><div><label>状态</label><select id="state"><option value="published">已发布</option><option value="draft">草稿/下架</option><option value="hidden">隐藏</option></select></div><div><label>所属栏目</label><input id="group"></div><div class="wide"><label>摘要</label><textarea id="summary"></textarea></div><div class="wide"><label>正文</label><textarea id="body" style="min-height:280px"></textarea></div><div class="wide"><label>图片路径（一行一张）</label><textarea id="images"></textarea></div></div><button class="btn ok" id="publish">保存并发布</button><button class="btn g" id="draft">保存草稿</button><button class="btn danger" id="remove">删除</button><button class="btn x" id="new">新建</button></section></section><section id="market" class="hide"><section class="card"><h2>当前行情数据</h2><div id="marketList" class="list"></div></section><section class="card"><h2>新增行情</h2><div class="grid"><div><label>行情文件</label><select id="marketFile"></select></div><div><label>品种</label><input id="mTitle"></div><div><label>价格</label><input id="mPrice"></div><div><label>趋势</label><select id="mTrend"><option>↑</option><option>→</option><option>↓</option></select></div><div class="wide"><label>说明</label><textarea id="mNote"></textarea></div></div><button class="btn ok" id="addMarket">保存行情</button></section></section><section id="config" class="hide"><section class="card"><h2>网站配置</h2><div class="grid"><div><label>网站名称</label><input id="siteName"></div><div><label>首页标题</label><input id="heroTitle"></div><div class="wide"><label>首页介绍</label><textarea id="heroText"></textarea></div><div class="wide"><label>顶部公告</label><textarea id="topNotice"></textarea></div></div><button class="btn g" id="saveConfig">保存配置</button></section></section></main><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],API='https://api.github.com';let contentFiles=[],marketFiles=[],contentData=[],contentPath='',contentSha='',configSha='';
const token=()=>$('#token').value.trim(), base=()=>`/repos/${$('#owner').value.trim()}/${$('#repo').value.trim()}`, branch=()=>$('#branch').value.trim()||'main';
const msg=(s,ok=false)=>{let e=$('#status');e.textContent=s;e.style.background=ok?'#e8f5e9':'#fff5dd'};
async function api(path,opt={}){if(!token())throw Error('请先填写 GitHub Token');let r=await fetch(API+path,{...opt,cache:'no-store',headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${token()}`,'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(`${d.message||'GitHub请求失败'} (${r.status})`);return d}
const dec=b=>decodeURIComponent(escape(atob(String(b).replace(/\s/g,''))));const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function getFile(path){return api(base()+'/contents/'+path.split('/').map(encodeURIComponent).join('/')+'?ref='+encodeURIComponent(branch()))}
async function putFile(path,text,sha,msgText){let body={message:'洪盛集藏：'+msgText,content:b64(text),branch:branch()};if(sha)body.sha=sha;let r=await api(base()+'/contents/'+path.split('/').map(encodeURIComponent).join('/'),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.content?.sha||''}
function fillStats(){const s=$('#stats');s.innerHTML=`<div class="stat"><b>${contentFiles.length}</b>内容文件</div><div class="stat"><b>${marketFiles.length}</b>行情文件</div><div class="stat"><b>当前站点</b>唯一数据源</div>`}
async function load(){try{msg('正在读取当前网站真实数据……');let c=await api(base()+'/contents/data/content?ref='+encodeURIComponent(branch()));let m=await api(base()+'/contents/data/market?ref='+encodeURIComponent(branch()));contentFiles=(c||[]).filter(x=>x.type==='file'&&x.name.endsWith('.json'));marketFiles=(m||[]).filter(x=>x.type==='file'&&x.name.endsWith('.json'));$('#contentFile').innerHTML=contentFiles.map((x,i)=>`<option value="${i}">${x.path}</option>`).join('');$('#marketFile').innerHTML=marketFiles.map((x,i)=>`<option value="${i}">${x.path}</option>`).join('');let cf=await getFile('data/site-config.json');let cfg=JSON.parse(dec(cf.content));if(typeof cfg.content==='string'){try{cfg=JSON.parse(cfg.content)}catch{}}configSha=cf.sha;$('#siteName').value=cfg.siteName||'';$('#heroTitle').value=cfg.heroTitle||'';$('#heroText').value=cfg.heroText||'';$('#topNotice').value=cfg.topNotice||'';fillStats();if(contentFiles.length)await loadContent();await loadMarket();msg('✅ 当前网站真实内容已读取。',true)}catch(e){msg('❌ '+e.message)}}
async function loadContent(){let f=contentFiles[Number($('#contentFile').value)];if(!f)return;let r=await getFile(f.path);contentPath=f.path;contentSha=r.sha;contentData=JSON.parse(dec(r.content));if(!Array.isArray(contentData))contentData=[];renderContent()}
function renderContent(){let q=$('#search').value.trim().toLowerCase();let a=contentData.map((x,i)=>({x,i})).filter(o=>!q||JSON.stringify(o.x).toLowerCase().includes(q));$('#contentList').innerHTML=a.map(o=>`<div class="row"><b>${String(o.x.title||o.x.name||o.x.id||'未命名')}</b> <span class="tag ${o.x.status==='published'?'pub':'draft'}">${o.x.status||'published'}</span><div class="muted">${contentPath} · ${o.x.date||''}</div><button class="btn g" onclick="edit(${o.i})">编辑</button></div>`).join('')||'<div class="status">当前文件没有符合条件的内容。</div>'}
window.edit=i=>{let x=contentData[i]||{};$('#id').value=x.id||'';$('#title').value=x.title||x.name||'';$('#date').value=x.date||'';$('#category').value=x.category||x.kind||'';$('#state').value=x.status||'published';$('#group').value=x.group||'';$('#summary').value=x.summary||x.note||'';$('#body').value=x.body||x.content||'';$('#images').value=Array.isArray(x.images)?x.images.join('\n'):'';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});window.sel=i};
function getEdit(status){return {id:$('#id').value.trim()||('content_'+Date.now()),title:$('#title').value.trim(),date:$('#date').value,category:$('#category').value.trim(),status,group:$('#group').value.trim(),summary:$('#summary').value.trim(),body:$('#body').value,images:$('#images').value.split(/\n|\r/).map(x=>x.trim()).filter(Boolean)}}
async function save(status){if(!$('#title').value.trim())return alert('请填写标题');let x=getEdit(status);if(window.sel===undefined||window.sel===-1)contentData.push(x);else contentData[window.sel]={...contentData[window.sel],...x};contentSha=await putFile(contentPath,JSON.stringify(contentData,null,2),contentSha,status==='published'?'发布内容':'保存草稿');window.sel=-1;await loadContent();msg('✅ 已写入当前内容库并同步 GitHub。',true)}
$('#publish').onclick=()=>save('published');$('#draft').onclick=()=>save('draft');$('#new').onclick=()=>{window.sel=-1;$$('#id,#title,#date,#category,#group,#summary,#body,#images').forEach(e=>e.value='');$('#date').value=new Date().toISOString().slice(0,10)};
$('#remove').onclick=async()=>{if(window.sel===undefined||window.sel===-1)return alert('请先选择一条内容');if(!confirm('确定删除？'))return;contentData.splice(window.sel,1);contentSha=await putFile(contentPath,JSON.stringify(contentData,null,2),contentSha,'删除内容');window.sel=-1;await loadContent();msg('✅ 已删除并同步。',true)};
$('#search').oninput=renderContent;$('#contentFile').onchange=loadContent;
async function loadMarket(){let h='';for(const f of marketFiles){let r=await getFile(f.path),a=JSON.parse(dec(r.content));if(!Array.isArray(a))a=[];h+=`<div class="card"><b>${f.name}</b>${a.map(x=>`<div class="row"><b>${x.title||x.name||'-'}</b>　${x.price||x.priceRange||'-'}　${x.trend||''}<div class="muted">${x.date||''} ${x.note||''}</div></div>`).join('')}</div>`}$('#marketList').innerHTML=h||'<div class="status">暂无行情。</div>'}
$('#addMarket').onclick=async()=>{let f=marketFiles[Number($('#marketFile').value)];if(!f)return;let r=await getFile(f.path),a=JSON.parse(dec(r.content));if(!Array.isArray(a))a=[];a.unshift({id:'market_'+Date.now(),title:$('#mTitle').value.trim(),date:new Date().toISOString().slice(0,10),price:$('#mPrice').value.trim(),trend:$('#mTrend').value,note:$('#mNote').value.trim(),status:'published'});await putFile(f.path,JSON.stringify(a,null,2),r.sha,'新增行情');await loadMarket();msg('✅ 行情已写入当前行情库。',true)};
$('#saveConfig').onclick=async()=>{try{let f=await getFile('data/site-config.json'),cfg=JSON.parse(dec(f.content));if(typeof cfg.content==='string'){try{cfg=JSON.parse(cfg.content)}catch{}}cfg.siteName=$('#siteName').value.trim();cfg.heroTitle=$('#heroTitle').value.trim();cfg.heroText=$('#heroText').value.trim();cfg.topNotice=$('#topNotice').value.trim();configSha=await putFile('data/site-config.json',JSON.stringify(cfg,null,2),f.sha,'更新网站配置');msg('✅ 网站配置已同步。',true)}catch(e){msg('❌ '+e.message)}};
$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');['content','market','config'].forEach(id=>$('#'+id).classList.add('hide'));$('#'+t.dataset.tab).classList.remove('hide')});
</script></body></html>
