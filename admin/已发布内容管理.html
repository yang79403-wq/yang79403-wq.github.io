<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>洪盛集藏｜已发布内容管理</title>
<style>
:root{--r:#6b1414;--g:#c9a35a;--bg:#f7f2e7;--card:#fffdf8;--ink:#3a2f22;--muted:#8a7a5f;--line:#e5d8bf;--danger:#a62a20;--ok:#2f6b3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{background:linear-gradient(135deg,#5a0f0f,#861b12);color:#f5d887;padding:20px 4vw}.top h1{margin:0;font-size:26px}.top p{margin:7px 0 0;color:#f1dcc0}.wrap{width:min(1500px,95vw);margin:16px auto}.bar,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:14px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--r);color:#fff}.gold{background:var(--g);color:#35160e}.danger{background:var(--danger);color:#fff}.light{background:#eee7dc;color:#4a4038}.ok{background:var(--ok);color:#fff}input,select,textarea{width:100%;padding:10px;border:1px solid #d8c8b5;border-radius:8px;background:#fff;font:inherit;color:var(--ink)}.filters{display:grid;grid-template-columns:1fr 260px 180px;gap:10px}.layout{display:grid;grid-template-columns:390px 1fr;gap:14px}.list{max-height:70vh;overflow:auto}.item{padding:12px;border:1px solid var(--line);border-radius:9px;background:#fffaf3;margin-bottom:8px;cursor:pointer}.item:hover,.item.on{border-color:var(--g);background:#fff8e8}.item b{color:var(--r)}.muted{font-size:12px;color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}.status{padding:10px;border-radius:8px;background:#fff8e8;border:1px solid #dfc18a;margin-top:10px;white-space:pre-wrap}.success{background:#e9f5eb;color:#276035;border-color:#b8d7bf}.error{background:#fff0ed;color:#9b231a;border-color:#e2b6ad}.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:90px;height:70px;object-fit:cover;border:1px solid var(--line);border-radius:6px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:900px){.layout,.filters,.grid{grid-template-columns:1fr}.list{max-height:45vh}}
</style></head>
<body>
<header class="top"><h1>🏮 洪盛集藏｜已发布内容管理</h1><p>全中文菜单｜读取网站现有内容｜修改、删除、更换发布板块｜不改变正式首页版面</p></header>
<main class="wrap">
<section class="bar">
<button class="btn primary" id="reload">🔄 读取全部已发布内容</button>
<a class="btn gold" href="../" target="_blank">🌐 查看网站</a>
<label style="display:flex;align-items:center;gap:8px;margin:0">GitHub Token（仅修改/删除/移动时需要）<input id="token" type="password" placeholder="输入有 Contents 写入权限的 Token" style="width:320px"></label>
</section>
<section class="card"><div class="filters"><input id="search" placeholder="🔍 搜索标题、摘要、正文"><select id="type"><option value="all">全部板块</option></select><select id="status"><option value="published">只看已发布</option><option value="all">全部状态</option></select></div><div id="statusMsg" class="status">正在准备读取网站内容……</div></section>
<section class="layout">
<aside class="card"><h2>📚 已发布内容列表</h2><div id="count" class="muted"></div><div id="list" class="list"><div class="empty">点击“读取全部已发布内容”</div></div></aside>
<section class="card"><h2 id="editorTitle">📝 内容详情</h2><div id="editor"><div class="empty">选择左侧内容后编辑</div></div></section>
</section>
</main>
<script>
const OWNER='yang79403-wq',REPO='yang79403-wq.github.io',BRANCH='main';
const $=id=>document.getElementById(id);let all=[],selected=null,sourceCache={};
const rawBase=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const apiBase=`https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
const names={appreciation:'收藏学院',fujian:'福建钱币',history:'钱币历史',knowledge:'评级知识',tongqian:'古钱币',tongyuan:'铜元',yinyuan_jizhibi:'银元 / 机制币',zhibi:'纸币'};
function headers(){const t=$('token').value.trim();return t?{'Accept':'application/vnd.github+json','Authorization':'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28'}:{'Accept':'application/vnd.github+json'}}
function msg(t,ok=false,err=false){$('statusMsg').textContent=t;$('statusMsg').className='status '+(ok?'success':err?'error':'')}
async function api(path,opts={}){const r=await fetch(apiBase+path+'?ref='+BRANCH,{...opts,headers:{...headers(),...(opts.headers||{})}});if(!r.ok)throw Error(path+'：'+r.status+' '+await r.text());return r.json()}
async function readJson(path){if(sourceCache[path])return sourceCache[path];const r=await fetch(rawBase+path+'?v='+Date.now());if(!r.ok)throw Error(path+'：'+r.status);const j=await r.json();sourceCache[path]=j;return j}
async function load(){msg('正在读取网站全部内容……');$('list').innerHTML='<div class="empty">读取中……</div>';try{const [c,m]=await Promise.all([api('data/content'),api('data/market').catch(()=>[]) ]);const files=[...c.filter(x=>x.type==='file'&&x.name.endsWith('.json')).map(x=>({path:x.path,name:x.name,kind:'内容'})),...m.filter(x=>x.type==='file'&&x.name.endsWith('.json')).map(x=>({path:x.path,name:x.name,kind:'行情'}))];all=[];sourceCache={};for(const f of files){try{const data=await readJson(f.path);if(Array.isArray(data))data.forEach((x,i)=>{all.push({...x,__path:f.path,__file:f.name,__kind:f.kind,__index:i,__section:names[f.name.replace('.json','')]||f.name.replace('.json','')})})}catch(e){console.warn(e)}}populate();msg(`读取完成：共 ${all.length} 条内容，${files.length} 个板块数据文件。`,true)}catch(e){msg('读取失败：'+e.message,true,false);$('statusMsg').className='status error';$('list').innerHTML='<div class="empty">无法读取，请检查网络或 GitHub 仓库是否公开。</div>'}}
function populate(){const sel=$('type');const sections=[...new Set(all.map(x=>x.__section))].sort();sel.innerHTML='<option value="all">全部板块</option>'+sections.map(x=>`<option>${esc(x)}</option>`).join('');render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const q=$('search').value.trim().toLowerCase(),sec=$('type').value,st=$('status').value;const arr=all.filter(x=>(sec==='all'||x.__section===sec)&&(st==='all'||(x.status||'published')===st)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$('count').textContent=`显示 ${arr.length} / ${all.length} 条`;$('list').innerHTML=arr.length?arr.map((x,i)=>`<div class="item ${selected===x?'on':''}" data-key="${esc(x.__path+'|'+x.__index)}"><b>${esc(x.title||x.name||'无标题')}</b><div>${esc(x.__section)} · ${esc(x.date||'')}</div><div class="muted">${esc((x.note||x.content||'').replace(/\n/g,' ').slice(0,100))}</div></div>`).join(''):'<div class="empty">没有找到内容</div>';document.querySelectorAll('.item').forEach(el=>el.onclick=()=>{const [p,i]=el.dataset.key.split('|');selected=all.find(x=>x.__path===p&&String(x.__index)===i);show()})}
function show(){if(!selected)return;$('editorTitle').textContent='📝 编辑：'+(selected.title||'未命名');const images=Array.isArray(selected.images)?selected.images:[];$('editor').innerHTML=`<div class="grid"><div><label>当前板块</label><input value="${esc(selected.__section)}" disabled></div><div><label>内容状态</label><select id="eStatus"><option value="published">已发布</option><option value="draft">草稿</option><option value="hidden">隐藏</option></select></div><div><label>标题</label><input id="eTitle" value="${esc(selected.title||'')}"></div><div><label>日期</label><input id="eDate" type="date" value="${esc(selected.date||'')}"></div><div><label>类型</label><input id="eKind" value="${esc(selected.kind||'')}"></div><div><label>价格 / 报价</label><input id="ePrice" value="${esc(selected.price||'')}"></div><div class="wide"><label>更换发布板块</label><select id="eSection"></select></div><div class="wide"><label>摘要 / 导语</label><textarea id="eNote" style="min-height:100px">${esc(selected.note||'')}</textarea></div><div class="wide"><label>正文内容</label><textarea id="eBody" style="min-height:360px">${esc(selected.content||'')}</textarea></div><div class="wide"><label>图片地址（每行一张）</label><textarea id="eImages" style="min-height:90px">${esc(images.join('\n'))}</textarea></div><div class="wide"><label>当前图片</label><div class="thumbs">${images.map(src=>`<img src="${esc(src)}" onerror="this.style.opacity=.25">`).join('')||'<span class="muted">无图片</span>'}</div></div></div><div style="margin-top:12px"><button class="btn ok" id="save">💾 保存修改</button><button class="btn gold" id="move">🔄 更换发布板块并保存</button><button class="btn danger" id="del">🗑️ 删除内容</button><button class="btn light" id="cancel">↩️ 取消选择</button></div><div id="editMsg" class="status">修改操作需要 GitHub Token。</div>`;const sections=[...new Set(all.filter(x=>x.__kind===selected.__kind).map(x=>x.__section))].sort();$('eSection').innerHTML=sections.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');$('eSection').value=selected.__section;$('eStatus').value=selected.status||'published';$('cancel').onclick=()=>{selected=null;$('editor').innerHTML='<div class="empty">选择左侧内容后编辑</div>';render()};$('save').onclick=()=>save(false);$('move').onclick=()=>save(true);$('del').onclick=remove}
function form(){return {...selected,title:$('eTitle').value.trim(),date:$('eDate').value,kind:$('eKind').value.trim(),price:$('ePrice').value, note:$('eNote').value,content:$('eBody').value,images:$('eImages').value.split(/\n+/).map(x=>x.trim()).filter(Boolean),status:$('eStatus').value}}
async function save(move){if(!$('token').value.trim())return alert('请先输入 GitHub Token。');const x=form();const target=[...new Set(all.filter(a=>a.__kind===selected.__kind).map(a=>a.__section))].find(s=>s===$('eSection').value);if(!target)return alert('请选择目标板块。');try{const old=await api(selected.__path);const arr=JSON.parse(atob(old.content.replace(/\n/g,'')));const idx=selected.__index;arr[idx]={...arr[idx],title:x.title,date:x.date,kind:x.kind,price:x.price,note:x.note,content:x.content,images:x.images,status:x.status};if(move&&target!==selected.__section){const files=await api(selected.__kind==='内容'?'data/content':'data/market');const targetFile=files.find(f=>(names[f.name.replace('.json','')]||f.name.replace('.json',''))===target);if(!targetFile)throw Error('找不到目标板块数据文件');const tf=await api(targetFile.path);const ta=JSON.parse(atob(tf.content.replace(/\n/g,'')));const copy={...arr[idx]};delete copy.__path;delete copy.__file;delete copy.__kind;delete copy.__index;delete copy.__section;ta.unshift(copy);arr.splice(idx,1);await write(selected.__path,JSON.stringify(arr,null,2),'更换发布板块：'+x.title);await write(targetFile.path,JSON.stringify(ta,null,2),'接收移动内容：'+x.title)}else{await write(selected.__path,JSON.stringify(arr,null,2),'修改已发布内容：'+x.title)}msg(move&&target!==selected.__section?'已修改并更换发布板块。':'内容修改成功。',true);await load()}catch(e){$('editMsg').textContent='操作失败：'+e.message;$('editMsg').className='status error'}}
async function write(path,text,message){const j=await api(path);const bytes=new TextEncoder().encode(text);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));const r=await fetch(apiBase+path+'?ref='+BRANCH,{method:'PUT',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({message,content:btoa(bin),sha:j.sha,branch:BRANCH})});if(!r.ok)throw Error(await r.text())}
async function remove(){if(!$('token').value.trim())return alert('请先输入 GitHub Token。');if(!confirm('确定删除这条已发布内容吗？此操作会同步修改网站数据。'))return;try{const j=await api(selected.__path);const arr=JSON.parse(atob(j.content.replace(/\n/g,'')));arr.splice(selected.__index,1);await write(selected.__path,JSON.stringify(arr,null,2),'删除已发布内容：'+(selected.title||''));msg('删除成功，网站数据已同步。',true);selected=null;await load();$('editor').innerHTML='<div class="empty">选择左侧内容后编辑</div>'}catch(e){msg('删除失败：'+e.message,false,true)}}
$('reload').onclick=load;$('search').oninput=render;$('type').onchange=render;$('status').onchange=render;load();
</script></body></html>
