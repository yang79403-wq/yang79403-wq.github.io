<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>洪盛集藏｜已发布内容管理</title>
<style>
:root{--r:#6b1414;--g:#c9a35a;--bg:#f7f2e7;--card:#fffdf8;--ink:#3a2f22;--muted:#8a7a5f;--line:#e5d8bf;--ok:#2f6b3b;--danger:#a62a20;--blue:#2a5f9e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(1500px,96vw);margin:auto}.top{background:linear-gradient(135deg,#5a0f0f,#861b12);color:#f5d887;padding:18px 0}.top h1{margin:0;font-size:25px}.top p{margin:6px 0 0;color:#f1dcc0;font-size:13px}.bar{background:#fff;border-bottom:1px solid var(--line);padding:10px 0;position:sticky;top:0;z-index:5}.bar .wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--r);color:#fff}.gold{background:var(--g);color:#35160e}.ok{background:var(--ok);color:#fff}.danger{background:var(--danger);color:#fff}.blue{background:var(--blue);color:#fff}.light{background:#eee7dc;color:#4a4038}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin:14px 0}.grid{display:grid;grid-template-columns:320px 1fr;gap:14px}.list{display:grid;gap:8px;max-height:calc(100vh - 230px);overflow:auto}.item{border:1px solid var(--line);background:#fffaf3;border-radius:9px;padding:12px;cursor:pointer}.item:hover,.item.sel{border-color:var(--g);background:#fff8e8}.item b{color:var(--r)}.muted,.hint{font-size:12px;color:var(--muted);line-height:1.6}label{display:block;font-weight:700;margin:5px 0}input,select,textarea{width:100%;padding:10px;border:1px solid #d8c8b5;border-radius:8px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:300px;resize:vertical;line-height:1.65}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.status{padding:10px;border-radius:8px;background:#fff5dd;border:1px solid #dfc18a;white-space:pre-wrap}.success{background:#e9f5eb;color:#276035;border-color:#b8d7bf}.error{background:#fff0ed;color:#9b231a;border-color:#e2b6ad}.tools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.preview{border:1px dashed #d8c8b5;border-radius:8px;padding:10px;background:#fff;min-height:80px}.preview img{max-width:180px;max-height:120px;margin:5px;border-radius:5px}.search{margin-bottom:10px}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#eee7dc;font-size:11px;margin-left:5px}.danger-text{color:var(--danger)}@media(max-width:900px){.grid,.row{grid-template-columns:1fr}.list{max-height:350px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1>🏮 洪盛集藏｜已发布内容管理</h1><p>统一中文后台｜已发布内容可修改、删除、更换板块；图片可上传并插入正文任意位置。</p></div></header>
<nav class="bar"><div class="wrap"><button class="btn primary" id="connect">🔄 读取已发布内容</button><button class="btn gold" id="newBtn">➕ 发布新内容</button><button class="btn light" id="refreshBtn">↻ 刷新</button><a class="btn light" href="management-center.html">← 返回内容管理中心</a><a class="btn light" href="../../" target="_blank">🌐 查看网站</a></div></nav>
<main class="wrap">
<section class="card"><div class="row"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="需要 Contents 读写权限"></div></div><div id="status" class="status" style="margin-top:10px">请输入 Token 后点击“读取已发布内容”。</div></section>
<section class="grid">
<aside class="card"><h2>📚 已发布内容</h2><input class="search" id="search" placeholder="搜索标题、板块、日期"><div id="contentList" class="list"></div></aside>
<section class="card">
<h2 id="editorTitle">📝 发布新内容</h2><div id="path" class="muted"></div>
<div class="row">
<div class="wide"><label>📌 所属板块</label><select id="section"><option value="">请选择板块</option></select><div class="hint">修改此项后保存，即可把内容更换到另一个板块。</div></div>
<div><label>ID</label><input id="id"></div><div><label>日期</label><input id="date" type="date"></div>
<div><label>标题</label><input id="title"></div><div><label>类型</label><input id="kind" placeholder="文章 / 鉴赏 / 历史研究 / 公告"></div>
<div class="wide"><label>摘要 / 导语</label><textarea id="note" style="min-height:110px"></textarea></div>
<div class="wide"><label>正文</label>
<div class="tools"><button class="btn blue" id="uploadBtn">🖼️ 上传图片并插入光标位置</button><button class="btn light" id="insertBtn">📎 插入图片地址</button><input id="imageFile" type="file" accept="image/*" hidden></div>
<textarea id="body" placeholder="把光标放到正文任意位置，再点击“上传图片并插入光标位置”。图片会自动上传到网站并插入 Markdown 图片代码。"></textarea>
<div class="hint">图片插入位置由正文光标决定。也可以先输入文字，再把光标放到任意段落中上传图片。</div></div>
<div class="wide"><label>已使用图片</label><textarea id="images" style="min-height:100px" placeholder="每行一个图片地址"></textarea></div>
<div><label>状态</label><select id="state"><option value="published">已发布</option><option value="draft">草稿</option><option value="hidden">隐藏</option></select></div>
</div>
<div class="tools"><button class="btn ok" id="save">💾 保存并发布</button><button class="btn primary" id="saveDraft">📝 保存草稿</button><button class="btn danger" id="delete">🗑️ 删除内容</button><button class="btn light" id="clear">清空</button></div>
<div id="editStatus" class="status">等待操作</div>
<section class="card"><h3>🖼️ 图片预览</h3><div id="preview" class="preview">上传图片后这里显示预览。</div></section>
</section></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);const today=new Date().toISOString().slice(0,10);
let token='',owner='yang79403-wq',repo='yang79403-wq.github.io',branch='main';let files=[],records=[],current=null;
const names={appreciation:'收藏学院',fujian:'福建钱币',history:'钱币历史',knowledge:'评级知识',tongqian:'古钱币',tongyuan:'铜元',yinyuan_jizhibi:'银元 / 机制币',zhibi:'纸币'};
const api=p=>`https://api.github.com/repos/${owner}/${repo}/contents/${p}?ref=${encodeURIComponent(branch)}`;
const headers=()=>({'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'});
function setStatus(el,text,ok=false){el.textContent=text;el.className='status '+(ok?'success':'')}
async function listDir(p){const r=await fetch(api(p),{headers:headers()});if(!r.ok)throw Error(await r.text());return r.json()}
async function getFile(p){const r=await fetch(api(p),{headers:headers()});if(!r.ok)throw Error(await r.text());const j=await r.json();const b=Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0));const text=new TextDecoder().decode(b);return {sha:j.sha,json:JSON.parse(text)}}
async function saveFile(p,text,sha,message){const b=new TextEncoder().encode(text);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode(...b.subarray(i,i+0x8000));const body={message,content:btoa(bin),branch};if(sha)body.sha=sha;const r=await fetch(api(p),{method:'PUT',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return r.json()}
async function deleteFile(p,sha){const r=await fetch(api(p),{method:'DELETE',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({message:'删除洪盛集藏已发布内容',sha,branch})});if(!r.ok)throw Error(await r.text());return r.json()}
function clearForm(){current=null;$('editorTitle').textContent='📝 发布新内容';$('path').textContent='';['id','title','kind','note','body','images'].forEach(x=>$(x).value='');$('section').value='';$('date').value=today;$('state').value='published';$('preview').innerHTML='上传图片后这里显示预览。';setStatus($('editStatus'),'等待操作')}
function renderList(){const q=$('search').value.trim().toLowerCase();const arr=records.filter(x=>(x.title+' '+x.section+' '+x.date).toLowerCase().includes(q));$('contentList').innerHTML=arr.map((x,i)=>`<div class="item" data-i="${records.indexOf(x)}"><b>${esc(x.title||'无标题')}</b><span class="badge">${esc(x.sectionName)}</span><div class="muted">${esc(x.date||'')} · ${esc(x.path)}</div></div>`).join('');document.querySelectorAll('.item').forEach(el=>el.onclick=()=>loadRecord(Number(el.dataset.i)))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadAll(){owner=$('owner').value.trim();repo=$('repo').value.trim();branch=$('branch').value.trim();token=$('token').value.trim();if(!token)throw Error('请先输入 GitHub Token');const list=await listDir('data/content');files=list.filter(x=>x.type==='file'&&x.name.endsWith('.json'));$('section').innerHTML='<option value="">请选择板块</option>'+files.map(x=>`<option value="${esc(x.name)}">${esc(names[x.name.replace('.json','')]||x.name.replace('.json',''))}</option>`).join('');records=[];for(const f of files){try{const d=await getFile(f.path);const arr=Array.isArray(d.json)?d.json:(Array.isArray(d.json.items)?d.json.items:[]);arr.forEach((item,index)=>records.push({...item,_index:index,_sha:d.sha,path:f.path,section:f.name,sectionName:names[f.name.replace('.json','')]||f.name.replace('.json','')}))}catch(e){console.warn(f.path,e)}}records.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));renderList();setStatus($('status'),`已读取 ${records.length} 条内容，共 ${files.length} 个板块。`,true)}
function loadRecord(i){const x=records[i];if(!x)return;current={...x};$('editorTitle').textContent='✏️ 修改已发布内容';$('path').textContent=x.path;$('section').value=x.section;$('id').value=x.id||'';$('title').value=x.title||'';$('date').value=x.date||today;$('kind').value=x.kind||'';$('note').value=x.note||'';$('body').value=x.content||'';$('images').value=(Array.isArray(x.images)?x.images:[]).join('\n');$('state').value=x.status||'published';renderPreview();document.querySelectorAll('.item').forEach(e=>e.classList.remove('sel'));const target=[...document.querySelectorAll('.item')].find(e=>Number(e.dataset.i)===i);if(target)target.classList.add('sel');setStatus($('editStatus'),'已载入，可修改或更换板块。')}
function readForm(){const section=$('section').value;if(!section)throw Error('请选择所属板块');const id=$('id').value.trim()||('article_'+Date.now());const images=$('images').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);return {id,title:$('title').value.trim(),date:$('date').value||today,kind:$('kind').value.trim(),note:$('note').value,content:$('body').value,images,status:$('state').value,price:current?.price||''}}
async function writeRecord(forceStatus){const v=readForm();if(forceStatus)v.status=forceStatus;const targetFile='data/content/'+v.section;let targetData=await getFile(targetFile);let arr=Array.isArray(targetData.json)?targetData.json:(Array.isArray(targetData.json.items)?targetData.json.items:[]);const old=current;const sameFile=old&&old.path===targetFile;let oldArr=null,oldData=null;if(old){oldData=await getFile(old.path);oldArr=Array.isArray(oldData.json)?oldData.json:(Array.isArray(oldData.json.items)?oldData.json.items:[])}if(old&&sameFile){const idx=oldArr.findIndex(x=>x.id===old.id);if(idx<0)throw Error('原内容未找到，可能已被别人修改。');oldArr[idx]=v;await saveFile(old.path,JSON.stringify(oldArr,null,2),oldData.sha,'修改已发布内容：'+v.title)}else{if(old){const idx=oldArr.findIndex(x=>x.id===old.id);if(idx<0)throw Error('原内容未找到。');oldArr.splice(idx,1);await saveFile(old.path,JSON.stringify(oldArr,null,2),oldData.sha,'更换内容板块：'+v.title)}const idx=arr.findIndex(x=>x.id===v.id);if(idx>=0)arr[idx]=v;else arr.unshift(v);await saveFile(targetFile,JSON.stringify(arr,null,2),targetData.sha,'发布内容：'+v.title)}setStatus($('editStatus'),'保存成功，网站数据已更新。',true);await loadAll();const n=records.findIndex(x=>x.id===v.id&&x.path===targetFile);if(n>=0)loadRecord(n)}
async function removeRecord(){if(!current)throw Error('请先选择一篇已发布内容');if(!confirm('确定删除“'+(current.title||'无标题')+'”？删除后网站前台也会同步移除。'))return;const d=await getFile(current.path);const arr=Array.isArray(d.json)?d.json:(Array.isArray(d.json.items)?d.json.items:[]);const idx=arr.findIndex(x=>x.id===current.id);if(idx<0)throw Error('原内容未找到。');arr.splice(idx,1);await saveFile(current.path,JSON.stringify(arr,null,2),d.sha,'删除已发布内容：'+current.title);clearForm();setStatus($('editStatus'),'删除成功。',true);await loadAll()}
function insertAtCursor(text){const ta=$('body');const a=ta.selectionStart??ta.value.length,b=ta.selectionEnd??a;ta.value=ta.value.slice(0,a)+text+ta.value.slice(b);ta.focus();ta.selectionStart=ta.selectionEnd=a+text.length}
async function uploadImage(file){if(!file) return;owner=$('owner').value.trim();repo=$('repo').value.trim();branch=$('branch').value.trim();token=$('token').value.trim();if(!token)throw Error('请先输入 GitHub Token');const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const dir=($('date').value||today);const path='assets/content/'+dir+'/'+Date.now()+'_'+safe;const b=await file.arrayBuffer();const bytes=new Uint8Array(b);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));const body={message:'上传内容图片：'+file.name,content:btoa(bin),branch};const r=await fetch(api(path),{method:'PUT',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());const url='/'+path;const old=$('images').value.trim();$('images').value=old?(old+'\n'+url):url;insertAtCursor(`\n\n![${file.name}](${url})\n\n`);renderPreview();setStatus($('editStatus'),'图片上传成功，并已插入正文当前光标位置。',true)}
function renderPreview(){const imgs=$('images').value.split(/\n+/).map(x=>x.trim()).filter(x=>x.startsWith('/'));$('preview').innerHTML=imgs.map(x=>`<img src="${esc(x)}" alt="图片预览">`).join('')||'暂无图片。'}
$('connect').onclick=async()=>{try{await loadAll()}catch(e){setStatus($('status'),e.message||String(e));}};$('refreshBtn').onclick=async()=>{try{await loadAll()}catch(e){setStatus($('status'),e.message||String(e));}};$('search').oninput=renderList;$('newBtn').onclick=clearForm;$('clear').onclick=clearForm;$('delete').onclick=async()=>{try{await removeRecord()}catch(e){setStatus($('editStatus'),e.message||String(e))}};$('save').onclick=async()=>{try{await writeRecord('published')}catch(e){setStatus($('editStatus'),e.message||String(e))}};$('saveDraft').onclick=async()=>{try{await writeRecord('draft')}catch(e){setStatus($('editStatus'),e.message||String(e))}};$('images').oninput=renderPreview;$('uploadBtn').onclick=()=>$('imageFile').click();$('imageFile').onchange=async e=>{try{await uploadImage(e.target.files[0])}catch(err){setStatus($('editStatus'),err.message||String(err))}e.target.value=''};$('insertBtn').onclick=()=>{const u=prompt('请输入图片地址：');if(u){const n=prompt('图片说明（可留空）：')||'图片';insertAtCursor(`\n\n![${n}](${u})\n\n`);const old=$('images').value.trim();$('images').value=old?(old+'\n'+u):u;renderPreview()}};clearForm();
</script>
</body></html>
