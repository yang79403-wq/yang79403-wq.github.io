<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏｜全站板块后台编辑</title><style>body{margin:0;background:#f7f2e7;color:#3a2f22;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{background:linear-gradient(135deg,#5a0f0f,#861b12);color:#f5d887;padding:20px 4vw}.top h1{margin:0}.wrap{width:min(1450px,96vw);margin:16px auto}.card{background:#fffdf8;border:1px solid #e5d8bf;border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-weight:700;margin:5px 0}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8c8b5;border-radius:8px;background:white;font:inherit}textarea{min-height:150px}.btn{border:0;border-radius:8px;padding:10px 14px;margin:4px;background:#6b1414;color:white;font-weight:700;cursor:pointer}.gold{background:#c9a35a;color:#35160e}.light{background:#eee7dc;color:#4a4038}.danger{background:#a62a20}.ok{background:#2f6b3b}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid #e5d8bf;border-radius:999px;background:white;padding:10px 15px;color:#6b1414;font-weight:700}.tab.on{background:#6b1414;color:white}.pane{display:none}.pane.on{display:block}.two{display:grid;grid-template-columns:360px 1fr;gap:14px}.list{display:grid;gap:8px;max-height:680px;overflow:auto}.item{padding:12px;border:1px solid #e5d8bf;border-radius:8px;background:#fffaf3;cursor:pointer}.item:hover{border-color:#c9a35a;background:#fff8e8}.item b{color:#6b1414}.status{padding:10px;background:#fff5dd;border:1px solid #dfc18a;border-radius:8px;margin-top:10px}.okmsg{background:#e9f5eb;color:#276035}@media(max-width:850px){.grid,.two{grid-template-columns:1fr}}</style></head><body><header class="top"><h1>🏮 洪盛集藏｜全站板块后台编辑中心</h1><div>自动读取 GitHub 实际存在的全部数据板块，不再限制少数固定选项。</div></header><main class="wrap"><section class="card"><div class="grid"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token（保存/删除才需要）</label><input id="token" type="password" placeholder="Contents 读写权限"></div></div><p>✅ 读取公开仓库不需要 Token。页面打开后自动读取全部板块。只有保存、发布、删除时才检查 Token。</p><button class="btn" id="reload">🔄 重新读取全部板块</button><a class="btn gold" href="../../" target="_blank">🌐 查看网站</a><a class="btn light" href="./management-center.html">⚙️ 管理中心</a><div id="status" class="status">正在读取板块……</div></section><div class="tabs"><button class="tab on" data-p="content">📚 所有内容板块</button><button class="tab" data-p="market">📈 所有行情板块</button></div><section id="content" class="pane on"><div class="two"><aside class="card"><h2>📚 内容板块</h2><div id="contentList" class="list"></div></aside><section class="card"><h2 id="ct">📝 新增内容</h2><div id="cp" class="status">请选择左侧板块</div><div class="grid"><div class="wide"><label>发布到板块</label><select id="cs"></select></div><div><label>ID</label><input id="id"></div><div><label>日期</label><input id="date" type="date"></div><div class="wide"><label>标题</label><input id="title"></div><div><label>类型</label><input id="kind"></div><div><label>状态</label><select id="state"><option value="published">已发布</option><option value="draft">草稿</option><option value="hidden">隐藏</option></select></div><div class="wide"><label>摘要</label><textarea id="note" style="min-height:90px"></textarea></div><div class="wide"><label>正文</label><textarea id="body" style="min-height:330px"></textarea></div><div class="wide"><label>图片路径（一行一个）</label><textarea id="images" style="min-height:90px"></textarea></div></div><button class="btn ok" id="saveC">💾 保存 / 发布</button><button class="btn" id="newC">➕ 新增一篇</button><button class="btn danger" id="delC">🗑 删除</button></section></section></div></section><section id="market" class="pane"><div class="two"><aside class="card"><h2>📈 行情板块</h2><div id="marketList" class="list"></div></aside><section class="card"><h2 id="mt">📝 新增行情</h2><div id="mp" class="status">请选择左侧板块</div><div class="grid"><div class="wide"><label>发布到行情板块</label><select id="ms"></select></div><div><label>ID</label><input id="mid"></div><div><label>日期</label><input id="mdate" type="date"></div><div class="wide"><label>品种 / 标题</label><input id="mname"></div><div><label>价格 / 报价</label><input id="price"></div><div><label>类型</label><input id="mkind"></div><div><label>状态</label><select id="mstate"><option value="published">已发布</option><option value="draft">草稿</option><option value="hidden">隐藏</option></select></div><div class="wide"><label>摘要</label><textarea id="mnote" style="min-height:90px"></textarea></div><div class="wide"><label>行情正文</label><textarea id="mbody" style="min-height:280px"></textarea></div><div class="wide"><label>图片路径（一行一个）</label><textarea id="mimages" style="min-height:90px"></textarea></div></div><button class="btn ok" id="saveM">💾 保存 / 发布</button><button class="btn" id="newM">➕ 新增行情</button><button class="btn danger" id="delM">🗑 删除</button></section></section></div></section></main><script>const $=x=>document.getElementById(x),today=new Date().toISOString().slice(0,10);let owner='yang79403-wq',repo='yang79403-wq.github.io',branch='main',token='',cf=[],mf=[],selC=null,selM=null;const api=p=>`https://api.github.com/repos/${owner}/${repo}/contents/${p}?ref=${encodeURIComponent(branch)}`;const friendly={appreciation:'收藏学院',fujian:'福建钱币',history:'钱币历史',knowledge:'评级知识',tongqian:'古钱币',tongyuan:'铜元',yinyuan:'银元',yinyuan_jizhibi:'银元 / 机制币',zhibi:'纸币',fujian_yinyuan:'福建银元行情',fujian_tongqian:'福建铜钱行情',fujian_tongyuan:'福建铜元行情'};const name=f=>friendly[f.replace('.json','')]||f.replace('.json','').replace(/_/g,' / ');function hdr(){let h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(token)h.Authorization='Bearer '+token;return h}async function dir(p){let r=await fetch(api(p),{headers:hdr()});if(!r.ok)throw Error(`${p} HTTP ${r.status}`);return(await r.json()).filter(x=>x.type==='file'&&x.name.endsWith('.json'))}async function json(p){let r=await fetch(api(p),{headers:hdr()});if(!r.ok)throw Error(`${p} HTTP ${r.status}`);let j=await r.json(),b=Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0));return{sha:j.sha,data:JSON.parse(new TextDecoder().decode(b))}}async function write(p,data,sha,msg){if(!token)throw Error('保存前请填写 GitHub Token');let b=new TextEncoder().encode(JSON.stringify(data,null,2)),s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode(...b.subarray(i,i+32768));let r=await fetch(api(p),{method:'PUT',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify({message:msg,content:btoa(s),branch,sha})});if(!r.ok)throw Error(await r.text())}async function remove(p,sha){if(!token)throw Error('删除前请填写 GitHub Token');let r=await fetch(api(p),{method:'DELETE',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify({message:'后台删除内容',sha,branch})});if(!r.ok)throw Error(await r.text())}function msg(t,ok=true){$('status').textContent=t;$('status').className='status '+(ok?'okmsg':'')}function tabs(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===b.dataset.p));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b))})}function clearC(){selC=null;$('ct').textContent='📝 新增内容';$('cp').textContent='请选择左侧板块';$('cs').value='';['id','title','kind','note','body','images'].forEach(x=>$(x).value='');$('date').value=today;$('state').value='published'}function clearM(){selM=null;$('mt').textContent='📝 新增行情';$('mp').textContent='请选择左侧板块';$('ms').value='';['mid','mname','price','mkind','mnote','mbody','mimages'].forEach(x=>$(x).value='');$('mdate').value=today;$('mstate').value='published'}async function load(){try{owner=$('owner').value.trim()||owner;repo=$('repo').value.trim()||repo;branch=$('branch').value.trim()||branch;token=$('token').value.trim();cf=await dir('data/content');mf=await dir('data/market');$('cs').innerHTML='<option value="">请选择板块</option>'+cf.map(x=>`<option value="${x.name}">${name(x.name)}</option>`).join('');$('ms').innerHTML='<option value="">请选择行情板块</option>'+mf.map(x=>`<option value="${x.name}">${name(x.name)}</option>`).join('');$('contentList').innerHTML=cf.map(x=>`<div class=item data-f="${x.name}" data-t=c><b>${name(x.name)}</b><div>${x.name}</div></div>`).join('')||'暂无内容板块';$('marketList').innerHTML=mf.map(x=>`<div class=item data-f="${x.name}" data-t=m><b>${name(x.name)}</b><div>${x.name}</div></div>`).join('')||'暂无行情板块';document.querySelectorAll('.item').forEach(e=>e.onclick=()=>select(e.dataset.t,e.dataset.f));msg(`连接成功：内容板块 ${cf.length} 个，行情板块 ${mf.length} 个。读取无需 Token。`)}catch(e){msg('连接失败：'+e.message,false)}}async function select(t,f){if(t==='c'){document.querySelector('[data-p="content"]').click();$('cs').value=f;let d=await json('data/content/'+f),a=Array.isArray(d.data)?d.data:[];if(a[0]){selC={f,i:0,sha:d.sha};let x=a[0];$('id').value=x.id||'';$('date').value=x.date||today;$('title').value=x.title||x.name||'';$('kind').value=x.kind||'';$('note').value=x.note||'';$('body').value=x.content||x.body||'';$('images').value=(x.images||[]).join('\n');$('state').value=x.status||'published';$('ct').textContent='✏️ 编辑内容';$('cp').textContent='data/content/'+f}}else{document.querySelector('[data-p="market"]').click();$('ms').value=f;let d=await json('data/market/'+f),a=Array.isArray(d.data)?d.data:[];if(a[0]){selM={f,i:0,sha:d.sha};let x=a[0];$('mid').value=x.id||'';$('mdate').value=x.date||today;$('mname').value=x.title||x.name||'';$('price').value=x.price||'';$('mkind').value=x.kind||'';$('mnote').value=x.note||'';$('mbody').value=x.content||x.body||'';$('mimages').value=(x.images||[]).join('\n');$('mstate').value=x.status||'published';$('mt').textContent='✏️ 编辑行情';$('mp').textContent='data/market/'+f}}}async function saveC(){try{let f=$('cs').value;if(!f)throw Error('请选择板块');let d=await json('data/content/'+f),a=Array.isArray(d.data)?d.data:[],x={id:$('id').value.trim()||'article_'+Date.now(),title:$('title').value.trim(),date:$('date').value||today,kind:$('kind').value,note:$('note').value,content:$('body').value,images:$('images').value.split(/\n+/).map(x=>x.trim()).filter(Boolean),status:$('state').value};if(selC&&selC.f===f)a[selC.i]=x;else a.push(x);await write('data/content/'+f,a,d.sha,selC?'后台修改内容':'后台发布内容');msg('保存成功：'+name(f));await load()}catch(e){$('cp').textContent=e.message}}async function saveM(){try{let f=$('ms').value;if(!f)throw Error('请选择行情板块');let d=await json('data/market/'+f),a=Array.isArray(d.data)?d.data:[],x={id:$('mid').value.trim()||'market_'+Date.now(),title:$('mname').value.trim(),date:$('mdate').value||today,price:$('price').value,kind:$('mkind').value,note:$('mnote').value,content:$('mbody').value,images:$('mimages').value.split(/\n+/).map(x=>x.trim()).filter(Boolean),status:$('mstate').value};if(selM&&selM.f===f)a[selM.i]=x;else a.push(x);await write('data/market/'+f,a,d.sha,selM?'后台修改行情':'后台发布行情');msg('保存成功：'+name(f));await load()}catch(e){$('mp').textContent=e.message}}async function delC(){try{if(!selC)throw Error('请先选择内容');let d=await json('data/content/'+selC.f),a=d.data;a.splice(selC.i,1);await write('data/content/'+selC.f,a,d.sha,'后台删除内容');clearC();await load();msg('删除成功')}catch(e){$('cp').textContent=e.message}}async function delM(){try{if(!selM)throw Error('请先选择行情');let d=await json('data/market/'+selM.f),a=d.data;a.splice(selM.i,1);await write('data/market/'+selM.f,a,d.sha,'后台删除行情');clearM();await load();msg('删除成功')}catch(e){$('mp').textContent=e.message}}$('reload').onclick=load;$('saveC').onclick=saveC;$('saveM').onclick=saveM;$('delC').onclick=delC;$('delM').onclick=delM;$('newC').onclick=clearC;$('newM').onclick=clearM;$('token').oninput=()=>token=$('token').value.trim();tabs();clearC();clearM();load();</script></body></html>
