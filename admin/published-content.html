<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏｜已发布内容整理</title>
<style>:root{--r:#6b1414;--g:#c9a35a;--bg:#f7f2e7;--card:#fffdf8;--ink:#3a2f22;--line:#e5d8bf;--ok:#2f6b3b;--danger:#a62a20;--blue:#2a5f9e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{background:linear-gradient(135deg,#5a0f0f,#861b12);color:#f5d887;padding:18px 4vw}.top h1{margin:0}.top p{margin:6px 0;color:#f1dcc0}.wrap{width:min(1500px,96vw);margin:16px auto}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:14px}.grid{display:grid;grid-template-columns:360px 1fr;gap:14px}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--r);color:#fff}.gold{background:var(--g);color:#35160e}.danger{background:var(--danger);color:#fff}.ok{background:var(--ok);color:#fff}.blue{background:var(--blue);color:#fff}.light{background:#eee7dc;color:#4a4038}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #d8c8b5;border-radius:8px;background:#fff;font:inherit}textarea{min-height:130px;line-height:1.6}.list{max-height:650px;overflow:auto;display:grid;gap:7px}.item{padding:10px;border:1px solid var(--line);border-radius:8px;background:#fffaf3;cursor:pointer}.item:hover,.item.on{border-color:var(--g);background:#fff5dc}.item b{color:var(--r)}.muted{font-size:12px;color:#8a7a5f}.status{padding:10px;border-radius:8px;background:#fff5dd;border:1px solid #dfc18a;white-space:pre-wrap}.success{background:#e9f5eb;color:#276035}.error{background:#fff0ed;color:#9b231a}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tab{padding:10px 15px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--r);font-weight:700;cursor:pointer}.tab.on{background:var(--r);color:#fff}.moveBox{margin-top:14px;padding:12px;border:1px dashed #d5b977;background:#fff8e8;border-radius:10px}.moveGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}@media(max-width:900px){.grid,.moveGrid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}}</style></head>
<body><header class="top"><h1>🏮 洪盛集藏｜已发布内容整理</h1><p>读取正式网站正在使用的数据文件。可修改、删除，也可把已发布内容整理移动到任意内容板块或行情板块。</p></header>
<main class="wrap"><section class="card"><div class="fields"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="Contents 读写权限"></div></div><div class="toolbar" style="margin-top:10px"><button class="btn primary" id="connect">🔄 读取全部已发布内容</button><a class="btn gold" href="management-center.html">↩️ 返回管理中心</a><a class="btn light" href="../" target="_blank">🌐 查看网站</a></div><div id="status" class="status" style="margin-top:10px">请连接 GitHub。</div></section>
<div class="tabs"><button class="tab on" data-mode="content">📚 已发布内容</button><button class="tab" data-mode="market">📈 已发布行情</button></div>
<section class="grid"><aside class="card"><div class="fields"><div class="wide"><label>当前板块</label><select id="section"><option value="">全部板块</option></select></div><div class="wide"><label>搜索标题</label><input id="search" placeholder="输入关键词"></div></div><div class="toolbar" style="margin:10px 0"><button class="btn light" id="reload">🔄 刷新</button></div><div id="list" class="list"></div></aside>
<section class="card"><h2 id="editorTitle">📝 请选择已发布内容</h2><div class="muted" id="path"></div><div class="fields" style="margin-top:12px"><div><label>标题</label><input id="title"></div><div><label>日期</label><input id="date" type="date"></div><div><label>类型</label><input id="kind"></div><div><label>价格 / 报价</label><input id="price"></div><div class="wide"><label>摘要</label><textarea id="note" style="min-height:90px"></textarea></div><div class="wide"><label>正文</label><textarea id="body" style="min-height:280px"></textarea></div><div class="wide"><label>图片路径（一行一个）</label><textarea id="images" style="min-height:90px"></textarea></div><div><label>状态</label><select id="itemStatus"><option value="published">已发布</option><option value="draft">草稿</option><option value="hidden">隐藏</option></select></div><div class="wide"><label>高级：完整 JSON（保留未展示字段）</label><textarea id="raw" style="min-height:220px"></textarea></div></div>
<div class="moveBox"><h3 style="margin:0 0 8px">🔄 整理到其他板块</h3><div class="muted" style="margin-bottom:8px">可把当前内容从原板块移动到任意网站内容板块；从内容模式可移动到行情板块，从行情模式也可移动到内容板块。</div><div class="moveGrid"><div><label>目标类型</label><select id="moveMode"><option value="content">📚 内容板块</option><option value="market">📈 行情板块</option></select></div><div><label>目标板块</label><select id="moveSection"><option value="">请选择目标板块</option></select></div></div></div>
<div class="toolbar" style="margin-top:10px"><button class="btn ok" id="save">💾 保存修改并发布</button><button class="btn blue" id="move">🔄 移动到目标板块</button><button class="btn danger" id="delete">🗑 删除已发布内容</button><button class="btn light" id="clear">↩️ 清空</button></div><div id="editorStatus" class="status" style="margin-top:10px">未选择内容。</div></section></section></main>
<script>
'use strict';const $=id=>document.getElementById(id);let token='',owner='yang79403-wq',repo='yang79403-wq.github.io',branch='main',mode='content',files=[],items=[],selected=null;const names={content:{appreciation:'收藏学院',fujian:'福建钱币',history:'钱币历史',knowledge:'评级知识',tongqian:'古钱币',tongyuan:'铜元',yinyuan_jizhibi:'银元 / 机制币',zhibi:'纸币'},market:{fujian_tongqian:'福建铜钱行情',fujian_tongyuan:'福建铜元行情',fujian_yinyuan:'福建银元行情',tongqian:'古钱币行情',tongyuan:'铜元行情',yinyuan:'银元行情',yinyuan_jizhibi:'银元 / 机制币行情',zhibi:'纸币行情'}};function api(p){return `https://api.github.com/repos/${owner}/${repo}/contents/${p}?ref=${encodeURIComponent(branch)}`}function hdr(){return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'}}function setMsg(el,t,ok=false){el.textContent=t;el.className='status '+(ok?'success':'error')}async function get(p){const r=await fetch(api(p),{headers:hdr()});if(!r.ok)throw Error(p+' '+r.status);const j=await r.json();const b=Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0));return {path:p,sha:j.sha,json:JSON.parse(new TextDecoder().decode(b))}}async function put(p,obj,sha,message){const text=JSON.stringify(obj,null,2);const b=new TextEncoder().encode(text);let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode(...b.subarray(i,i+32768));const r=await fetch(api(p),{method:'PUT',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify({message,content:btoa(s),branch,sha})});if(!r.ok)throw Error(await r.text());return r.json()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function listFiles(targetMode){const dir=targetMode==='content'?'data/content':'data/market';const r=await fetch(api(dir),{headers:hdr()});if(!r.ok)throw Error(dir+' '+r.status);return (await r.json()).filter(x=>x.type==='file'&&x.name.endsWith('.json'))}
async function load(){token=$('token').value.trim();owner=$('owner').value.trim();repo=$('repo').value.trim();branch=$('branch').value.trim();if(!token)throw Error('请填写 GitHub Token');files=await listFiles(mode);items=[];for(const f of files){const d=await get(f.path);const arr=Array.isArray(d.json)?d.json:[];arr.forEach((item,index)=>items.push({file:f,index,item,sha:d.sha,path:f.path}))}buildSections();renderList();buildMoveTargets();setMsg($('status'),`读取完成：${items.length} 条，${files.length} 个板块文件。`,true)}function buildSections(){const s=$('section'),old=s.value;s.innerHTML='<option value="">全部板块</option>'+files.map(f=>{const k=f.name.replace('.json','');return `<option value="${f.name}">${names[mode][k]||k}</option>`}).join('');if([...s.options].some(o=>o.value===old))s.value=old}
function buildMoveTargets(){const m=$('moveMode');const current=$('moveSection');const old=current.value;const target= m.value;const source= target==='content'? 'content':'market';listFiles(source).then(fs=>{current.innerHTML='<option value="">请选择目标板块</option>'+fs.map(f=>{const k=f.name.replace('.json','');return `<option value="${f.name}">${names[source][k]||k}</option>`}).join('');if([...current.options].some(o=>o.value===old))current.value=old}).catch(e=>setMsg($('editorStatus'),e.message))}
function renderList(){const sec=$('section').value,q=$('search').value.trim().toLowerCase();const arr=items.filter(x=>(!sec||x.file.name===sec)&&(!q||String(x.item.title||x.item.name||'').toLowerCase().includes(q)));$('list').innerHTML=arr.map(x=>{const key=items.indexOf(x);return `<div class="item ${selected===key?'on':''}" data-i="${key}"><b>${escapeHtml(x.item.title||x.item.name||'无标题')}</b><div class="muted">${names[mode][x.file.name.replace('.json','')]||x.file.name}｜${x.item.date||''}｜${x.item.status||''}</div></div>`}).join('')||'<div class="muted">没有找到内容。</div>';document.querySelectorAll('.item').forEach(e=>e.onclick=()=>select(+e.dataset.i))}
function select(i){selected=i;const x=items[i];if(!x)return;$('editorTitle').textContent='✏️ 编辑：'+(x.item.title||x.item.name||'无标题');$('path').textContent=x.path+' ｜ 第 '+(x.index+1)+' 条';$('title').value=x.item.title||x.item.name||'';$('date').value=x.item.date||'';$('kind').value=x.item.kind||'';$('price').value=x.item.price||'';$('note').value=x.item.note||'';$('body').value=x.item.content||x.item.body||'';$('images').value=Array.isArray(x.item.images)?x.item.images.join('\n'):'';$('itemStatus').value=x.item.status||'published';$('raw').value=JSON.stringify(x.item,null,2);$('moveMode').value=mode;buildMoveTargets();setMsg($('editorStatus'),'已载入，可修改、删除或移动到其他板块。',true);renderList()}
function clearEditor(){selected=null;$('editorTitle').textContent='📝 请选择已发布内容';$('path').textContent='';['title','date','kind','price','note','body','images','raw'].forEach(id=>$(id).value='');$('itemStatus').value='published';$('moveSection').value='';setMsg($('editorStatus'),'未选择内容。',true);renderList()}
function merged(){if(selected===null)throw Error('请先选择一条已发布内容');let obj;try{obj=JSON.parse($('raw').value||'{}')}catch(e){throw Error('完整 JSON 格式错误，请修正后再保存')}obj.title=$('title').value.trim();obj.date=$('date').value;obj.kind=$('kind').value.trim();obj.price=$('price').value;obj.note=$('note').value;obj.content=$('body').value;obj.images=$('images').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);obj.status=$('itemStatus').value;return obj}
async function save(){try{const x=items[selected];const obj=merged();const d=await get(x.path);const arr=Array.isArray(d.json)?d.json:[];arr[x.index]=obj;await put(x.path,arr,d.sha,'后台修改已发布内容');setMsg($('editorStatus'),'保存成功，已同步网站数据源。等待 Pages 发布。',true);await load()}catch(e){setMsg($('editorStatus'),e.message)}}
async function moveItem(){try{if(selected===null)throw Error('请先选择一条已发布内容');const x=items[selected];const targetMode=$('moveMode').value;const targetFile=$('moveSection').value;if(!targetFile)throw Error('请选择目标板块');if(targetMode===mode&&targetFile===x.file.name)throw Error('目标板块与当前板块相同，无需移动');const obj=merged();const source=await get(x.path);const sourceArr=Array.isArray(source.json)?source.json:[];const idx=sourceArr.findIndex(v=>v===x.item || String(v.id||'')===String(x.item.id||''));if(idx<0)throw Error('原内容已发生变化，请重新加载后再试');sourceArr.splice(idx,1);const targetPath=`data/${targetMode==='content'?'content':'market'}/${targetFile}`;const target=await get(targetPath);const targetArr=Array.isArray(target.json)?target.json:[];if(targetMode==='market' && !obj.price) obj.price='';targetArr.unshift(obj);await put(targetPath,targetArr,target.sha,`后台整理内容到${names[targetMode][targetFile.replace('.json','')]||targetFile}`);await put(x.path,sourceArr,source.sha,`后台整理移出内容${x.item.title||x.item.name||x.item.id||''}`);clearEditor();setMsg($('editorStatus'),`整理成功：已从「${names[mode][x.file.name.replace('.json','')]||x.file.name}」移动到「${names[targetMode][targetFile.replace('.json','')]||targetFile}」。网站将自动同步。`,true);await load()}catch(e){setMsg($('editorStatus'),e.message)}}
async function remove(){try{if(selected===null)throw Error('请先选择要删除的内容');const x=items[selected];const title=x.item.title||x.item.name||'这条内容';if(!confirm('确定删除：'+title+'？\n删除后将从网站对应板块移除。'))return;const d=await get(x.path);const arr=Array.isArray(d.json)?d.json:[];arr.splice(x.index,1);await put(x.path,arr,d.sha,'后台删除已发布内容');clearEditor();setMsg($('editorStatus'),'删除成功，已从对应板块数据中移除。',true);await load()}catch(e){setMsg($('editorStatus'),e.message)}}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{mode=t.dataset.mode;selected=null;clearEditor();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));load().catch(e=>setMsg($('status'),e.message))});$('connect').onclick=()=>load().catch(e=>setMsg($('status'),e.message));$('reload').onclick=()=>load().catch(e=>setMsg($('status'),e.message));$('section').onchange=renderList;$('search').oninput=renderList;$('moveMode').onchange=buildMoveTargets;$('save').onclick=save;$('move').onclick=moveItem;$('delete').onclick=remove;$('clear').onclick=clearEditor;
</script></body></html>
