<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏｜全站内容管理</title><style>:root{--r:#6b1414;--g:#c9a35a;--bg:#f7f2e7;--ink:#3a2f22;--card:#fffdf8;--line:#e5d8bf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{background:linear-gradient(135deg,#5a0f0f,#861b12);color:#f5d887;padding:18px 4vw}.top h1{margin:0;font-size:24px}.top p{margin:6px 0;color:#f1dcc0}.menu{display:flex;gap:8px;flex-wrap:wrap;padding:12px 4vw;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.menu button,.menu a{border:1px solid var(--line);background:#fffaf3;color:var(--r);border-radius:999px;padding:9px 14px;font-weight:700;text-decoration:none;cursor:pointer}.menu button:hover,.menu a:hover{background:#f5ead5}.wrap{width:min(1400px,94vw);margin:16px auto}.notice{background:#fff8e8;border:1px solid #dfc18a;border-radius:10px;padding:12px;line-height:1.7}.frame{width:100%;height:calc(100vh - 190px);min-height:720px;border:1px solid var(--line);border-radius:12px;background:#fff}</style></head><body><header class="top"><h1>🏮 洪盛集藏｜全站内容管理中心</h1><p>全中文菜单｜所有网站板块均可发布内容｜与正式网站使用同一数据源｜不修改首页稳定版布局</p></header><nav class="menu"><button onclick="openPanel('articles')">📚 收藏内容</button><button onclick="openPanel('markets')">📈 每日行情</button><button onclick="openPanel('home')">🏠 首页内容</button><button onclick="openPanel('raw')">🗂️ 数据文件</button><button onclick="openPanel('images')">🖼️ 图片管理</button><a href="site-wide-publisher.html">📝 全站发布</a><a href="title-manager.html">📝 板块标题</a><a href="../" target="_blank">🌐 查看网站</a></nav><main class="wrap"><div class="notice">🔒 <b>正式稳定版保护：</b>后台只修改网站数据，不修改首页版面、导航布局和二维码位置。<br>📌 <b>全站发布：</b>读取 <code>data/content/</code>、<code>data/market/</code> 以及最新收藏内容数据，选择任意具体板块后直接发布。发布内容写入该板块原数据文件，前台读取同一数据源。</div><iframe id="panel" class="frame" src="all-sections-editor.html" title="全站内容管理"></iframe></main><script>function openPanel(section){const frame=document.getElementById('panel');frame.onload=function(){try{frame.contentWindow.switchPane(section)}catch(e){}};frame.src='all-sections-editor.html#'+section}</script></body></html>
