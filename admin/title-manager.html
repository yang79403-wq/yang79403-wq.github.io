<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>洪盛集藏｜网站板块标题管理</title>
<style>
:root{--r:#6b1414;--g:#c9a35a;--bg:#f7f2e7;--card:#fffdf8;--ink:#3a2f22;--line:#e5d8bf;--muted:#8a7a5f;--danger:#a62a20;--ok:#2f6b3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{background:linear-gradient(135deg,#5a0f0f,#861b12);color:#f5d887;padding:18px 4vw}.top h1{margin:0}.top p{margin:6px 0;color:#f1dcc0}.wrap{width:min(1250px,94vw);margin:18px auto}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin:8px 0}.item.selected{border-color:var(--g);box-shadow:0 0 0 2px #f2dfb0}.item-title{font-size:17px;font-weight:700;color:var(--r);margin-bottom:7px;word-break:break-all}.meta{font-size:12px;color:var(--muted);line-height:1.7}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}.primary{background:var(--r);color:#fff}.gold{background:var(--g);color:#35160e}.danger{background:var(--danger);color:#fff}.light{background:#eee7dc;color:#4a4038}.ok{background:var(--ok);color:#fff}input,select{width:100%;padding:10px;border:1px solid #d8c8b5;border-radius:8px;font:inherit;background:#fff}.status{padding:10px;border-radius:8px;background:#fff5dd;border:1px solid #dfc18a;white-space:pre-wrap}.success{background:#e9f5eb;color:#276035}.error{background:#fff0ed;color:#9b231a}.hint{font-size:12px;color:var(--muted);line-height:1.7}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.search{margin-bottom:12px}@media(max-width:800px){.list,.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><h1>🏮 洪盛集藏｜网站板块标题管理</h1><p>读取正式网站首页真实标题；可逐项修改或删除标题。不会自动修改页面布局。</p></header>
<main class="wrap">
<section class="card"><div class="grid"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div style="grid-column:1/-1"><label>GitHub Token</label><input id="token" type="password" placeholder="Contents 读写权限"></div></div><div class="row" style="margin-top:10px"><button class="btn primary" id="load">🔄 读取网站全部标题</button><a class="btn gold" href="../" target="_blank">🌐 查看网站</a><a class="btn light" href="./">↩️ 返回全站管理</a></div><div id="status" class="status" style="margin-top:10px">请连接 GitHub 后读取。</div></section>
<section class="card"><div class="row"><div style="flex:1"><input class="search" id="filter" placeholder="搜索标题、区域或元素类型"></div><span class="hint" id="count"></span></div><div id="list" class="list"></div></section>
<section class="card" id="editor" hidden><h2>编辑标题</h2><p class="hint" id="info"></p><label>新标题</label><input id="newTitle"><div class="row" style="margin-top:10px"><button class="btn ok" id="save">💾 保存修改</button><button class="btn danger" id="remove">🗑 删除这个标题</button><button class="btn light" id="cancel">取消</button></div><div id="editStatus" class="status" style="margin-top:10px">等待操作</div></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);let token='',owner='yang79403-wq',repo='yang79403-wq.github.io',branch='main',source='',sha='',items=[],selected=null;
const api=p=>`https://api.github.com/repos/${owner}/${repo}/contents/${p}?ref=${encodeURIComponent(branch)}`;
const headers=()=>({'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'});
function msg(el,t,ok=false){el.textContent=t;el.className='status '+(ok?'success':'error')}
function decode(b){const bytes=Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function encode(t){const bytes=new TextEncoder().encode(t);let b='';for(let i=0;i<bytes.length;i+=0x8000)b+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(b)}
function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
async function load(){token=$('token').value.trim();owner=$('owner').value.trim();repo=$('repo').value.trim();branch=$('branch').value.trim()||'main';if(!token)return msg($('status'),'请填写 GitHub Token');try{const r=await fetch(api('index.html'),{headers:headers()});if(!r.ok)throw Error('读取 index.html 失败：'+r.status);const j=await r.json();sha=j.sha;source=decode(j.content);extract();render();msg($('status'),`已读取正式网站首页，共发现 ${items.length} 个可管理标题。`,true)}catch(e){msg($('status'),e.message)}}
function extract(){items=[];const re=/<(h[1-6]|a|button|li)\b([^>]*)>([\s\S]*?)<\/\1>/gi;let m;while((m=re.exec(source))){const tag=m[1].toLowerCase();let raw=m[3].replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();if(!raw||raw.length>120)continue;if(!/[\u4e00-\u9fff]/.test(raw))continue;const start=m.index;const end=re.lastIndex;const context=source.slice(Math.max(0,start-260),Math.min(source.length,end+260));let area='网站首页';if(/nav|mainnav/i.test(context))area='顶部导航';else if(/hero/i.test(context))area='首页主视觉';else if(/panel|section/i.test(context))area='首页内容板块';else if(/footer/i.test(context))area='底部';items.push({id:items.length+1,tag,text:raw,area,start,end,full:m[0]})}}
function render(){const q=$('filter').value.trim().toLowerCase();const arr=items.filter(x=>(x.text+' '+x.area+' '+x.tag).toLowerCase().includes(q));$('count').textContent=`共 ${items.length} 项，当前 ${arr.length} 项`;$('list').innerHTML=arr.map(x=>`<article class="item ${selected&&selected.id===x.id?'selected':''}" data-id="${x.id}"><div class="item-title">${esc(x.text)}</div><div class="meta">位置：${esc(x.area)}　元素：${x.tag.toUpperCase()}</div><div class="row" style="margin-top:8px"><button class="btn gold edit" data-id="${x.id}">✏️ 修改</button><button class="btn danger del" data-id="${x.id}">🗑 删除</button></div></article>`).join('')||'<p class="hint">没有找到标题。</p>';document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openEdit(+b.dataset.id));document.querySelectorAll('.del').forEach(b=>b.onclick=()=>removeTitle(+b.dataset.id))}
function openEdit(id){selected=items.find(x=>x.id===id);if(!selected)return;$('editor').hidden=false;$('newTitle').value=selected.text;$('info').textContent=`位置：${selected.area}｜元素：${selected.tag.toUpperCase()}`;render();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function replaceSelected(newText){const x=selected;if(!x)return source;const old=source.slice(x.start,x.end);let repl=old.replace(x.text,newText);return source.slice(0,x.start)+repl+source.slice(x.end)}
async function write(next,message){const r=await fetch(api('index.html'),{method:'PUT',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({message,content:encode(next),sha,branch})});if(!r.ok)throw Error(await r.text());const j=await r.json();sha=j.content.sha;source=next;extract();render();selected=null;$('editor').hidden=true;msg($('status'),'保存成功，网站标题已更新。请等待 GitHub Pages 发布。',true)}
async function save(){if(!selected)return;const n=$('newTitle').value.trim();if(!n)return msg($('editStatus'),'新标题不能为空');try{const next=replaceSelected(n);await write(next,'后台修改网站板块标题');msg($('editStatus'),'已保存',true)}catch(e){msg($('editStatus'),e.message)}}
async function removeTitle(id){const x=items.find(y=>y.id===id);if(!x)return;if(!confirm(`确定删除标题“${x.text}”吗？\n只删除标题文字/标题元素，不删除该板块内容。`))return;selected=x;try{const old=source.slice(x.start,x.end);const next=source.slice(0,x.start)+''+source.slice(x.end);await write(next,'后台删除网站板块标题');}catch(e){msg($('status'),e.message)}}
$('load').onclick=load;$('filter').oninput=render;$('save').onclick=save;$('cancel').onclick=()=>{$('editor').hidden=true;selected=null;render()};$('remove').onclick=()=>selected&&removeTitle(selected.id);
</script>
</body>
</html>
