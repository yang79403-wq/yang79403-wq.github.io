<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1240, initial-scale=1.0">
<title>洪盛集藏资讯网 - 古钱币、老银元、纸币收藏研究与行情交流平台</title>
<meta name="keywords" content="洪盛集藏,古钱币,古泉,老银元,袁大头,船洋,龙洋,福建龙洋,福建铜元,机制币,纪念币,纸币收藏,钱币研究,钱币版别,钱币行情">
<meta name="description" content="洪盛集藏资讯网专注于古钱币、老银元、纸币、机制币及福建地方钱币研究，提供收藏知识学习、版别探讨、市场行情参考。">
<meta name="robots" content="index,follow">
<meta name="author" content="洪盛集藏资讯网">
<style>
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:#f7f2e7;color:#3a2f22;margin:0;padding:0}
.container{max-width:1240px;margin:0 auto}
.header{background:white;padding:20px;text-align:center;border-bottom:2px solid #e8ddc4}
.header h1{margin:0;font-size:32px;color:#7f1a1a}
.hero{background:linear-gradient(135deg,#6b1414,#7f1a1a);color:white;padding:40px 20px;text-align:center}
.hero h2{font-size:40px;margin:0}
.hero p{font-size:18px;margin:10px 0 0}
.wrap{padding:20px}
.panel{background:white;border:1px solid #e8ddc4;border-radius:8px;padding:20px;margin-bottom:20px}
.panel h3{color:#7f1a1a;margin-top:0}
.news-item{padding:12px;border-bottom:1px solid #e8ddc4}
.news-item:last-child{border-bottom:none}
.news-title{font-weight:600;color:#7f1a1a;margin-bottom:5px}
.news-meta{font-size:11px;color:#8a7a5f}
.news-note{font-size:12px;color:#3a2f22;margin-top:8px;line-height:1.4}
.market-item{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #e8ddc4}
.market-variety{font-weight:500}
.market-price{color:#7f1a1a;font-weight:600;font-size:14px}
.market-trend{font-size:18px;font-weight:bold}
.tabs{display:flex;gap:10px;border-bottom:1px solid #e8ddc4;margin-bottom:15px}
.tab-btn{padding:8px 15px;background:transparent;border:none;cursor:pointer;color:#8a7a5f;border-bottom:2px solid transparent}
.tab-btn.active{color:#7f1a1a;border-bottom-color:#7f1a1a}
.footer{background:#6b1414;color:white;padding:20px;text-align:center;margin-top:40px}
.admin-link{display:inline-block;background:#c9a35a;color:white;padding:8px 15px;border-radius:4px;margin:10px 0;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<div class="header">
  <h1>洪盛集藏资讯网</h1>
  <p>钱币收藏交流服务平台</p>
  <p><a class="admin-link" href="admin/editor.html">📝 管理后台</a></p>
</div>

<div class="hero">
  <h2>洪盛集藏资讯网</h2>
  <p>古钱币 · 银元 · 纸币 · 收藏研究</p>
</div>

<div class="wrap">
  <div class="panel">
    <h3>📰 最新资讯</h3>
    <div id="newsList">
      <div style="text-align:center;color:#999;padding:20px">加载中...</div>
    </div>
  </div>

  <div class="panel">
    <h3>📈 每日行情</h3>
    <div class="tabs">
      <button class="tab-btn active" onclick="showMarketCategory('silver')">银���</button>
      <button class="tab-btn" onclick="showMarketCategory('mechanism_coins')">机制币</button>
      <button class="tab-btn" onclick="showMarketCategory('copper_coins')">铜钱</button>
      <button class="tab-btn" onclick="showMarketCategory('banknotes')">纸币</button>
    </div>
    <div id="marketContent">
      <div style="text-align:center;color:#999;padding:20px">加载中...</div>
    </div>
  </div>
</div>

<div class="footer">
  <p>© 2026 洪盛集藏资讯网 | 公益性收藏交流平台</p>
  <p>本站为钱币收藏爱好者交流学习平台，内容仅供参考</p>
  <p><a href="admin/editor.html" style="color:white">进入管理后台 →</a></p>
</div>
</div>

<script>
let newsData = [];
let marketData = {};
let currentMarketCategory = 'silver';

document.addEventListener('DOMContentLoaded', function() {
  loadNewsData();
  loadMarketData();
  
  // 每30秒刷新一次
  setInterval(function() {
    loadNewsData();
    loadMarketData();
  }, 30000);
});

function loadNewsData() {
  fetch('data/news.json')
    .then(r => r.json())
    .then(data => {
      newsData = data;
      renderNews();
    })
    .catch(err => {
      console.log('加载资讯失败:', err);
      document.getElementById('newsList').innerHTML = '<div style="color:#999;padding:20px">暂无资讯</div>';
    });
}

function loadMarketData() {
  fetch('data/market.json')
    .then(r => r.json())
    .then(data => {
      marketData = data.categories || {};
      renderMarket();
    })
    .catch(err => {
      console.log('加载行情失败:', err);
      document.getElementById('marketContent').innerHTML = '<div style="color:#999;padding:20px">暂无行情</div>';
    });
}

function renderNews() {
  const html = newsData.length ? newsData.map(n => `
    <div class="news-item">
      <div class="news-title">${n.title}</div>
      <div class="news-meta">📅 ${n.date}</div>
      <div class="news-note">${n.note}</div>
    </div>
  `).join('') : '<div style="color:#999;padding:20px">暂无资讯</div>';
  
  document.getElementById('newsList').innerHTML = html;
}

function renderMarket() {
  const cat = marketData[currentMarketCategory];
  if (!cat || !cat.records || cat.records.length === 0) {
    document.getElementById('marketContent').innerHTML = '<div style="color:#999;padding:20px">暂无数据</div>';
    return;
  }
  
  const html = cat.records.map(r => `
    <div class="market-item">
      <div style="flex:1">
        <div class="market-variety">${r.variety}</div>
        <div style="font-size:11px;color:#999">${r.rarity || ''}</div>
      </div>
      <div style="text-align:right">
        <div class="market-price">${r.price}</div>
        <div class="market-trend">${r.trend}</div>
      </div>
    </div>
  `).join('');
  
  document.getElementById('marketContent').innerHTML = html;
}

function showMarketCategory(cat) {
  currentMarketCategory = cat;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderMarket();
}
</script>
</body>
</html>
