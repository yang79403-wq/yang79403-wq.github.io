<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实时收藏资讯AI｜洪盛集藏</title><style>body{margin:0;background:#f6f0e4;color:#342820;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px 18px}.head{background:#5a0b07;color:#fff1cf;padding:30px 18px}.head h1{margin:0;color:#f1d48a}.status{margin-top:8px;color:#e6cfaa}.card{background:#fffdf8;border:1px solid #e1d1b6;border-radius:12px;padding:18px;margin:14px 0}.meta{font-size:12px;color:#8d7868}.title{font-size:20px;font-weight:800;color:#67140e;margin:7px 0}.tag{display:inline-block;background:#f1e3c7;color:#75531f;padding:3px 8px;border-radius:10px;font-size:11px;margin:3px}.ai{line-height:1.8;color:#66564a}.back{color:#f1d48a;text-decoration:none}</style></head><body><header class="head"><div class="wrap"><h1>🤖 实时收藏资讯 AI</h1><div class="status" id="status">正在更新公开收藏资讯并进行智能筛选……</div><p>只展示经过筛选、摘要、分类和编辑后的收藏资料，不提供原文跳转。</p><a class="back" href="/">← 返回洪盛集藏首页</a></div></header><main class="wrap" id="list"><div class="card">正在读取实时资讯……</div></main><script>const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));fetch('/data/realtime_ai.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{status.textContent='AI筛选更新时间：'+(d.updated_at||'');let a=d.items||[];list.innerHTML=a.length?a.map(x=>'<article class="card"><div class="meta">'+E(x.date)+' · '+E(x.category)+' · '+E(x.source)+'</div><div class="title">'+E(x.title)+'</div><div>'+((x.keywords||[]).map(k=>'<span class="tag">'+E(k)+'</span>').join(''))+'</div><div class="ai"><b>AI摘要：</b>'+E(x.summary)+'</div><div class="ai"><b>研究提示：</b>'+E(x.analysis)+'</div></article>').join(''):'<div class="card">当前没有通过筛选的新资料，系统会继续自动更新。</div>'}).catch(()=>list.innerHTML='<div class="card">实时资讯暂时无法读取，请稍后刷新。</div>');</script></body></html>
