<h2>知识分类</h2>
<ul>
<li>银元知识库：袁大头、龙洋、船洋、民国银币</li>
<li>古钱币知识库：秦汉、唐宋、明清钱币</li>
<li>纸币知识库：人民币收藏、老纸币研究</li>
<li>机制币知识库：地方铜元、近代机制币</li>
<li>福建钱币文化：泉州、厦门、福州收藏文化</li>
</ul>
