<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>钱币分类资料｜洪盛集藏</title><meta name="description" content="洪盛集藏严格按钱币品类归档，每个品类只显示本品类相关子板块和资料。"><style>body{margin:0;background:#f7f1e5;color:#30241d;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:25px 20px}.head{background:#24130f;color:#f0ddb5;padding:30px 0}.head h1{margin:0;color:#efd18a}.head p{line-height:1.9}.subnav{background:#fffdf8;border-bottom:1px solid #e4d7bf;position:sticky;top:0;z-index:5}.subnav a{display:inline-block;padding:12px 10px;color:#7b1717;text-decoration:none;font-weight:800}.group{margin:25px 0}.group h2{color:#7b1717;border-bottom:2px solid #e4d7bf;padding-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#fffdf8;border:1px solid #e4d7bf;border-radius:12px;padding:18px}.card h3{margin:0 0 8px;color:#7b1717}.card p{margin:0;color:#766650;line-height:1.75}.item{margin-top:12px;padding:12px;border-left:3px solid #b98932;background:#fff}.meta{font-size:12px;color:#927d6c;margin-bottom:5px}.empty{padding:25px;background:#fffdf8;border:1px dashed #c9b894;border-radius:12px;color:#766650}footer{background:#24130f;color:#c8b99f;padding:25px 0;margin-top:35px;line-height:1.8}</style></head><body><header class="head"><div class="wrap"><h1 id="title">洪盛集藏 · 钱币分类</h1><p id="intro">正在加载严格分类目录……</p></div></header><nav class="subnav"><div class="wrap"><a href="/">首页</a><a href="/knowledge.html">知识库总目录</a><a href="?cat=ancient">古钱币</a><a href="?cat=silver">银元</a><a href="?cat=machine">机制币</a><a href="?cat=banknote">纸币</a><a href="?cat=commemorative">纪念币</a><a href="?cat=gold">金银币</a><a href="?cat=fujian">福建钱币</a></div></nav><main class="wrap"><section class="group"><h2>本品类专属子板块</h2><div id="subs" class="grid"></div></section><section class="group"><h2>本品类最新资料</h2><div id="items"></div></section></main><footer><div class="wrap">洪盛集藏｜钱币收藏综合信息与服务平台<br>内容经过筛选、整理和分类后发布，仅供学习、研究与收藏交流参考。</div></footer><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cat=new URLSearchParams(location.search).get('cat')||'ancient';Promise.all([fetch('/data/category-config.json?t='+Date.now()).then(r=>r.json()),fetch('/data/categories/'+encodeURIComponent(cat)+'.json?t='+Date.now()).then(r=>r.json()).catch(()=>[])]).then(([cfg,items])=>{const x=cfg.taxonomy[cat]||cfg.taxonomy.ancient;document.title=x.title+'｜洪盛集藏';document.getElementById('title').textContent='🪙 洪盛集藏 · '+x.title;document.getElementById('intro').textContent=x.intro;document.getElementById('subs').innerHTML=x.subs.map(s=>'<article class="card"><h3>'+esc(s)+'</h3><p>只显示“'+esc(x.title)+'”品类中属于本主题的资料，不混入其他钱币类别。</p></article>').join('');const list=Array.isArray(items)?items:[];document.getElementById('items').innerHTML=list.length?list.slice(0,60).map(r=>'<article class="item"><div class="meta">'+esc(r.date||'')+' · '+esc(r.subcategory||'')+' · '+esc(r.source||'公开资料')+'</div><h3>'+esc(r.title||'未命名资料')+'</h3><p>'+esc(r.note||'')+'</p></article>').join(''):'<div class="empty">当前品类暂无新的自动整理资料，后台会继续更新。</div>'}).catch(()=>{document.getElementById('items').innerHTML='<div class="empty">分类资料暂时无法加载，请稍后刷新。</div>'});</script></body></html>
