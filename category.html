<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>钱币帖子｜洪盛集藏</title><meta name="description" content="洪盛集藏按钱币品类独立展示相关帖子内容。"><style>:root{--red:#7b1717;--gold:#b98932;--paper:#fffdf8;--bg:#f7f1e5;--muted:#766650;--line:#e4d7bf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#30241d;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:25px 20px}.head{background:#24130f;color:#f0ddb5;padding:30px 0}.head h1{margin:0;color:#efd18a;font:900 31px "Songti SC","Microsoft YaHei",serif}.head p{line-height:1.8;margin:10px 0 0}.back{display:inline-block;margin-top:15px;color:#ffe6a0;text-decoration:none}.bar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:25px 0 15px}.bar h2{margin:0;color:var(--red);font-size:22px}.count{color:var(--muted);font-size:13px}.posts{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.post{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:19px}.meta{font-size:12px;color:#9a806b;margin-bottom:7px}.post h3{margin:0 0 9px;color:var(--red);font-size:19px;line-height:1.5}.post p{margin:0;color:var(--muted);line-height:1.8;font-size:14px}.tag{display:inline-block;margin-top:12px;background:#efe0bf;color:#701515;padding:4px 9px;border-radius:16px;font-size:11px}.empty{background:var(--paper);border:1px dashed #c9b894;border-radius:14px;padding:35px;text-align:center;color:var(--muted)}footer{background:#24130f;color:#c8b99f;margin-top:35px;padding:25px 20px;line-height:1.8}@media(max-width:650px){.posts{grid-template-columns:1fr}}</style></head><body><header class="head"><div class="wrap"><h1 id="title">🪙 洪盛集藏 · 钱币帖子</h1><p id="intro">正在读取该品类的相关帖子……</p><a class="back" href="/knowledge.html">← 返回钱币知识库</a></div></header><main class="wrap"><div class="bar"><h2 id="heading">相关帖子</h2><span class="count" id="count"></span></div><section id="posts" class="posts"><div class="empty">正在加载……</div></section></main><footer><div class="wrap">洪盛集藏｜每个钱币品类独立归档，帖子不跨品类重复展示。</div></footer><script>const names={ancient:'古钱币',silver:'银元',machine:'机制币',banknote:'纸币',commemorative:'纪念币',gold:'金银币',fujian:'福建钱币'};const icons={ancient:'🏺',silver:'🪙',machine:'⚙️',banknote:'📜',commemorative:'🏅',gold:'🥇',fujian:'🏮'};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cat=new URLSearchParams(location.search).get('cat')||'ancient';async function boot(){const name=names[cat]||names.ancient;document.title=name+'帖子｜洪盛集藏';title.textContent=icons[cat]+' 洪盛集藏 · '+name;intro.textContent='这里直接展示“'+name+'”相关帖子。资料经过自动筛选、编辑和品类归档，不再显示其他钱币类别目录。';heading.textContent=name+' · 相关帖子';try{const r=await fetch('/data/categories/'+encodeURIComponent(cat)+'.json?t='+Date.now(),{cache:'no-store'});const rows=r.ok?await r.json():[];const list=Array.isArray(rows)?rows.filter(x=>x&&x.status!=='hidden'):[];count.textContent=list.length+' 条';posts.innerHTML=list.length?list.slice(0,100).map(x=>'<article class="post"><div class="meta">'+esc(x.date||'')+' · '+esc(x.source||'洪盛集藏资料库')+'</div><h3>'+esc(x.title||'未命名帖子')+'</h3><p>'+esc(x.note||x.content||'')+'</p>'+(x.subcategory?'<span class="tag">'+esc(x.subcategory)+'</span>':'')+'</article>').join(''):'<div class="empty">当前该品类暂无已发布帖子，后台会继续自动整理。</div>'}catch{count.textContent='';posts.innerHTML='<div class="empty">资料暂时无法加载，请稍后刷新。</div>'}}boot();</script></body></html>
