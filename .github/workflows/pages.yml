name: Deploy Hongsheng Jicang to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare root site
        run: |
          rm -rf _site
          mkdir -p _site
          if [ -d "static" ]; then cp -r static/. _site/; fi
          if [ -d "data" ]; then cp -r data _site/data; fi
          for f in fujian-coin.html section.html detail.html admin.html; do
            if [ -f "$f" ]; then cp "$f" "_site/$f"; fi
          done
          if [ -d "admin" ]; then cp -r admin _site/admin; fi
          if [ -f "index.html" ]; then cp index.html _site/index.html; fi

          # 强制把首页导航逻辑直接内置到发布后的 index.html，
          # 不依赖外部 JS，避免 GitHub Pages 缓存或资源路径导致卡片失效。
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('_site/index.html')
          if not p.exists():
              raise SystemExit('index.html 不存在')
          s = p.read_text(encoding='utf-8')

          # 删除历史 smart-navigation 外链，避免重复事件处理。
          s = re.sub(r'<script[^>]+src=["\']assets/smart-navigation\.js(?:\?[^"\']*)?["\'][^>]*></script>\s*', '', s, flags=re.I)
          s = re.sub(r'<script[^>]+id=["\']hongsheng-inline-navigation["\'][^>]*>.*?</script>\s*', '', s, flags=re.I|re.S)

          script = r'''<script id="hongsheng-inline-navigation">
          (() => {
            'use strict';
            const MAP = {
              '收藏交流':'content','鉴赏参考':'content','品相研究':'content','收藏知识':'content',
              '市场资讯':'market','真伪知识':'content','收藏普及':'content','藏品展示':'content',
              '福建银元 铜币':'fujian','福建古钱 花钱':'fujian','福建纸币':'fujian','福建货币文化':'fujian',
              '老银元收藏研究':'content','古钱币版别研究':'content','纸币收藏研究':'content',
              '纪念币研究':'content','机制币版别研究':'content','评级知识交流':'services',
              '收藏学院':'advisor','藏友交流':'content','银元交流':'content','古钱币交流':'content',
              '纸币交流':'content','纪念币交流':'content','徽章交流':'content','经验分享':'content',
              '藏品保管建议':'advisor','防潮':'advisor','防氧化':'advisor','存放环境':'advisor',
              '保护盒':'advisor','纸币保护':'advisor','长期保存':'advisor'
            };
            const clean = t => String(t || '').replace(/\s+/g,' ').trim();
            const getUrl = el => {
              if (!el) return null;
              const text = clean(el.innerText || el.textContent);
              const key = Object.keys(MAP).find(k => text.includes(k));
              return key ? 'section.html?group=' + encodeURIComponent(MAP[key]) : null;
            };
            const selectors = '.service-card,.research-card,.fujian-card,.rate-card,.m-item';
            function install() {
              document.querySelectorAll(selectors).forEach(card => {
                const url = getUrl(card);
                if (!url) return;
                card.setAttribute('data-hs-url', url);
                card.style.cursor = 'pointer';
                card.setAttribute('role','link');
                card.setAttribute('tabindex','0');
              });
              document.querySelectorAll('.panel-head h3').forEach(h => {
                const panel = h.closest('.panel,.section-row,.three-col');
                const text = clean(h.innerText || h.textContent);
                let url = null;
                if (text.includes('每日行情')) url = 'section.html?group=market';
                else if (text.includes('福建钱币专区')) url = 'section.html?group=fujian';
                else if (text.includes('钱币研究中心')) url = 'section.html?group=content';
                else if (text.includes('评级知识交流')) url = 'section.html?group=services';
                else if (text.includes('收藏学院')) url = 'section.html?group=advisor';
                else if (text.includes('藏友交流')) url = 'section.html?group=content';
                else if (text.includes('藏品保管建议')) url = 'section.html?group=advisor';
                if (url && panel) panel.setAttribute('data-hs-panel-url', url);
              });
            }
            document.addEventListener('click', e => {
              const card = e.target.closest('[data-hs-url]');
              if (card) {
                e.preventDefault();
                e.stopImmediatePropagation();
                window.location.href = card.getAttribute('data-hs-url');
                return;
              }
              const panel = e.target.closest('[data-hs-panel-url]');
              if (panel && !e.target.closest('a')) {
                e.preventDefault();
                e.stopImmediatePropagation();
                window.location.href = panel.getAttribute('data-hs-panel-url');
              }
            }, true);
            document.addEventListener('keydown', e => {
              if (e.key !== 'Enter' && e.key !== ' ') return;
              const card = e.target.closest('[data-hs-url]');
              if (card) {
                e.preventDefault();
                window.location.href = card.getAttribute('data-hs-url');
              }
            }, true);
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', install);
            else install();
            new MutationObserver(install).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>'''

          pos = s.lower().rfind('</body>')
          if pos < 0:
              s += script
          else:
              s = s[:pos] + script + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
          PY

          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4