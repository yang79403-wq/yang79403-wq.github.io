name: Deploy Hongsheng Jicang to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare root site
        run: |
          rm -rf _site
          mkdir -p _site
          if [ -d "static" ]; then cp -r static/. _site/; fi
          if [ -d "data" ]; then cp -r data _site/data; fi
          for f in fujian-coin.html section.html detail.html admin.html; do
            if [ -f "$f" ]; then cp "$f" "_site/$f"; fi
          done
          if [ -d "admin" ]; then cp -r admin _site/admin; fi
          if [ -f "index.html" ]; then cp index.html _site/index.html; fi
          if [ -f "assets/smart-navigation.js" ]; then
            mkdir -p _site/assets
            cp assets/smart-navigation.js _site/assets/smart-navigation.js
            python3 - <<'PY'
from pathlib import Path
p=Path('_site/index.html')
s=p.read_text(encoding='utf-8')
tag='<script src="assets/smart-navigation.js?v=20260825-2"></script>'
# Remove older smart-navigation tags first so only one version is active.
import re
s=re.sub(r'<script\s+src=["\']assets/smart-navigation\.js(?:\?[^"\']*)?["\']\s*></script>\s*', '', s, flags=re.I)
pos=s.lower().rfind('</body>')
if pos>=0:
    s=s[:pos]+tag+'\n'+s[pos:]
else:
    s+=tag
p.write_text(s,encoding='utf-8')
PY
          fi
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
