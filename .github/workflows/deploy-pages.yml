name: Deploy Hongsheng Jicang

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Wait for Pages propagation
        run: sleep 20
      - name: Production smoke test
        run: |
          set -e
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          for path in / /index.html /app.css /app.js /knowledge.html /category.html?cat=silver /manifest.webmanifest /sw.js /robots.txt /sitemap.xml /data/news.json /data/editorial.json /data/prices/all.json /data/grading_prices.json /data/realtime_ai.json; do
            echo "Checking ${base}${path}"
            curl --fail --silent --show-error --location --max-time 20 "${base}${path}" > /dev/null
          done
          echo "洪盛集藏 Pages smoke test: PASS"
