name: 洪盛集藏 AI Agent

on:
  workflow_dispatch:
    inputs:
      topic:
        description: '可选：指定本轮研究主题'
        required: false
        default: ''
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run AI Agent
        env:
          AGENT_MODE: scheduled
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_MODEL: qwen-turbo
          AGENT_TOPIC: ${{ inputs.topic }}
        run: |
          python scripts/ai_agent.py
          python scripts/agent_discovery.py
      - name: Commit agent outputs
        run: |
          git config user.name 'Hongsheng AI Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add ai/runtime.json ai/runtime-report.json ai/activity-log.json ai/generated/ ai/agent-queue.json
          if git diff --cached --quiet; then
            echo 'No agent changes to commit.'
          else
            git commit -m 'AI Agent: 自动运行与知识整理'
            git push
          fi
