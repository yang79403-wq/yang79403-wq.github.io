name: 洪盛集藏内容发布后同步首页

on:
  push:
    branches: ["main"]
    paths:
      - 'data/content/**'
      - 'data/market/**'
      - 'app/sync_homepage.py'
      - 'app/fix_footer_qr.py'
      - '.github/workflows/sync-homepage.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hongsheng-homepage-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取网站代码
        uses: actions/checkout@v4

      - name: 安装同步组件
        run: pip install beautifulsoup4

      - name: 根据当前数据同步首页内容
        run: python app/sync_homepage.py

      - name: 恢复原版页脚二维码位置
        run: python app/fix_footer_qr.py

      - name: 提交首页同步结果
        run: |
          git config user.name 'Hongsheng Jicang Homepage Sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo '首页无需更新'
          else
            git commit -m "同步首页并恢复原版客服二维码位置"
            git push
          fi
