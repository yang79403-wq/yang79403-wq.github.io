name: 洪盛集藏自动采集-智能分析-成交价格-评级币-图片化-发布

on:
  schedule:
    - cron: '10 0 * * *'
    - cron: '10 6 * * *'
    - cron: '10 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  collect-edit-publish:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, '自动发布:')
    runs-on: ubuntu-latest
    steps:
      - name: 拉取网站代码
        uses: actions/checkout@v5
      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 安装采集组件
        run: python -m pip install --upgrade pip requests beautifulsoup4
      - name: 运行前置 Python 语法检查
        run: python -m compileall -q app
      - name: 采集公开收藏资讯
        run: python app/unified_collect.py
      - name: 自动筛选-编辑-结构化发布
        run: python app/editorial_pipeline.py
      - name: 每日采集各品种实际成交价格
        run: python app/price_pipeline.py
      - name: 每日采集PMG PCGS NGC 华夏评级成交价格
        run: python app/grading_prices_collect.py
      - name: 自动生成各功能板块数据
        run: python app/section_pipeline.py
      - name: 严格按钱币品类重新归档子板块
        run: python app/category_routing_fix.py
      - name: 按钱币品类×功能板块二次归档
        run: python app/section_routing.py
      - name: 将每日成交价格写入对应分类板块
        run: python app/price_section_merge.py
      - name: 智能分析编写并采集图片到站内
        run: python app/intelligent_content_pipeline.py
      - name: 自动数据质量检查
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root=pathlib.Path('.')
          editorial=json.loads((root/'data/editorial.json').read_text(encoding='utf-8'))
          prices=json.loads((root/'data/prices/all.json').read_text(encoding='utf-8'))
          grading=json.loads((root/'data/grading_prices.json').read_text(encoding='utf-8'))
          news=json.loads((root/'data/news.json').read_text(encoding='utf-8'))
          print('自动采集检查：news=',len(news.get('items',[])),'editorial=',editorial.get('published_count',0),'prices=',len(prices.get('items',[])),'grading=',len(grading.get('items',[])))
          if editorial.get('published_count',0) < 1:
              print('ERROR: 本轮没有可发布的最新资料，停止发布，避免旧数据冒充新内容。')
              sys.exit(1)
          if len(prices.get('items',[])) == 0:
              print('WARNING: 本轮公开成交源未取得可核验成交价，价格数据不伪造、不用估价替代。')
          PY
      - name: 首页底部补充联系地址
        run: python app/home_address.py
      - name: 清理前台内部规则文字
        run: python app/remove_public_rules.py
      - name: 整理首页福建唯一入口并清除重复地域内容
        run: python app/fujian_ui_cleanup.py
      - name: 清理首页资讯展示并设置按需客服二维码
        run: python app/home_ui_cleanup.py
      - name: 检查并提交网站数据与程序更新
        run: |
          git config user.name 'Hongsheng Jicang Auto Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '本次没有新增或变化的资料'
          else
            git commit -m '自动发布: 更新洪盛集藏内容与行情数据'
            git push
          fi
