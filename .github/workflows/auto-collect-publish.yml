name: 洪盛集藏自动采集-筛选-编辑-发布

on:
  schedule:
    - cron: '10 0 * * *'
    - cron: '10 6 * * *'
    - cron: '10 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-edit-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取网站代码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装采集组件
        run: pip install requests beautifulsoup4
      - name: 采集公开收藏资讯
        run: python app/unified_collect.py
      - name: 自动筛选-编辑-结构化发布
        run: python app/editorial_pipeline.py
      - name: 检查并提交网站数据
        run: |
          git config user.name 'Hongsheng Jicang Auto Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo '本次没有新增或变化的资料'
          else
            git commit -m '自动采集筛选编辑并发布收藏资料'
            git push
          fi
