name: 洪盛集藏自动采集-智能分析-成交价格-评级币-图片化-发布

on:
  schedule:
    - cron: '10 0 * * *'
    - cron: '10 6 * * *'
    - cron: '10 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-edit-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取网站代码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装采集组件
        run: pip install requests beautifulsoup4
      - name: 采集公开收藏资讯
        run: python app/unified_collect.py
      - name: 自动筛选-编辑-结构化发布
        run: python app/editorial_pipeline.py
      - name: 每日采集各品种实际成交价格
        run: python app/price_pipeline.py
      - name: 每日采集PMG PCGS NGC 华夏评级成交价格
        run: python app/grading_prices_collect.py
      - name: 自动生成各功能板块数据
        run: python app/section_pipeline.py
      - name: 严格按钱币品类重新归档子板块
        run: python app/category_routing_fix.py
      - name: 按钱币品类×功能板块二次归档
        run: python app/section_routing.py
      - name: 将每日成交价格写入对应分类板块
        run: python app/price_section_merge.py
      - name: 智能分析编写并采集图片到站内
        run: python app/intelligent_content_pipeline.py
      - name: 首页底部补充联系地址
        run: python app/home_address.py
      - name: 清理前台内部规则文字
        run: python app/remove_public_rules.py
      - name: 整理首页福建唯一入口并清除重复地域内容
        run: python app/fujian_ui_cleanup.py
      - name: 清理首页资讯展示并设置按需客服二维码
        run: python app/home_ui_cleanup.py
      - name: 检查并提交网站数据与程序更新
        run: |
          git config user.name 'Hongsheng Jicang Auto Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ app/ assets/ index.html category.html section.html news.html
          if git diff --cached --quiet; then
            echo '本次没有新增或变化的资料'
          else
            git commit -m '清理前台内部规则并保持后台采集规则'
            git push
          fi
