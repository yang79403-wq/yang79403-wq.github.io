name: 洪盛集藏自动采集-筛选-编辑-发布

on:
  schedule:
    - cron: '10 0 * * *'
    - cron: '10 6 * * *'
    - cron: '10 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  collect-edit-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取网站代码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装采集组件
        run: pip install requests beautifulsoup4
      - name: 采集公开收藏资讯
        run: python app/unified_collect.py
      - name: 自动筛选-编辑-结构化发布
        run: python app/editorial_pipeline.py
      - name: 自动生成知识-鉴赏-版别-服务-藏品-行情-福建板块数据
        run: python app/section_pipeline.py
      - name: 严格按钱币品类重新归档子板块
        run: python app/category_routing.py
      - name: 按钱币品类×功能板块二次归档
        run: python app/section_routing.py
      - name: 整理首页福建唯一入口并清除重复地域内容
        run: python app/fujian_ui_cleanup.py
      - name: 清理首页资讯展示并设置按需客服二维码
        run: python app/home_ui_cleanup.py
      - name: 检查并提交网站数据与程序更新
        run: |
          git config user.name 'Hongsheng Jicang Auto Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ app/ index.html category.html knowledge.html section.html
          if git diff --cached --quiet; then
            echo '本次没有新增或变化的资料'
          else
            git commit -m '建立钱币品类与功能板块双重隔离归档'
            git push
          fi
