name: 洪盛集藏自动采集与发布

on:
  schedule:
    - cron: '10 0 * * *'
    - cron: '10 6 * * *'
    - cron: '10 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取网站代码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装采集组件
        run: pip install requests beautifulsoup4
      - name: 自动采集公开钱币收藏资讯
        run: python app/unified_collect.py
      - name: 检查并提交新增资料
        run: |
          git config user.name 'Hongsheng Jicang Auto Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo '本次没有新增或变化的资料'
          else
            git commit -m "自动更新钱币收藏公开资讯"
            git push
          fi
