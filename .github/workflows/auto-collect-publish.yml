name: 洪盛集藏行业知识采集与数据更新

on:
  schedule:
    - cron: '10 0 * * *'
    - cron: '10 6 * * *'
    - cron: '10 12 * * *'
  workflow_dispatch:

# 自动任务只允许更新数据层，不直接改写前端页面结构。
permissions:
  contents: write

concurrency:
  group: hongsheng-content-update
  cancel-in-progress: true

jobs:
  collect-and-update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 拉取网站代码
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装采集组件
        run: python -m pip install --upgrade pip requests beautifulsoup4

      - name: Python 语法检查
        run: python -m compileall -q app

      - name: 采集公开收藏资讯
        run: python app/unified_collect.py

      - name: 采集国际拍卖中国钱币资讯
        run: python app/auction_world_collect.py

      - name: 高质量编辑与证据分级
        run: python app/editorial_pipeline.py

      - name: 采集公开成交价格
        run: python app/price_pipeline.py

      - name: 采集评级成交价格
        run: python app/grading_prices_collect.py

      - name: 生成行业知识与数据板块
        run: python app/section_pipeline.py

      - name: 钱币品类归档
        run: python app/category_routing_fix.py

      - name: 钱币品类×功能板块归档
        run: python app/section_routing.py

      - name: 合并成交价格数据
        run: python app/price_section_merge.py

      - name: 智能内容处理
        run: python app/intelligent_content_pipeline.py

      - name: 数据质量检查
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          root = pathlib.Path('.')
          files = {
              'editorial': root/'data/editorial.json',
              'prices': root/'data/prices/all.json',
              'grading': root/'data/grading_prices.json',
              'news': root/'data/news.json',
              'auction': root/'data/china_auction_news.json',
              'realtime': root/'data/realtime_ai.json',
          }
          for name, path in files.items():
              if not path.exists():
                  print(f'ERROR: 缺少数据文件 {path}')
                  sys.exit(1)
          editorial=json.loads(files['editorial'].read_text(encoding='utf-8'))
          prices=json.loads(files['prices'].read_text(encoding='utf-8'))
          grading=json.loads(files['grading'].read_text(encoding='utf-8'))
          news=json.loads(files['news'].read_text(encoding='utf-8'))
          auction=json.loads(files['auction'].read_text(encoding='utf-8'))
          realtime=json.loads(files['realtime'].read_text(encoding='utf-8'))
          items=editorial.get('items',[]) if isinstance(editorial,dict) else []
          source_count=len({x.get('source') for x in items if x.get('source')})
          cats={x.get('category') for x in items if x.get('category')}
          levels={x.get('evidence_level') for x in items if x.get('evidence_level')}
          titles=[re.sub(r'\s+','',str(x.get('title','')).lower()) for x in items]
          print('数据检查:', 'news=',len(news.get('items',[])), 'editorial=',editorial.get('published_count',0), 'prices=',len(prices.get('items',[])), 'grading=',len(grading.get('items',[])), 'auction=',len(auction.get('items',[])), 'realtime=',len(realtime.get('items',[])), 'sources=',source_count, 'evidence_levels=',sorted(levels), 'categories=',sorted(cats))
          if editorial.get('published_count',0) < 3:
              print('ERROR: 高质量资料少于3条，停止提交。')
              sys.exit(1)
          if source_count < 2:
              print('ERROR: 独立来源少于2个，停止提交。')
              sys.exit(1)
          if not realtime.get('items'):
              print('ERROR: realtime_ai.json 没有可展示研究资料。')
              sys.exit(1)
          allowed={'钱币知识','银元研究','机制币研究','纸币研究','纪念币资讯','金银币资讯','评级与市场资料','地域收藏'}
          if not cats or not cats.issubset(allowed):
              print('ERROR: 出现未定义的研究分类:', sorted(cats-allowed))
              sys.exit(1)
          if len(set(titles)) != len(titles):
              print('ERROR: 当前批次存在重复标题，停止提交。')
              sys.exit(1)
          for x in items:
              if not x.get('source') or not x.get('source_url_internal'):
                  print('ERROR: 条目缺少来源或来源链接:', x.get('title'))
                  sys.exit(1)
              if x.get('evidence_level') not in {'A','B','C'}:
                  print('ERROR: 条目缺少有效证据等级:', x.get('title'))
                  sys.exit(1)
              if int(x.get('quality_score',0)) < 125:
                  print('ERROR: 条目质量分低于门槛:', x.get('title'), x.get('quality_score'))
                  sys.exit(1)
          PY

      - name: 防止自动任务修改前端
        run: |
          git status --short
          changed=$(git diff --name-only)
          blocked=''
          for f in $changed; do
            case "$f" in
              index.html|app.css|app.js|manifest.webmanifest|sw.js|robots.txt|sitemap.xml|README.md|.github/workflows/*)
                blocked="$blocked $f" ;;
            esac
          done
          if [ -n "$blocked" ]; then
            echo "ERROR: 自动采集任务尝试修改受保护文件:$blocked"
            git restore --worktree --staged -- $blocked || true
            exit 1
          fi

      - name: 提交数据层更新
        run: |
          git config user.name 'Hongsheng Jicang Data Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo '本次没有新增数据变化'
          else
            git commit -m '自动发布: 更新洪盛集藏研究资料与市场证据'
            git push
          fi
