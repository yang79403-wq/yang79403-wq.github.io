<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>洪盛集藏 · 页面跳转</title>
<style>
:root{--red:#5b0d08;--gold:#c8a15a;--light:#ffe4a0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--red);color:var(--light);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;text-align:center;padding:13vh 7%}main{max-width:820px;margin:auto}h1{font-size:clamp(34px,6vw,64px);margin:0 0 36px;font-weight:800}p{font-size:clamp(18px,3vw,28px);color:#ead8bd;margin:0 0 34px;line-height:1.6}.buttons{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}a{display:inline-block;min-width:190px;padding:15px 24px;border:2px solid var(--gold);border-radius:12px;color:var(--light);text-decoration:none;font-size:20px;font-weight:700}a:hover{background:var(--gold);color:var(--red)}small{display:block;margin-top:32px;color:#d6c5aa}
</style>
</head>
<body>
<main>
<h1>🏮 洪盛集藏资讯网</h1>
<p id="message">正在恢复网站页面，请稍候……</p>
<div class="buttons">
<a href="./">返回首页</a>
<a href="./admin/cms-live.html">进入网站管理</a>
</div>
<small>网站内容没有删除，系统正在自动处理页面地址。</small>
</main>
<script>
(function(){
  var p=location.pathname.replace(/\/+$/,'').toLowerCase();
  var base=location.origin;
  var routes={
    '/market':'#market','/daily':'#daily','/silver':'#silver','/ancient':'#ancient',
    '/banknote':'#banknote','/academy':'#academy','/collection':'#collection','/research':'#research',
    '/news':'#news','/fujian':'#fujian'
  };
  if(p===''||p==='/'||p.endsWith('/index-v20.html')||p.endsWith('/index-v19.html')){location.replace(base+'/');return;}
  if(p==='/admin'||p==='/admin/index.html'||p==='/admin/cms'){location.replace(base+'/admin/cms-live.html');return;}
  var key=Object.keys(routes).find(function(k){return p===k||p.endsWith(k);});
  if(key){document.getElementById('message').textContent='页面地址已自动转换，正在进入对应网站版块……';location.replace(base+'/'+routes[key]);return;}
  document.getElementById('message').textContent='页面暂时未找到，但网站内容没有删除。请选择返回首页或进入网站管理。';
})();
</script>
</body>
</html>
