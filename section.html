<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>钱币专题板块｜洪盛集藏</title><meta name="description" content="洪盛集藏智能整理钱币知识、行情、鉴赏、版别研究、收藏服务与藏品资料。前台采用站内内容与本地图片展示。"><style>body{margin:0;background:#f7f1e5;color:#30241d;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.wrap{max-width:1120px;margin:auto;padding:25px 20px}.head{background:#24130f;color:#f0ddb5;padding:30px 0}.head h1{margin:0;color:#efd18a}.head p{line-height:1.9}.nav{background:#fffdf8;border-bottom:1px solid #e4d7bf;position:sticky;top:0;z-index:5;overflow:auto;white-space:nowrap}.nav a{display:inline-block;padding:12px 10px;color:#7b1717;text-decoration:none;font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs a{padding:9px 13px;background:#fffdf8;border:1px solid #e4d7bf;border-radius:20px;color:#7b1717;text-decoration:none;font-weight:800}.tabs a.on{background:#7b1717;color:#fff}.group{margin-top:25px}.group h2{color:#7b1717}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#fffdf8;border:1px solid #e4d7bf;border-radius:12px;padding:18px}.card h3{margin:0 0 8px;color:#7b1717}.card p{margin:0;color:#766650;line-height:1.75}.item{margin-top:15px;padding:0;background:#fffdf8;border:1px solid #e4d7bf;border-radius:15px;overflow:hidden}.item img{width:100%;aspect-ratio:16/8;object-fit:cover;display:block;background:#eadfc9}.body{padding:18px}.meta{font-size:12px;color:#927d6c}.badge{display:inline-block;margin:8px 0;padding:4px 9px;border-radius:20px;background:#efe0bf;color:#701515;font-size:12px}.item h3{color:#7b1717;margin:7px 0 10px}.text{color:#5f5142;line-height:1.85}.analysis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.analysis div{background:#f5eddf;border-radius:9px;padding:12px;line-height:1.75;color:#5f5142}.source{font-size:12px;color:#8b765e;margin-top:12px}.empty{padding:25px;background:#fffdf8;border:1px dashed #c9b894;border-radius:12px;color:#766650}footer{background:#24130f;color:#c8b99f;padding:25px 0;margin-top:35px;line-height:1.8}@media(max-width:650px){.analysis{grid-template-columns:1fr}.wrap{padding-left:15px;padding-right:15px}}</style></head><body><header class="head"><div class="wrap"><h1 id="title">洪盛集藏 · 专题板块</h1><p id="intro">加载中……</p></div></header><nav class="nav"><div class="wrap"><a href="/">首页</a><a href="/knowledge.html">知识库</a><a id="m">行情</a><a id="a">鉴赏</a><a id="r">版别研究</a><a id="s">收藏服务</a><a id="c">藏品展示</a></div></nav><main class="wrap"><div id="tabs" class="tabs"></div><section class="group"><h2 id="sectionTitle"></h2><div id="subs" class="grid"></div></section><section class="group"><h2>智能整理资料</h2><div id="items"></div></section></main><footer><div class="wrap">洪盛集藏｜智能筛选 · 智能编写 · 站内图片化展示｜仅供学习、研究与收藏交流参考。</div></footer><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const q=new URLSearchParams(location.search),cat=q.get('cat')||'ancient',section=q.get('section')||'market';const names={market:'钱币行情',appraisal:'在线鉴赏',research:'版别研究',services:'收藏服务',collection:'藏品展示'};async function get(p){try{const r=await fetch(p+'?t='+Date.now(),{cache:'no-store'});return r.ok?await r.json():[]}catch{return[]}}async function boot(){const cfg=await get('/data/section-config.json');const c=cfg.categories?.[cat]||cfg.categories.ancient;const title=names[section]||names.market;document.title=c.title+' · '+title+'｜洪盛集藏';document.getElementById('title').textContent='🪙 洪盛集藏 · '+c.title+' · '+title;document.getElementById('intro').textContent='本页面由洪盛集藏自动完成资料筛选、分类、智能摘要、研究分析和站内图片化展示，不采用外部原文跳转模式。';const links=[['ancient','古钱币'],['silver','银元'],['machine','机制币'],['banknote','纸币'],['commemorative','纪念币'],['gold','金银币'],['fujian','福建钱币']];document.getElementById('tabs').innerHTML=links.map(x=>'<a class="'+(x[0]===cat?'on':'')+'" href="?section='+encodeURIComponent(section)+'&cat='+x[0]+'">'+x[1]+'</a>').join('');['m','a','r','s','c'].forEach((id,i)=>document.getElementById(id).href='?section='+['market','appraisal','research','services','collection'][i]+'&cat='+encodeURIComponent(cat));document.getElementById('sectionTitle').textContent=title+' · '+c.title;document.getElementById('subs').innerHTML=(c.sections?.[section]||[]).map(x=>'<article class="card"><h3>'+esc(x)+'</h3><p>专属于“'+esc(c.title)+'”的智能资料子板块。</p></article>').join('');const rows=await get('/data/sections/'+section+'_'+cat+'.json');document.getElementById('items').innerHTML=rows.length?rows.slice(0,80).map(r=>{const a=r.analysis||{};return '<article class="item">'+(r.image?'<img src="'+esc(r.image)+'" alt="'+esc(r.title||'钱币资料图')+'">':'')+'<div class="body"><div class="meta">'+esc(r.date||'')+' · '+esc(r.subcategory||r.category_title||'专题资料')+'</div><span class="badge">智能整理 · '+esc((r.keywords||[]).slice(0,5).join(' · ')||'收藏研究')+'</span><h3>'+esc(r.title||'未命名资料')+'</h3><p class="text">'+esc(a['智能导读']||r.note||'')+'</p><div class="analysis"><div><strong>核心分析</strong><br>'+esc(a['核心分析']||'围绕钱币历史、特征、版别和保存状态进行结构化研究。')+'</div><div><strong>鉴赏观察</strong><br>'+esc(a['鉴赏观察']||'结合图文、形制、工艺和状态进行综合观察。')+'</div><div><strong>收藏提示</strong><br>'+esc(a['收藏提示']||'公开资料仅供学习、研究与收藏交流参考。')+'</div><div><strong>图片说明</strong><br>'+esc(a['图片说明']||'站内资料图')+'</div></div><div class="source">资料来源：'+esc(r.source||'公开资料')+' · 前台不提供外部跳转</div></div></article>'}).join(''):'<div class="empty">当前没有符合本品类与功能板块的资料，后台会继续智能筛选和更新。</div>'}boot().catch(()=>document.getElementById('items').innerHTML='<div class="empty">资料暂时无法加载，请稍后刷新。</div>');</script></body></html>
