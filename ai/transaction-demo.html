<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏｜最近成交价</title><meta name="description" content="洪盛集藏站内最近成交价查询：从已登记公开来源的数据中直接查询钱币成交记录。"><meta name="robots" content="index,follow"><style>body{margin:0;background:#f7f1e5;color:#35291e;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.hero{background:linear-gradient(125deg,#29110d,#781d16);color:#fff;padding:42px 20px}.wrap{max-width:1100px;margin:auto;padding:0 20px}.hero h1{color:#efd18a}.search{display:flex;background:#fff;border-radius:10px;padding:5px;margin-top:20px}.search input{flex:1;border:0;outline:0;padding:14px;font-size:16px}.search button{border:0;background:#761919;color:#fff;border-radius:7px;padding:0 20px;font-weight:700}.panel{background:#fffdf8;border:1px solid #e2d5bd;border-radius:12px;padding:20px;margin:18px 0}.filters button{border:1px solid #d8c8aa;background:#fffaf0;border-radius:20px;padding:8px 12px;margin:4px;cursor:pointer}.filters button.active{background:#761919;color:#fff}.hit{border:1px solid #ddcfb8;border-radius:10px;padding:16px;margin:10px 0}.hit h3{color:#761717}.price{font-size:24px;font-weight:800}.meta{font-size:13px;color:#756550;line-height:1.8}.source{display:inline-block;background:#efe0bf;border-radius:99px;padding:4px 9px;font-size:12px;margin-right:5px}.empty{text-align:center;padding:25px;color:#786a58}.notice{background:#f4ead5;border-left:4px solid #c9a35a;padding:15px;line-height:1.8;font-size:13px}</style></head><body><section class="hero"><div class="wrap"><h1>🪙 洪盛集藏｜最近成交价</h1><p>直接在洪盛集藏网站内查询，不使用 Google 搜索。数据由洪盛集藏 Agent 整理进入本站数据库后显示。</p><div class="search"><input id="q" placeholder="例如：袁大头三年"><button onclick="run()">查询最近成交</button></div></div></section><main class="wrap"><section class="panel"><div class="filters"><button class="active" onclick="setSource('全部',this)">全部</button><button onclick="setSource('钱币天堂',this)">钱币天堂</button><button onclick="setSource('一尘网',this)">一尘网</button></div><p id="status" class="meta">请输入钱币名称，查询本站已收录的最近成交记录。</p><div id="results"><div class="empty">尚未查询</div></div></section><section class="panel notice"><strong>成交规则：</strong>仅显示进入洪盛集藏数据库且有来源记录的成交数据；挂牌、求购、起拍价不会冒充成交价；流标单独处理。每条记录尽量保留原始来源和日期。没有数据时明确显示“暂无已收录成交”，不使用AI猜价。</section><p><a href="./collector-assistant.html">← AI收藏助手</a>　<a href="../archive/">数字档案</a>　<a href="../">首页</a></p></main><script>let data=[],source='全部';async function load(){for(const p of ['data/transactions.json','transactions.json']){try{const r=await fetch(p,{cache:'no-store'});if(r.ok){const x=await r.json();data=Array.isArray(x)?x:(x.items||[]);break}}catch(e){}}}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function run(){const q=document.getElementById('q').value.trim().toLowerCase();let out=data.filter(x=>(source==='全部'||x.source===source)&&(!q||[x.name,x.aliases,x.category,x.variant,x.condition].join(' ').toLowerCase().includes(q))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));document.getElementById('status').textContent='查询：'+(q||'全部')+' · '+out.length+' 条站内记录';document.getElementById('results').innerHTML=out.length?out.map(x=>'<article class="hit"><span class="source">'+esc(x.source)+'</span><span class="source">'+esc(x.status||'成交')+'</span><h3>'+esc(x.name)+'</h3><div class="price">¥ '+esc(x.price||'未记录')+'</div><div class="meta">日期：'+esc(x.date||'未注明')+'　版别：'+esc(x.variant||'未注明')+'　品相：'+esc(x.condition||'未注明')+'</div>'+(x.note?'<div class="meta">'+esc(x.note)+'</div>':'')+(x.url?'<p><a target="_blank" rel="noopener" href="'+esc(x.url)+'">查看原始成交帖 →</a></p>':'')+'</article>').join(''):'<div class="empty"><strong>暂无已收录成交记录</strong><br>本站不会用Google搜索结果或AI估算价格冒充成交数据。</div>'}function setSource(s,b){source=s;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(document.getElementById('q').value.trim())run()}load()</script></body></html>
