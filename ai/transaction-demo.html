<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏｜AI成交数据库</title><meta name="description" content="洪盛集藏站内AI成交数据库：按钱币名称查询已采集的公开成交证据，并按来源、日期、状态展示。"><meta name="robots" content="index,follow"><style>body{margin:0;background:#f7f1e5;color:#35291e;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.hero{background:linear-gradient(125deg,#29110d,#781d16);color:#fff;padding:42px 20px}.wrap{max-width:1100px;margin:auto;padding:0 20px}.hero h1{color:#efd18a}.search{display:flex;background:#fff;border-radius:10px;padding:5px;margin-top:20px}.search input{flex:1;border:0;outline:0;padding:14px;font-size:16px}.search button{border:0;background:#761919;color:#fff;border-radius:7px;padding:0 20px;font-weight:700}.panel{background:#fffdf8;border:1px solid #e2d5bd;border-radius:12px;padding:20px;margin:18px 0}.hit{border:1px solid #ddcfb8;border-radius:9px;padding:15px;margin:10px 0}.hit a{color:#761919;font-weight:700;text-decoration:none}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;margin:3px;background:#ead9b6}.muted{font-size:12px;color:#776650;line-height:1.7}.empty{padding:24px;text-align:center;background:#fffaf0;border-radius:9px}.warn{border-left:4px solid #c9a35a;padding:15px;background:#f4ead5;line-height:1.8}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e2d5bd}th{color:#761717}@media(max-width:650px){.search{display:block;background:transparent}.search input{width:100%;box-sizing:border-box;border-radius:8px}.search button{padding:12px 20px;margin-top:7px}table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><section class="hero"><div class="wrap"><h1>🤖 洪盛集藏 AI成交数据库</h1><p>直接在洪盛集藏网站内查询已进入本站数据库的公开成交证据，不跳到 Google 搜索。</p><div class="search"><input id="q" placeholder="输入：袁大头三年、龙洋、船洋……"><button onclick="search()">查询成交</button></div></div></section><main class="wrap"><section class="panel"><div id="summary"><h2>站内成交查询</h2><p class="muted">数据来源：洪盛集藏 Agent 定期采集并整理的公开资料。只有进入本站数据库的记录才会显示。</p></div><div id="results"><div class="empty">正在读取洪盛集藏成交数据库……</div></div></section><section class="panel warn"><strong>数据规则：</strong>成交、售出、已成交优先；挂牌、求购、起拍价不计为成交；流标单独标记。每条记录保留来源与日期。当前不绕过第三方网站的登录、验证码、付费墙或访问限制。</section><p><a href="./collector-assistant.html">← AI收藏助手</a>　<a href="../archive/">数字档案</a>　<a href="../">洪盛集藏首页</a></p></main><script>let data=[];const sources=['data/transactions.json','transactions.json'];async function load(){for(const p of sources){try{const r=await fetch(p,{cache:'no-store'});if(r.ok){const x=await r.json();data=Array.isArray(x)?x:(x.items||[]);break}}catch(e){}}render(data)}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function search(){const q=document.getElementById('q').value.trim().toLowerCase();const out=q?data.filter(x=>[x.name,x.aliases,x.category,x.variant,x.condition,x.source].join(' ').toLowerCase().includes(q)):data;document.getElementById('summary').innerHTML='<h2>🔎 '+(q?('“'+esc(q)+'” 的站内成交记录'): '最新站内成交记录')+'</h2><p class="muted">共找到 '+out.length+' 条记录。排序：成交日期由新到旧。</p>';render(out)}function render(items){const box=document.getElementById('results');if(!items.length){box.innerHTML='<div class="empty"><strong>目前本站数据库没有匹配的成交记录。</strong><p class="muted">Agent会在后续运行周期中处理已经登记、允许公开访问的来源。当前不会用 Google 搜索结果冒充本站成交数据。</p></div>';return}items=[...items].sort((a,b)=>(b.date||'').localeCompare(a.date||''));box.innerHTML='<div style="overflow:auto"><table><thead><tr><th>日期</th><th>钱币</th><th>版别</th><th>品相</th><th>成交价</th><th>来源</th><th>证据</th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.variant||'未注明')+'</td><td>'+esc(x.condition||'未注明')+'</td><td>'+esc(x.price||'未记录')+'</td><td>'+esc(x.source)+'</td><td>'+(x.url?'<a target="_blank" rel="noopener" href="'+esc(x.url)+'">原始记录</a>':'未提供')+'</td></tr>').join('')+'</tbody></table></div>'}load()</script></body></html>
