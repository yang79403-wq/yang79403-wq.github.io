<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏｜AI成交证据查询</title><meta name="description" content="按钱币名称生成一尘网、钱币天堂等公开成交证据检索任务，并整理为可核验样本。"><style>body{margin:0;background:#f7f1e5;color:#35291e;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.hero{background:linear-gradient(125deg,#29110d,#781d16);color:#fff;padding:42px 20px}.wrap{max-width:1050px;margin:auto;padding:0 20px}.hero h1{color:#efd18a}.search{display:flex;background:#fff;border-radius:10px;padding:5px;margin-top:20px}.search input{flex:1;border:0;outline:0;padding:14px;font-size:16px}.search button{background:#761919;color:#fff;border:0;border-radius:7px;padding:0 20px;font-weight:700}.panel{background:#fffdf8;border:1px solid #e2d5bd;border-radius:12px;padding:20px;margin:18px 0}.sample{border:1px solid #ded1bb;border-radius:9px;padding:15px;margin:10px 0}.sample h3{color:#761717;margin:0 0 7px}.sample a{color:#761919;font-weight:700;text-decoration:none}.badge{display:inline-block;background:#efe0bf;border-radius:99px;padding:5px 9px;margin:3px;font-size:12px}.muted{font-size:12px;color:#776650;line-height:1.8}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #e5dac6;text-align:left;font-size:13px}.warn{border-left:4px solid #c9a35a;background:#f4ead5;padding:15px;line-height:1.8}@media(max-width:650px){.search{display:block;background:transparent}.search input{width:100%;box-sizing:border-box;border-radius:8px}.search button{padding:12px 20px;margin-top:7px}} </style></head><body><section class="hero"><div class="wrap"><h1>🪙 AI成交证据查询</h1><p>输入钱币名称，自动生成公开成交检索，并把“成交、售出、挂牌、流标”严格分开。</p><div class="search"><input id="q" placeholder="例如：袁大头三年、八年大头、龙洋、船洋"><button onclick="run()">开始查询</button></div></div></section><main class="wrap"><section id="out" class="panel"><h2>输入钱币开始</h2><p class="muted">系统会生成一尘网、钱币天堂的公开检索入口，并提供成交样本记录格式。</p></section><section class="panel"><h2>📊 成交样本标准</h2><table class="table"><tr><th>字段</th><th>要求</th></tr><tr><td>状态</td><td>成交/售出优先，挂牌与流标分开</td></tr><tr><td>价格</td><td>必须有原始页面证据</td></tr><tr><td>日期</td><td>记录成交或页面日期</td></tr><tr><td>来源</td><td>保留原始来源页面</td></tr><tr><td>品相/版别</td><td>仅在原文有依据时提取</td></tr></table></section><section class="panel warn"><strong>数据边界：</strong>当前前端不能绕过网站访问限制，也不会伪造实时成交数据。真实自动汇总需要合法可访问的公开数据源或授权接口。AI输出仅作研究参考，不替代真伪鉴定、评级或正式报价。</section><p><a href="./transaction-demo.html">← 成交检索</a>　<a href="./collector-assistant.html">AI收藏助手</a>　<a href="../archive/">数字档案</a>　<a href="../">首页</a></p></main><script>function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function run(){const q=document.getElementById('q').value.trim();if(!q){document.getElementById('out').innerHTML='<h2>请输入钱币名称</h2>';return}const e=encodeURIComponent(q);document.getElementById('out').innerHTML='<h2>🔎 '+esc(q)+'：检索任务</h2><span class="badge">成交优先</span><span class="badge">售出优先</span><span class="badge">挂牌分离</span><span class="badge">流标排除</span><div class="sample"><h3>一尘网</h3><p class="muted">检索：'+esc(q)+' + 成交 / 售出 / 已成交 / 买卖</p><a target="_blank" rel="noopener" href="https://www.google.com/search?q=site%3Akc0011.net+%22'+e+'%22+%28成交+OR+售出+OR+已成交%29">打开公开检索 →</a></div><div class="sample"><h3>钱币天堂</h3><p class="muted">检索：'+esc(q)+' + 成交 / 售出 / 竞价 / 流标</p><a target="_blank" rel="noopener" href="https://www.google.com/search?q=site%3Ayy11.com+%22'+e+'%22+%28成交+OR+售出+OR+竞价+OR+流标%29">打开公开检索 →</a></div><div class="sample"><h3>📋 AI整理模板</h3><p class="muted">找到真实成交页面后，记录：钱币名称｜版别｜品相｜成交价｜日期｜来源｜原帖。</p></div>'}</script></body></html>
