<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏｜全站钱币搜索</title><meta name="description" content="洪盛集藏全站钱币知识、收藏资料、福建专题和数字档案搜索。"><style>body{margin:0;background:#f7f1e5;color:#35291e;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.hero{background:linear-gradient(125deg,#35140e,#791f17);color:#fff;padding:38px 20px}.wrap{max-width:1100px;margin:auto;padding:0 20px}.hero h1{color:#efd18a}.bar{display:flex;background:#fff;border-radius:9px;padding:5px;max-width:800px}.bar input{flex:1;border:0;padding:13px;outline:0;font-size:16px}.bar button{background:#761919;color:white;border:0;border-radius:7px;padding:0 20px}.status{margin:20px 0;padding:12px;background:#fffaf0;border-left:4px solid #c9a35a}.item{background:#fffdf8;border:1px solid #e2d5bd;border-radius:11px;padding:17px;margin:10px 0}.item h3{margin:0;color:#761717}.muted{color:#806f5a;font-size:13px;line-height:1.7}.tag{display:inline-block;background:#efe0bf;padding:4px 8px;border-radius:99px;font-size:12px;margin:4px 4px 0 0}@media(max-width:650px){.bar{display:block;background:transparent}.bar input{width:100%;box-sizing:border-box;border-radius:8px}.bar button{padding:12px 20px;margin-top:7px}}</style></head><body><section class="hero"><div class="wrap"><h1>🔎 洪盛集藏全站搜索</h1><p>搜索知识库、收藏资料、行情资料、福建专题与数字档案。</p><form class="bar" id="form"><input id="q" placeholder="袁大头、龙洋、开元通宝、福建钱币、评级……"><button>搜索</button></form></div></section><main class="wrap"><div id="status" class="status">正在建立索引……</div><div id="results"></div><p><a href="./">← 首页</a>　<a href="./knowledge/">知识库</a>　<a href="./archive/">数字档案</a></p></main><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),param=new URLSearchParams(location.search),paths=['data/content','data/market'];let index=[];async function files(p){try{const r=await fetch('https://api.github.com/repos/yang79403-wq/yang79403-wq.github.io/contents/'+p+'?ref=main');if(!r.ok)return[];return (await r.json()).filter(x=>x.type==='file'&&x.name.endsWith('.json')).map(x=>x.name)}catch{return[]}}async function load(){for(const p of paths){for(const f of await files(p)){try{const r=await fetch(p+'/'+f+'?t='+Date.now());if(!r.ok)continue;const d=await r.json();(Array.isArray(d)?d:[d]).forEach(x=>{if(x&&x.status!=='hidden')index.push({...x,_file:f,_path:p})})}catch{}}}run(param.get('q')||'')}function run(v){$('q').value=v;const q=v.trim().toLowerCase(),a=index.filter(x=>{const s=[x.title,x.name,x.note,x.content,x.body,x.price,x.variety,x.category].filter(Boolean).join(' ').toLowerCase();return !q||s.includes(q)}).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));$('status').textContent=q?'“'+v+'”找到 '+a.length+' 条资料':'当前可检索 '+a.length+' 条资料';$('results').innerHTML=a.slice(0,150).map(x=>'<article class="item"><h3>'+esc(x.title||x.name||x.variety||'未命名资料')+'</h3><span class="tag">'+esc(x.category||x.kind||x._file)+'</span> <span class="muted">'+esc(x.date||'')+'</span><p class="muted">'+esc(x.note||x.content||x.body||'')+'</p></article>').join('')||'<div class="item">没有找到匹配资料。试试换成钱币名称、版别或地区关键词。</div>'}$('form').onsubmit=e=>{e.preventDefault();const v=$('q').value.trim();history.replaceState({},'',v?'search.html?q='+encodeURIComponent(v):'search.html');run(v)};load();</script></body></html>
