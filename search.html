<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5a0b07">
<title>洪盛集藏｜全站搜索</title>
<style>
:root{--red:#5a0b07;--red2:#75160f;--gold:#c9a45c;--gold2:#f0d58a;--paper:#fffaf0;--ink:#3b2a24;--muted:#806e60;--line:#e3cfa7}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#4d0806,#650f09 25%,#4b0806);color:#fff4dc;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{padding:10px;text-align:center;color:var(--gold2);font-size:12px;border-bottom:1px solid #d6b35c55;background:#3c0504}.wrap{width:min(1100px,92vw);margin:auto}.head{padding:28px 0;border-bottom:1px solid #d6b35c66}.brand{text-align:center;color:#f5d88b;font:900 clamp(34px,6vw,58px) "Songti SC",STSong,serif;letter-spacing:4px}.back{display:block;width:max-content;margin:14px auto 0;color:#ffe7a5;text-decoration:none;border:1px solid #d6b35c77;border-radius:4px;padding:7px 14px}.main{padding:28px 0 50px}.searchbox{display:flex;gap:8px;margin:0 auto 24px;max-width:760px}.searchbox input{flex:1;padding:13px 14px;border-radius:5px;border:1px solid #d7b45a;background:#fffaf0;color:#3b2a24;font-size:15px;outline:none}.searchbox button{padding:0 20px;border:1px solid #d7b45a;border-radius:5px;background:#c9a45c;color:#4b2c06;font-weight:900;cursor:pointer}.summary{text-align:center;color:#dcc8a7;font-size:12px;margin-bottom:18px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--paper);color:var(--ink);border:1px solid #d7b45a;border-radius:5px;overflow:hidden}.body{padding:13px}.tag{display:inline-block;padding:3px 7px;background:#efe1c5;color:#795b2b;border-radius:99px;font-size:10px;margin-right:5px}.date{font-size:10px;color:#9b8577}.title{font:900 18px/1.5 "Songti SC",STSong,serif;color:#64150f;margin:7px 0}.desc{font-size:12px;color:#766459;line-height:1.75;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.go{display:inline-block;margin-top:10px;color:#986a25;font-size:12px;font-weight:900;text-decoration:none}.empty{text-align:center;padding:30px 10px;background:#71160e;border:1px dashed #d7b45a88;color:#e8d1ae}.loading{text-align:center;color:#e8d1ae;padding:30px}.kind{color:#f0d58a}.price{margin-top:6px;color:#8a4c18;font-weight:900}@media(max-width:900px){.results{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.wrap{width:94vw}.searchbox{flex-direction:column}.searchbox button{height:44px}.results{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">🏮 洪盛集藏资讯网 · 全站收藏资料搜索</div>
<header class="head"><div class="wrap"><div class="brand">洪盛集藏</div><a class="back" href="./">← 返回首页</a></div></header>
<main class="wrap main">
<form class="searchbox" id="searchForm"><input id="q" type="search" placeholder="搜索：袁大头、龙洋、版别、评级、行情……" autocomplete="off"><button>搜索</button></form>
<div class="summary" id="summary">正在读取收藏资料数据库……</div>
<div class="results" id="results"><div class="loading">正在检索……</div></div>
</main>
<script>
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const U=s=>encodeURIComponent(s);
const params=new URLSearchParams(location.search); const q=document.getElementById('q'); const results=document.getElementById('results'); const summary=document.getElementById('summary');
q.value=params.get('q')||'';
async function json(path){try{const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return[];const d=await r.json();if(Array.isArray(d))return d;for(const k of ['records','items','data','articles'])if(Array.isArray(d?.[k]))return d[k];return[];}catch{return[]}}
async function listDir(path){try{const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return[];const d=await r.json();return Array.isArray(d)?d.filter(x=>x.type==='file'&&x.name.endsWith('.json')).map(x=>x.name.replace(/\.json$/,'')):[]}catch{return[]}}
function matches(x,kw){const s=[x.title,x.name,x.note,x.content,x.body,x.price,x.variety,x['品种'],x['价格']].filter(Boolean).join(' ').toLowerCase();return !kw||s.includes(kw)}
function card(x,cat){const title=x.title||x.name||x.variety||x['品种']||'未命名资料';const note=x.note||x.content||x.body||'';const isMarket=cat==='market';const href='detail.html?cat='+U(cat==='market'?('market_'+x._file):x._file)+'&id='+U(x.id||'');return '<article class="card"><div class="body"><div><span class="tag">'+(isMarket?'行情资料':'收藏资料')+'</span><span class="kind">'+E(x.category||x.kind||x._file||'')+'</span> <span class="date">'+E(x.date||'')+'</span></div><div class="title">'+E(title)+'</div>'+((x.price||x['价格'])?'<div class="price">参考价格：'+E(x.price||x['价格'])+'</div>':'')+'<div class="desc">'+E(note)+'</div><a class="go" href="'+href+'">查看详情 →</a></div></article>'}
async function boot(){const kw=(q.value||'').trim().toLowerCase();const [cf,mf]=await Promise.all([listDir('data/content'),listDir('data/market')]);let all=[];for(const f of cf){for(const x of await json('data/content/'+f+'.json')){if(x&&x.status!=='hidden'){all.push({...x,_file:f,_type:'content'})}}}for(const f of mf){for(const x of await json('data/market/'+f+'.json')){if(x){all.push({...x,_file:f,_type:'market'})}}}const found=all.filter(x=>matches(x,kw)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));document.title=(kw?'搜索“'+kw+'”｜':'')+'洪盛集藏';summary.textContent=kw?('找到 '+found.length+' 条相关资料。可继续输入关键词缩小范围。'):('当前可检索资料 '+all.length+' 条。');results.innerHTML=found.length?found.map(x=>card(x,x._type)).join(''):'<div class="empty">没有找到相关资料。试试“银元”“袁大头”“龙洋”“古钱”“纸币”“评级”等关键词。</div>'}
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();const v=(q.value||'').trim();location.href='search.html'+(v?'?q='+U(v):'')});
boot();
</script>
</body>
</html>
