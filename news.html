ms.map(x=>{const c=x.content||{};return `<article class="item"><h2>${esc(x.title||'收藏资料')}</h2><div class="date">${esc(x.date||'')} · ${esc(x.category||'收藏资讯')}</div><span class="badge">已筛选 · 已编辑 · ${esc((x.keywords||[]).slice(0,5).join(' · '))}</span><p class="summary"><strong>导读：</strong>${esc(c['导读']||'')}</p><p class="summary"><strong>内容摘要：</strong>${esc(c['内容摘要']||'')}</p><div class="focus"><strong>研究重点：</strong>${esc(c['研究重点']||'')}</div><div class="edit">${esc(c['编辑说明']||'')} · 资料来源：${esc(x.source||'公开资料')}</div></article>`}).join('')||'<div class="empty">暂无通过编辑筛选的资讯。系统会在下一轮采集后继续更新。</div>'}catch(e){document.getElementById('list').textContent='编辑资讯加载失败，请稍后刷新。'}}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load()</script></body></html>
