<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收藏资讯｜洪盛集藏</title><meta name="description" content="洪盛集藏自动采集、智能筛选、重新编辑并图片化展示钱币收藏资讯。"><style>body{margin:0;background:#f7f1e5;color:#30241d;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:25px 20px}.head{background:#24130f;color:#f0ddb5}.head h1{color:#efd18a}.item{background:#fffdf8;border:1px solid #e4d7bf;border-radius:14px;overflow:hidden;margin:16px 0}.item img{width:100%;aspect-ratio:16/7;object-fit:cover;background:#eadfc9}.body{padding:20px}.item h2{color:#7b1717;margin:0 0 8px;font-size:20px}.date{color:#9a805b;font-size:12px}.badge{display:inline-block;background:#efe0bf;color:#701515;border-radius:20px;padding:4px 9px;margin:8px 0;font-size:12px}.summary{line-height:1.9;color:#5f5142}.focus{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.focus div{background:#f3ead9;padding:12px;border-radius:8px;line-height:1.8}.edit{color:#8b765e;font-size:12px;margin-top:12px}.notice{background:#efe0bf;padding:16px;border-radius:10px;line-height:1.8}footer{background:#24130f;color:#c8b99f;margin-top:30px;padding:25px 0;line-height:1.8}.empty{text-align:center;padding:50px;color:#766650}@media(max-width:650px){.focus{grid-template-columns:1fr}}</style></head><body><header class="head"><div class="wrap"><h1>📰 洪盛集藏 · 智能编辑资讯</h1><p>自动采集 → 严格过滤 → 相关性判断 → 智能摘要 → 研究分析 → 本地图片化 → 站内发布。</p></div></header><main class="wrap"><div class="notice"><strong>本站采用站内内容模式。</strong>公开资料经过智能整理后直接展示。</div><div id="list">正在加载智能编辑内容…</div><p><a href="/">← 返回首页</a></p></main><footer><div class="wrap">🏮 洪盛集藏｜智能整理 · 图片化展示 · 学习交流参考</div></footer><script>async function load(){try{const r=await fetch('/data/intelligent_content.json?v='+Date.now());const d=await r.json();const items=d.items||[];document.getElementById('list').innerHTML=items.map(x=>{const c=x.content||{},a=x.analysis||{};return `<article class="item">${x.image?`<img src="${esc(x.image)}" alt="${esc(x.title||'收藏资料图')}">`:''}<div class="body"><h2>${esc(x.title||'收藏资料')}</h2><div class="date">${esc(x.date||'')} · ${esc(x.category||'收藏资讯')}</div><span class="badge">智能编辑 · ${esc((x.keywords||[]).slice(0,5).join(' · ')||'收藏研究')}</span><p class="summary"><strong>智能导读：</strong>${esc(a['智能导读']||c['导读']||'')}</p><p class="summary"><strong>核心分析：</strong>${esc(a['核心分析']||c['内容摘要']||'')}</p><div class="focus"><div><strong>鉴赏观察</strong><br>${esc(a['鉴赏观察']||'')}</div><div><strong>收藏提示</strong><br>${esc(a['收藏提示']||'')}</div></div><div class="edit">${esc(c['编辑说明']||'洪盛集藏智能整理稿')} · 图片：${esc(x.image_type||'站内资料图')} · 来源：${esc(x.source||'公开资料')}</div></div></article>`}).join('')||'<div class="empty">暂无通过智能筛选的资讯。</div>'}catch(e){document.getElementById('list').textContent='智能资讯加载失败，请稍后刷新。'}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load()</script></body></html>
