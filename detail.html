<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5a0b07"><title>洪盛收藏资讯网｜资料详情</title><style>body{margin:0;background:linear-gradient(180deg,#4d0806,#650f09 30%,#4b0806);color:#fff4dc;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.top{text-align:center;padding:10px;color:#f0d58a;border-bottom:1px solid #d6b35c55;background:#3c0504}.wrap{width:min(900px,92vw);margin:auto}.head{padding:28px 0;border-bottom:1px solid #d6b35c66}.head h1{text-align:center;color:#f5d88b;font:900 32px "Songti SC",STSong,serif}.box{background:linear-gradient(145deg,#73170f,#450705);border:1px solid #d7b45a66;margin:24px 0;padding:24px}.meta{color:#f0d58a;font-size:12px}.title{color:#ffe4a0;font:900 30px/1.45 "Songti SC",STSong,serif}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.gallery img{width:100%;max-height:520px;object-fit:contain;background:#fffaf0;padding:4px}.content{white-space:pre-wrap;font-size:16px;color:#ead7ba}.btn{display:inline-block;background:#75160f;border:1px solid #d7b45a;color:#ffe7a5;text-decoration:none;padding:9px 16px;border-radius:4px;font-weight:800}@media(max-width:600px){.gallery{grid-template-columns:1fr}.title{font-size:25px}}</style></head><body><div class="top">🏮 洪盛收藏资讯网 · 收藏交流 · 鉴赏参考 · 市场行情 · 钱币文化研究</div><header class="head"><div class="wrap"><h1>洪盛收藏资讯网</h1></div></header><main class="wrap"><div class="box" id="detail">正在读取资料……</div></main><script>const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const q=new URLSearchParams(location.search),cat=q.get('cat'),id=q.get('id'),box=document.getElementById('detail');function path(c){return c&&c.startsWith('market_')?'data/market/'+encodeURIComponent(c)+'.json':'data/content/'+encodeURIComponent(c||'')+'.json'}function records(d){if(Array.isArray(d))return d;for(const k of ['records','items','data','articles'])if(Array.isArray(d?.[k]))return d[k];return []}async function go(){if(!cat||!id){box.innerHTML='<h2>资料不存在</h2><a class="btn" href="./">返回网站</a>';return}try{const r=await fetch(path(cat)+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('data');const d=await r.json(),a=records(d),x=a.find(v=>String(v.id)===String(id));if(!x||x.status==='hidden')throw Error('notfound');const imgs=Array.isArray(x.images)?x.images:[];document.title=(x.title||'资料详情')+'｜洪盛收藏资讯网';box.innerHTML='<div class="meta">'+E(cat)+'　｜　'+E(x.date||'')+'</div><h2 class="title">'+E(x.title||'未命名资料')+'</h2>'+(x.price?'<p><b>参考价格：</b>'+E(x.price)+'</p>':'')+(x.note?'<p><b>摘要：</b>'+E(x.note)+'</p>':'')+(imgs.length?'<div class="gallery">'+imgs.map(i=>'<img src="'+E(i)+'" loading="lazy">').join('')+'</div>':'')+'<div class="content">'+E(x.content||'暂无详细文字资料。')+'</div><p><a class="btn" href="./">← 返回洪盛收藏资讯网</a></p>'}catch(e){box.innerHTML='<h2>资料暂时无法打开</h2><p>该内容文件不存在、内容未发布或正在更新。</p><a class="btn" href="./">返回网站</a>'}}go();</script></body></html>
