<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5a0b07"><title>洪盛收藏资讯网｜资料详情</title><style>body{margin:0;background:linear-gradient(180deg,#4d0806,#650f09 30%,#4b0806);color:#fff4dc;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.top{text-align:center;padding:10px;color:#f0d58a;border-bottom:1px solid #d6b35c55;background:#3c0504}.wrap{width:min(900px,92vw);margin:auto}.head{padding:28px 0;border-bottom:1px solid #d6b35c66}.head h1{text-align:center;color:#f5d88b;font:900 32px "Songti SC",STSong,serif}.box{background:linear-gradient(145deg,#73170f,#450705);border:1px solid #d7b45a66;margin:24px 0;padding:24px}.meta{color:#f0d58a;font-size:12px}.title{color:#ffe4a0;font:900 30px/1.45 "Songti SC",STSong,serif}.content{white-space:pre-wrap;font-size:16px;color:#ead7ba}.hint{background:#fff3d6;color:#5d3515;padding:14px;border-radius:6px;margin:16px 0}.btn{display:inline-block;background:#75160f;border:1px solid #d7b45a;color:#ffe7a5;text-decoration:none;padding:9px 16px;border-radius:4px;font-weight:800}</style></head><body><div class="top">🏮 洪盛收藏资讯网 · 收藏交流 · 鉴赏参考 · 市场行情 · 钱币文化研究</div><header class="head"><div class="wrap"><h1>洪盛收藏资讯网</h1></div></header><main class="wrap"><div class="box" id="detail">正在读取资料……</div></main><script>const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const q=new URLSearchParams(location.search),cat=q.get('cat'),id=q.get('id'),marketTitle=q.get('marketTitle'),box=document.getElementById('detail');function records(d){if(Array.isArray(d))return d;for(const k of ['records','items','data','articles'])if(Array.isArray(d?.[k]))return d[k];return []}async function loadMarket(title){const files=['fujian_tongqian','fujian_tongyuan','fujian_yinyuan','tongqian','tongyuan','yinyuan','yinyuan_jizhibi','zhibi'];for(const f of files){try{const r=await fetch('data/market/'+f+'.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)continue;const a=records(await r.json());const x=a.find(v=>String(v.title||v.name||v.品种||'')===String(title));if(x)return x}catch(e){}}return null}async function go(){try{if(marketTitle){const title=marketTitle;const x=await loadMarket(title);document.title=title+'｜每日行情｜洪盛收藏资讯网';box.innerHTML='<div class="meta">每日行情</div><h2 class="title">'+E(title)+'</h2>'+(x&&x.price?'<p><b>参考价格：</b>'+E(x.price)+'</p>':'')+(x&&x.note?'<p><b>行情说明：</b>'+E(x.note)+'</p>':'')+'<div class="hint">该页面为洪盛集藏市场行情资料详情页。行情价格会随品种、品相、版别、市场成交情况变化，仅供收藏学习与市场交流参考。</div>'+(x&&x.content?'<div class="content">'+E(x.content)+'</div>':'<div class="content">当前首页已有该行情栏目，但详细数据文件尚未同步到数据库。后续发布行情数据后，这里会自动显示完整内容。</div>')+'<p><a class="btn" href="./">← 返回网站</a></p>';return}if(!cat||!id){throw Error('missing')}const path=(cat.startsWith('market_')?'data/market/':'data/content/')+encodeURIComponent(cat.replace(/^market_/,''))+'.json';const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('data');const x=records(await r.json()).find(v=>String(v.id)===String(id));if(!x||x.status==='hidden')throw Error('notfound');document.title=(x.title||'资料详情')+'｜洪盛收藏资讯网';box.innerHTML='<div class="meta">'+E(cat)+'　｜　'+E(x.date||'')+'</div><h2 class="title">'+E(x.title||'未命名资料')+'</h2>'+(x.price?'<p><b>参考价格：</b>'+E(x.price)+'</p>':'')+(x.note?'<p><b>摘要：</b>'+E(x.note)+'</p>':'')+'<div class="content">'+E(x.content||'暂无详细文字资料。')+'</div><p><a class="btn" href="./">← 返回洪盛收藏资讯网</a></p>'}catch(e){box.innerHTML='<h2>资料暂时无法打开</h2><p>该内容已经进入详情页，但对应的数据文件目前没有匹配记录。</p><div class="hint">如果这是首页“每日行情”中的项目，可以返回首页继续浏览；以后后台录入该项目的详细行情后，详情页会自动显示。</div><p><a class="btn" href="./">← 返回洪盛收藏资讯网</a></p>'}}go();</script></body></html>
