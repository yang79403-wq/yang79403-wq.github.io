<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏｜资料详情</title><style>body{margin:0;background:#f6f0e4;color:#342820;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}.wrap{max-width:860px;margin:auto;padding:24px 18px}.card{background:#fffdf8;border:1px solid #e3d6bf;border-radius:14px;padding:24px}.back{color:#741712;text-decoration:none;font-weight:800}.meta{color:#8a7b6d;font-size:12px;margin-top:18px}.title{color:#741712;font:900 30px "Songti SC","Microsoft YaHei",serif;line-height:1.45}.note{color:#5d4c40;line-height:1.9;font-size:15px}.source{margin-top:22px;padding-top:16px;border-top:1px solid #e3d6bf;color:#766657;font-size:12px}.warn{margin-top:18px;background:#f5ead5;padding:12px;border-radius:8px;color:#6d5746;font-size:12px;line-height:1.7}</style></head><body><main class="wrap"><a class="back" href="section.html">← 返回版块</a><article class="card" id="app"><div class="meta">正在读取资料……</div></article></main><script>const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function boot(){const q=new URLSearchParams(location.search),cat=q.get('cat')||'',id=q.get('id')||'';const p=cat.startsWith('market_')?'data/market/'+cat+'.json':'data/content/'+cat+'.json';try{const r=await fetch(p+'?t='+Date.now());const arr=await r.json();const x=arr.find(v=>v.id===id);if(!x)throw 0;document.title=(x.title||'资料详情')+'｜洪盛集藏';app.innerHTML='<div class="meta">'+E(x.date||'收藏资料')+'　·　'+E(x.category||'资料')+'</div><h1 class="title">'+E(x.title||'资料详情')+'</h1><div class="note">'+E(x.note||x.content||'暂无摘要')+'</div><div class="source">资料来源：'+E(x.source||'洪盛集藏资料库')+'</div><div class="warn">'+E(x.disclaimer||'公开资料整理，仅供学习、研究与收藏交流参考。')+'</div>'}catch{app.innerHTML='<div class="meta">资料暂时无法读取。</div><h1 class="title">未找到该资料</h1>'}}boot()</script></body></html>
