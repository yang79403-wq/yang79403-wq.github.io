<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5a0b07"><title>洪盛集藏｜资料详情</title><style>body{margin:0;background:linear-gradient(180deg,#4d0806,#650f09 30%,#4b0806);color:#fff4dc;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.top{text-align:center;padding:10px;color:#f0d58a;border-bottom:1px solid #d6b35c55;background:#3c0504}.wrap{width:min(900px,92vw);margin:auto}.head{padding:28px 0;border-bottom:1px solid #d6b35c66}.head h1{text-align:center;color:#f5d88b;font:900 32px "Songti SC",STSong,serif}.box{background:linear-gradient(145deg,#73170f,#450705);border:1px solid #d7b45a66;margin:24px 0;padding:24px}.meta{color:#f0d58a;font-size:12px}.title{color:#ffe4a0;font:900 30px/1.45 "Songti SC",STSong,serif}.content{white-space:pre-wrap;font-size:16px;color:#ead7ba}.hint{background:#fff3d6;color:#5d3515;padding:14px;border-radius:6px;margin:16px 0}.btn{display:inline-block;background:#75160f;border:1px solid #d7b45a;color:#ffe7a5;text-decoration:none;padding:9px 16px;border-radius:4px;font-weight:800}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}.gallery img{width:100%;max-height:420px;object-fit:contain;background:#fff6e7;border-radius:6px;border:1px solid #d7b45a55}.price{font-size:17px;color:#ffe4a0;font-weight:800}@media(max-width:640px){.title{font-size:24px}.gallery{grid-template-columns:1fr}}</style></head><body><div class="top">🏮 洪盛集藏资讯网 · 收藏交流 · 鉴赏参考 · 市场行情 · 钱币文化研究</div><header class="head"><div class="wrap"><h1>洪盛集藏资讯网</h1></div></header><main class="wrap"><div class="box" id="detail">正在读取资料……</div></main><script>
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const q=new URLSearchParams(location.search),cat=q.get('cat'),id=q.get('id'),marketTitle=q.get('marketTitle'),box=document.getElementById('detail');
function records(d){if(Array.isArray(d))return d;if(!d||typeof d!=='object')return[];for(const k of ['records','items','data','articles'])if(Array.isArray(d[k]))return d[k];return[]}
function imgList(x){const a=Array.isArray(x?.images)?x.images:[];return a.filter(Boolean)}
function escUrl(u){try{return encodeURI(String(u))}catch{return String(u)}}
async function loadJson(path){const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function findById(folder,file,id){try{const d=await loadJson(folder+'/'+file+'.json');return records(d).find(v=>String(v?.id)===String(id))||null}catch{return null}}
async function loadMarketByTitle(title){const files=['fujian_tongqian','fujian_tongyuan','fujian_yinyuan','tongqian','tongyuan','yinyuan','yinyuan_jizhibi','zhibi'];for(const f of files){const x=await findByTitle('data/market',f,title);if(x)return x}return null}
async function findByTitle(folder,file,title){try{const d=await loadJson(folder+'/'+file+'.json');return records(d).find(v=>String(v?.title||v?.name||v?.品种||'')===String(title))||null}catch{return null}}
function render(x,label){const images=imgList(x);document.title=(x?.title||label||'资料详情')+'｜洪盛集藏';box.innerHTML='<div class="meta">'+E(label||'收藏资料')+'　｜　'+E(x?.date||'')+'</div><h2 class="title">'+E(x?.title||'未命名资料')+'</h2>'+(x?.price?'<p class="price">参考价格：'+E(x.price)+'</p>':'')+(x?.note?'<p><b>摘要：</b>'+E(x.note)+'</p>':'')+'<div class="content">'+E(x?.content||x?.body||'暂无详细文字资料。')+'</div>'+(images.length?'<div class="gallery">'+images.map(i=>'<img src="'+E(escUrl(i))+'" alt="'+E(x?.title||'藏品图片')+'">').join('')+'</div>':'')+'<div class="hint">本站内容为公益收藏学习、研究与交流资料。价格、品相、版别等信息仅供参考，不构成正式鉴定、交易报价或投资建议。</div><p><a class="btn" href="./">← 返回洪盛收藏资讯网</a></p>'}
async function go(){try{if(marketTitle){const x=await loadMarketByTitle(marketTitle);render(x,{toString(){return'每日行情'}}.toString()||'每日行情');return}if(!cat||!id)throw Error('missing');const x=await findById(cat.startsWith('market_')?'data/market':'data/content',cat.replace(/^market_/,'') ,id);if(!x||x.status==='hidden')throw Error('notfound');render(x,cat.startsWith('market_')?'每日行情':cat)}catch(e){box.innerHTML='<h2>资料暂时无法打开</h2><p>该内容已经进入详情页，但当前数据库没有找到对应记录。</p><div class="hint">请返回首页查看其他内容，或在后台重新发布/保存该内容。</div><p><a class="btn" href="./">← 返回网站</a></p>'}}go();
</script></body></html>
